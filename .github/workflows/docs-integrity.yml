name: AutoDraw Markdown integrity

on:
  push:
    branches:
      - feature/image-geometry-optimization
    paths:
      - "AutoDraw_Stage20/**/*.md"
      - "AutoDraw_Stage20/docs/HISTORY_SNAPSHOT_PROVENANCE.json"
      # Contract rows are checked against Python AST, not just Markdown links.
      - "AutoDraw_Stage20/source/**/*.py"
      - "AutoDraw_Stage20/geometry_models/**/*.py"
      - "AutoDraw_Stage20/shared_image_processing/**/*.py"
      - "AutoDraw_Stage20/tools/capability_catalog.py"
      - "AutoDraw_Stage20/tools/check_markdown_docs.py"
      - "AutoDraw_Stage20/tools/tests/test_check_markdown_docs.py"
      - ".github/workflows/docs-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autodraw-docs-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test Markdown auditing logic
        run: python -m unittest discover -s AutoDraw_Stage20/tools/tests -p "test_check_markdown_docs.py" -v
      - name: Audit navigation, decisions and source history hashes
        run: python AutoDraw_Stage20/tools/check_markdown_docs.py --root AutoDraw_Stage20 --report "$RUNNER_TEMP/docs-integrity.json"
      - name: Inventory static capability consumers and local import cycles
        run: |
          python AutoDraw_Stage20/tools/check_markdown_docs.py --root AutoDraw_Stage20 --usage > "$RUNNER_TEMP/capability-usage.json"
          python -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/capability-usage.json")); print(json.dumps({"source_files_scanned":d["source_files_scanned"],"capabilities":d["catalog_count"],"import_cycle_candidates":d["preparation_import_cycles"],"root_import_cycle_candidates":d["preparation_root_import_cycles"],"direct_calls":{c["id"]:[x["path"] for x in c["consumers"] if x["status"]=="DIRECT_CALL_CANDIDATE"] for c in d["capabilities"]}},ensure_ascii=False))'
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autodraw-markdown-integrity
          path: |
            ${{ runner.temp }}/docs-integrity.json
            ${{ runner.temp }}/capability-usage.json
          if-no-files-found: warn
          retention-days: 30
