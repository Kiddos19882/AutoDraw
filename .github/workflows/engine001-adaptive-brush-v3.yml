name: ENGINE-001 adaptive brush V3 two-icon native Egret diagnostic

on:
  push:
    branches:
      - feature/image-geometry-optimization
    paths:
      - ".github/workflows/engine001-adaptive-brush-v3.yml"
      - "AutoDraw_Stage20/tests/run_engine001_adaptive_brush_v3.py"
      - "AutoDraw_Stage20/tests/test_engine001_adaptive_brush_v3.py"
      - "AutoDraw_Stage20/tests/game_renderer_reference.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine001-adaptive-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mixed-brush-native-egret:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install consistent experiment requirements
        run: python -m pip install selenium Pillow numpy opencv-python-headless
      - name: Exercise V3, V2, V1 deterministic regression
        shell: pwsh
        run: |
          node --check AutoDraw_Stage20/tests/game_renderer_reference.js
          python -m unittest discover -s AutoDraw_Stage20/tests -p "test_engine001_adaptive_brush_v3.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s AutoDraw_Stage20/tests -p "test_engine001_painted_frontier_v2.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s AutoDraw_Stage20/tests -p "test_engine001_predictive_contour_probe.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Render source-bound adaptive centreline plan using actual Egret 5.4.1 WebGL
        shell: pwsh
        run: |
          python AutoDraw_Stage20/tests/run_engine001_adaptive_brush_v3.py --workspace . --output-dir "$env:RUNNER_TEMP\\engine001-adaptive-v3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native PNG, forecast, all candidates and negative results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-two-icon-adaptive-brush-v3
          path: ${{ runner.temp }}/engine001-adaptive-v3/
          if-no-files-found: warn
          retention-days: 30
