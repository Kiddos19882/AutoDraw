name: ENGINE-001 V17 AniLines brush1 source-bound offline paths

on:
  push:
    branches:
      - feature/image-geometry-optimization
    paths:
      - ".github/workflows/engine001-anilines-brush1-v17.yml"
      - "AutoDraw_Stage20/tests/run_engine001_anilines_brush1_v17.py"
      - "AutoDraw_Stage20/tests/test_engine001_anilines_brush1_v17.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-bound-paths:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline geometry dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2,<3" "opencv-python-headless>=4.10,<5" "Pillow>=11,<13" "scikit-image>=0.25,<0.27"
      - name: Run source guards and synthetic graph tests
        run: python -m unittest discover -s AutoDraw_Stage20/tests -p "test_engine001_anilines_brush1_v17.py" -v
      - name: Retrieve exact successful V14 AniLines artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/v14-anilines-frozen"
          gh run download 43653371987 --repo Kiddos19882/AutoDraw \
            -n engine001-v14-anilines-detail -D "$RUNNER_TEMP/v14-anilines-frozen"
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"])/"v14-anilines-frozen"/"line-output.png"
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          expect = "2d4220381e18a86400e4afa950caa064ada5fe1adc821c9a230239cb91848f3b"
          if actual != expect:
              raise SystemExit("Frozen V14 AniLines PNG checksum mismatch: "+actual)
          print("V14 exact AniLines artifact SHA",actual)
          PY
      - name: Generate opt-in offline brush1 contour plan
        run: |
          python AutoDraw_Stage20/tests/run_engine001_anilines_brush1_v17.py \
            --source AutoDraw_Stage20/testImages/wV6VeZI9S1Y.png \
            --anilines "$RUNNER_TEMP/v14-anilines-frozen/line-output.png" \
            --output "$RUNNER_TEMP/engine001-v17"
          python - <<'PY'
          import json, os, hashlib
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"engine001-v17"
          j=json.loads((root/"report.json").read_text())
          m=j["metrics"]
          assert j["status"]=="OFFLINE_EXPLORATORY_NON_NATIVE"
          assert 0<m["stroke_paths"]<=4000
          assert 0<m["synthetic_vertices"]<=30000
          assert m["source_path_raster_foreign_line_pixels_beyond1px"]==0
          for name,digest in j["images_sha256"].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest
          assert hashlib.sha256((root/"strokes.json").read_bytes()).hexdigest()==j["strokes_json_sha256"]
          print("V17 offline schema/source/evidence guards PASS; recognizability NOT TESTED")
          PY
      - name: Publish preview and raw paths, not native game proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-v17-anilines-brush1-offline
          path: ${{ runner.temp }}/engine001-v17
          if-no-files-found: warn
