name: ENGINE-001 V18 AniLines junction repair A/B

on:
  push:
    branches:
      - feature/image-geometry-optimization
    paths:
      - ".github/workflows/engine001-anilines-junction-v18.yml"
      - "AutoDraw_Stage20/tests/run_engine001_anilines_junction_v18.py"
      - "AutoDraw_Stage20/tests/test_engine001_anilines_junction_v18.py"
      - "AutoDraw_Stage20/tests/run_engine001_anilines_brush1_v17.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  graph-continuity-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2,<3" "opencv-python-headless>=4.10,<5" "Pillow>=11,<13" "scikit-image>=0.25,<0.27"
      - name: Run V18 synthetic topology tests
        run: python -m unittest discover -s AutoDraw_Stage20/tests -p "test_engine001_anilines_junction_v18.py" -v
      - name: Download frozen V14 AniLines and V17 comparison output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/v14" "$RUNNER_TEMP/v17"
          gh run download 43653371987 --repo Kiddos19882/AutoDraw \
            -n engine001-v14-anilines-detail -D "$RUNNER_TEMP/v14"
          gh run download 43676075893 --repo Kiddos19882/AutoDraw \
            -n engine001-v17-anilines-brush1-offline -D "$RUNNER_TEMP/v17"
          python - <<'PY'
          from pathlib import Path
          import hashlib, os
          root=Path(os.environ["RUNNER_TEMP"])
          exact={
           "v14/line-output.png":"2d4220381e18a86400e4afa950caa064ada5fe1adc821c9a230239cb91848f3b",
           "v17/contour-roi-150x240.png":""
          }
          for filename, expected in exact.items():
              path=root/filename
              if not path.exists():raise RuntimeError("Frozen comparison input missing: "+filename)
              digest=hashlib.sha256(path.read_bytes()).hexdigest()
              if expected and digest!=expected:
                  raise RuntimeError("V14 pinned output SHA mismatch")
              print("V18 input", filename, digest)
          PY
      - name: Run preregistered A/B offline geometry
        run: |
          python AutoDraw_Stage20/tests/run_engine001_anilines_junction_v18.py \
            --source AutoDraw_Stage20/testImages/wV6VeZI9S1Y.png \
            --anilines "$RUNNER_TEMP/v14/line-output.png" \
            --v17-roi "$RUNNER_TEMP/v17/contour-roi-150x240.png" \
            --output "$RUNNER_TEMP/engine001-v18"
      - name: Check generated evidence and fail-closed line safety
        run: |
          python - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"engine001-v18"
          report=json.loads((root/"report.json").read_text())
          assert report["status"]=="OFFLINE_NON_NATIVE_RESEARCH"
          for variant in ("A","B"):
              r=report[variant]
              assert r["source_foreign_beyond1px"]==0
              assert 0<r["paths"]<=4000 and 0<r["vertices"]<=30000
              assert r["retained_graph_chain_count"]<=r["raw_chains"]
          for name,digest in report["artifacts_sha256"].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest
          print("V18 source-bound A/B offline guards PASS, native and CHALK NOT_RUN")
          PY
      - name: Preserve all previews, paths and negative outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-v18-anilines-junction-ab
          path: ${{ runner.temp }}/engine001-v18
          if-no-files-found: warn
