name: ENGINE-001 V19 AniLines V18-B loss and color audit

on:
  push:
    branches:
      - feature/image-geometry-optimization
    paths:
      - ".github/workflows/engine001-anilines-v19-audit.yml"
      - "AutoDraw_Stage20/tests/run_engine001_anilines_v19_audit.py"
      - "AutoDraw_Stage20/tests/test_engine001_anilines_v19_audit.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  frozen-v18-b-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline diagnostic dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2,<3" "opencv-python-headless>=4.10,<5" "Pillow>=11,<13" "scikit-image>=0.25,<0.27"
      - name: V19 source SHA and synthetic component guards
        run: python -m unittest discover -s AutoDraw_Stage20/tests -p "test_engine001_anilines_v19_audit.py" -v
      - name: Fetch authentic frozen V14 and V18 output artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/frozen-v14" "$RUNNER_TEMP/frozen-v18"
          gh run download 43653371987 --repo Kiddos19882/AutoDraw \
            -n engine001-v14-anilines-detail -D "$RUNNER_TEMP/frozen-v14"
          gh run download 43677851946 --repo Kiddos19882/AutoDraw \
            -n engine001-v18-anilines-junction-ab -D "$RUNNER_TEMP/frozen-v18"
          python - <<'PY'
          import hashlib, os, zipfile
          from pathlib import Path
          base=Path(os.environ["RUNNER_TEMP"])
          v14=base/"frozen-v14"/"line-output.png"
          assert hashlib.sha256(v14.read_bytes()).hexdigest()=="2d4220381e18a86400e4afa950caa064ada5fe1adc821c9a230239cb91848f3b"
          archived=base/"v18-bound.zip"
          with zipfile.ZipFile(archived,"w",compression=zipfile.ZIP_DEFLATED) as z:
              for source in sorted((base/"frozen-v18").iterdir()):
                  if source.is_file():
                      z.write(source,source.name)
          print("V18 frozen files",sorted(p.name for p in (base/"frozen-v18").iterdir()))
          PY
      - name: Measure V19 misses and palette neighborhood proxies
        run: |
          python AutoDraw_Stage20/tests/run_engine001_anilines_v19_audit.py \
            --source AutoDraw_Stage20/testImages/wV6VeZI9S1Y.png \
            --anilines "$RUNNER_TEMP/frozen-v14/line-output.png" \
            --v18-zip "$RUNNER_TEMP/v18-bound.zip" \
            --output "$RUNNER_TEMP/engine001-v19"
          python - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          folder=Path(os.environ["RUNNER_TEMP"])/"engine001-v19"
          report=json.loads((folder/"report.json").read_text())
          m=report["metrics"]
          assert m["skeleton_pixels"]==5943 and m["covered_1px"]==5792
          assert m["missed_1px"]==151 and m["missed_components"]==83
          assert sum(m["owner_label_counts"].values())==m["logical_ink_pixels"]
          assert all(hashlib.sha256((folder/n).read_bytes()).hexdigest()==h
                     for n,h in report["derived_sha256"].items())
          assert report["status"]=="OFFLINE_DIAGNOSTIC_ONLY_NOT_NATIVE"
          print("V19 audit reproducibility PASS, not image-quality or game PASS")
          PY
      - name: Publish V19 diagnostic PNG/JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-v19-anilines-missing-color-audit
          path: ${{ runner.temp }}/engine001-v19
          if-no-files-found: warn
