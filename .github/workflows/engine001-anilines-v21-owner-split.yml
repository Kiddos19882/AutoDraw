name: ENGINE-001 V21 AniLines color-owner splitting

on:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - ".github/workflows/engine001-anilines-v21-owner-split.yml"
      - "AutoDraw_Stage20/tests/run_engine001_anilines_v21.py"
      - "AutoDraw_Stage20/tests/test_engine001_anilines_v21.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  frozen-v21:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline dependencies
        run: |
          python -m pip install "numpy>=2,<3" "opencv-python-headless>=4.10,<5" "Pillow>=11,<13" "scikit-image>=0.25,<0.27"
      - name: V21 synthetic fail-closed guards
        run: python -m unittest discover -s AutoDraw_Stage20/tests -p "test_engine001_anilines_v21.py" -v
      - name: Get authentic source-bound V14 and V18
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/v14" "$RUNNER_TEMP/v18"
          gh run download 43653371987 --repo Kiddos19882/AutoDraw -n engine001-v14-anilines-detail -D "$RUNNER_TEMP/v14"
          gh run download 43677851946 --repo Kiddos19882/AutoDraw -n engine001-v18-anilines-junction-ab -D "$RUNNER_TEMP/v18"
          python - <<'PY'
          import hashlib,os,zipfile
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])
          a=p/"v14"/"line-output.png"
          assert hashlib.sha256(a.read_bytes()).hexdigest()=="2d4220381e18a86400e4afa950caa064ada5fe1adc821c9a230239cb91848f3b"
          with zipfile.ZipFile(p/"v18-frozen.zip","w",compression=zipfile.ZIP_DEFLATED) as z:
              for f in sorted((p/"v18").iterdir()):
                  if f.is_file():z.write(f,f.name)
          PY
      - name: V21 source geometry and owner guard
        run: |
          python AutoDraw_Stage20/tests/run_engine001_anilines_v21.py \
            --source AutoDraw_Stage20/testImages/wV6VeZI9S1Y.png \
            --anilines "$RUNNER_TEMP/v14/line-output.png" \
            --v18-zip "$RUNNER_TEMP/v18-frozen.zip" \
            --output "$RUNNER_TEMP/engine001-v21"
          python - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"engine001-v21"
          data=json.loads((p/"report.json").read_text())
          m=data["metrics"]
          assert m["skeleton_pixels"]==5943 and m["v18_supported_1px"]==5792
          assert m["v20_supported_1px"]==5812 and m["v21_supported_1px"]>=5812
          assert m["ambiguous_original_components"]==23
          assert m["v21_source_foreign_beyond1px"]==m["v21_owner_guard_violations"]==0
          assert all(hashlib.sha256((p/f).read_bytes()).hexdigest()==h
                     for f,h in data["artifacts_sha256"].items())
          print("V21 E3 geometry and diagnostic:",data["geometry_result"])
          PY
      - name: Upload V21 immutable diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-v21-owner-split-evidence
          path: ${{ runner.temp }}/engine001-v21
          if-no-files-found: warn
