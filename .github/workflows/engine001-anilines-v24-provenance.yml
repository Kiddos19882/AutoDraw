name: ENGINE-001 V24 Native Egret blank-control provenance

on:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - ".github/workflows/engine001-anilines-v24-provenance.yml"
      - "AutoDraw_Stage20/tests/game_renderer_reference.js"
      - "AutoDraw_Stage20/tests/run_engine001_anilines_v24.py"
      - "AutoDraw_Stage20/tests/test_engine001_anilines_v24.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-alpha-provenance:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install "selenium>=4,<5" "Pillow>=11,<13" "numpy>=2,<3" "opencv-python-headless>=4.10,<5" "scikit-image>=0.25,<0.27"
      - name: JS renderer syntax, existing reference regression and V24 synthetic guards
        shell: pwsh
        run: |
          node --check AutoDraw_Stage20/tests/game_renderer_reference.js
          node --test AutoDraw_Stage20/tests/game_renderer_reference.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s AutoDraw_Stage20/tests -p "test_engine001_anilines_v24.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch immutable V14, V18-B, V22 and V23
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/v14" "$RUNNER_TEMP/v18" "$RUNNER_TEMP/v22" "$RUNNER_TEMP/v23"
          gh run download 43653371987 --repo Kiddos19882/AutoDraw -n engine001-v14-anilines-detail -D "$RUNNER_TEMP/v14"
          gh run download 43677851946 --repo Kiddos19882/AutoDraw -n engine001-v18-anilines-junction-ab -D "$RUNNER_TEMP/v18"
          gh run download 43683615871 --repo Kiddos19882/AutoDraw -n engine001-v22-palette-proxy-evidence -D "$RUNNER_TEMP/v22"
          gh run download 43684612466 --repo Kiddos19882/AutoDraw -n engine001-v23-native-width1-evidence -D "$RUNNER_TEMP/v23"
          python - <<'PY'
          import hashlib,os,zipfile,sys
          from pathlib import Path
          base=Path(os.environ["RUNNER_TEMP"])
          assert hashlib.sha256((base/"v14"/"line-output.png").read_bytes()).hexdigest()=="2d4220381e18a86400e4afa950caa064ada5fe1adc821c9a230239cb91848f3b"
          with zipfile.ZipFile(base/"v18-bound.zip","w",compression=zipfile.ZIP_DEFLATED) as out:
              for p in sorted((base/"v18").iterdir()):
                  if p.is_file():out.write(p,p.name)
          sys.path.insert(0,"AutoDraw_Stage20/tests")
          from run_engine001_anilines_v19_audit import frozen_b
          mask,roi=frozen_b(base/"v18-bound.zip")
          assert int(mask.sum())>0 and roi.shape==(240,150,3)
          print("Frozen V18 authentic control PASS")
          PY
      - name: Reproduce 89 real Egret cases and blank control (fail closed)
        shell: pwsh
        run: |
          python AutoDraw_Stage20/tests/run_engine001_anilines_v24.py --workspace . --v22 "$env:RUNNER_TEMP/v22" --v23 "$env:RUNNER_TEMP/v23" --source AutoDraw_Stage20/testImages/wV6VeZI9S1Y.png --ani "$env:RUNNER_TEMP/v14/line-output.png" --output "$env:RUNNER_TEMP/v24-result"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c 'import json,os,hashlib,pathlib;p=pathlib.Path(os.environ["RUNNER_TEMP"])/"v24-result";r=json.loads((p/"report.json").read_text());assert r["metrics"]["native_cases_reproduced"]==89 and r["metrics"]["blank_alpha_pixels"]==0 and r["metrics"]["baseline_source_support"]==5812 and not r["geometry_modified"];assert all(hashlib.sha256((p/n).read_bytes()).hexdigest()==h for n,h in r["artifacts_sha256"].items());print("V24 archived native provenance E3 PASS; not game")'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve raw V24 alpha coordinates and negative control
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-v24-native-alpha-provenance-evidence
          path: ${{ runner.temp }}/v24-result
          if-no-files-found: warn
