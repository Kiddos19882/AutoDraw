name: ENGINE-001 B1-R P4A2 all Egret brush widths 1 to 10
on:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - '.github/workflows/engine001-b1r-p4a2-native-brush-widths1to10.yml'
      - 'AutoDraw_Stage20/tests/run_engine001_b1r_p4a2_native_brush_widths.py'
      - 'AutoDraw_Stage20/docs/ENGINE001_B1R_P4A2_NATIVE_WIDTHS_1_TO_10_PREREG_2026-11-18.md'
      - 'AutoDraw_Stage20/tests/test_engine001_b1r_p4a2_native_brush_widths.py'
      - 'AutoDraw_Stage20/tests/game_renderer_reference.js'
      - 'AutoDraw_Stage20/tests/run_engine001_complex_holdout_v5.py'
      - 'AutoDraw_Stage20/tests/run_engine001_b1r_p3d_source_edge_mask_ablation.py'
      - 'AutoDraw_Stage20/tests/run_engine001_b1r_p3c_source_coherence.py'
      - 'AutoDraw_Stage20/tests/run_engine001_b1r_p3b_engine128_adaptive32.py'
      - 'AutoDraw_Stage20/testImages/wV6VeZI9S1Y.png'
      - 'AutoDraw_Stage20/gameEngine/main.min_653f95bc.js'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine001-b1r-p4a2-native10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actual-egret-widths-1-to-10:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Bounded checkout
        uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false
      - name: Python3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned Python native pipeline
        shell: bash
        run: |
          python -m pip install selenium==4.38.0 numpy==2.2.6 opencv-python-headless==4.11.0.86 Pillow==11.3.0 scikit-image==0.25.2 scipy==1.15.3 requests==2.32.5
      - name: P4A2 E2 and old renderer regressions, Markdown quality
        shell: bash
        run: |
          python -m py_compile AutoDraw_Stage20/tests/run_engine001_b1r_p4a2_native_brush_widths.py AutoDraw_Stage20/tests/test_engine001_b1r_p4a2_native_brush_widths.py AutoDraw_Stage20/tests/run_engine001_complex_holdout_v5.py
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_b1r_p4a2_native_brush_widths.py -v
          node --check AutoDraw_Stage20/tests/game_renderer_reference.js
          node --test AutoDraw_Stage20/tests/game_renderer_reference.test.js
          python AutoDraw_Stage20/tools/check_markdown_docs.py --root AutoDraw_Stage20
      - name: Original-only P3D E/F with true Egret WebGL all ten sizes
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python AutoDraw_Stage20/tests/run_engine001_b1r_p4a2_native_brush_widths.py \
            --workspace . \
            --source AutoDraw_Stage20/testImages/wV6VeZI9S1Y.png \
            --engine-js AutoDraw_Stage20/gameEngine/main.min_653f95bc.js \
            --renderer AutoDraw_Stage20/tests/game_renderer_reference.js \
            --output "$RUNNER_TEMP/engine001-b1r-p4a2-native10"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"engine001-b1r-p4a2-native10"
          r=json.loads((root/"report.json").read_text(encoding="utf8"))
          assert r["experiment"]=="ENGINE001_B1R_P4A2_NATIVE_BRUSH_WIDTHS_1_TO_10_V1"
          assert r["github_sha"]==os.environ["GITHUB_SHA"]
          assert r["github_run_id"]==os.environ["GITHUB_RUN_ID"]
          assert r["widths"]==list(range(1,11))
          assert r["all_10_widths_have_actual_native_Egret_RGBA"] is True
          assert r["all_40_native_source_EF_direction_comparisons"]==40
          assert r["source_SHA256"]=="07cc4568cb5e90d9514bc6f6c2112fee623f87f8fd0cea02fa517b04108e502a"
          assert r["engine_blob_sha1"]=="46cc74de00b6cb5d207b1e1a2ffcd81613b6d388"
          assert r["renderer_parent_git_blob_sha1"]=="c6df789a22b6ae0d205829d5858afff99b1bb4c2"
          assert r["renderer_optin_git_blob_sha1"]=="76d950e0a8911888a9df3b675b866519ecf7bba4"
          assert r["source_P3D_recomputed_original_only"] is True
          assert r["legacy_G32_V44_P4c1_inputs_used"] is False
          assert r["P3D_frozen_archive_used_as_input"] is False
          assert r["actual_game_runtime_E4"]=="NOT_RUN"
          assert r["exact_run_bound_CHALK"] is None
          assert r["production_promotion"] is False
          assert r["status"] in ["PASS_ALL_10_NATIVE_ISOLATED_3PX",
                                 "NATIVE_ISOLATED_PARTIAL_QUALITY_FAIL"]
          for n,expected in r["file_sha256"].items():
            assert hashlib.sha256((root/n).read_bytes()).hexdigest()==expected,n
          for width in range(1,11):
            d=root/f"native-width-{width:02}"
            assert (d/f"P4A2-W{width:02}-composite.png").is_file()
            assert (d/f"P4A2-W{width:02}-blank.png").is_file()
            print("NATIVE_WIDTH",width,"E_F",
                  {method:{orientation:item["native_quality_pass_at_alpha24"]
                           for orientation,item in r["all_widths"][str(width)]["methods"][method].items()}
                   for method in ["E_SOBEL90","F_SOBEL90_LAB12"]})
          print("P4A2_TECHNICAL_NATIVE_RGBA_E3_PASS_MEMBER_HASH",
                len(r["file_sha256"]))
          print("P4A2_QUALITY_STATUS",r["status"])
          print("NATIVE_E3_IS_NOT_LIVE_E4_NOT_EXACT_CHALK")
          PY
      - name: Always save one ZIP with all 10 widths, native controls, failures and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-b1r-p4a2-all10-true-egret-brush-one-zip
          path: ${{ runner.temp }}/engine001-b1r-p4a2-native10/
          if-no-files-found: warn
          retention-days: 30
