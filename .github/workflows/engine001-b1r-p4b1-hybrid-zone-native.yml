name: ENGINE-001 B1-R P4B1 original-only adaptive zone coverage Egret A vs B
on:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - '.github/workflows/engine001-b1r-p4b1-hybrid-zone-native.yml'
      - 'AutoDraw_Stage20/tests/run_engine001_b1r_p4b1_hybrid_zone_coverage.py'
      - 'AutoDraw_Stage20/tests/test_engine001_b1r_p4b1_hybrid_zone_coverage.py'
      - 'AutoDraw_Stage20/tests/run_engine001_b1r_p3d_source_edge_mask_ablation.py'
      - 'AutoDraw_Stage20/tests/run_engine001_b1r_p3c_source_coherence.py'
      - 'AutoDraw_Stage20/tests/run_engine001_b1r_p3b_engine128_adaptive32.py'
      - 'AutoDraw_Stage20/tests/run_engine001_complex_holdout_v5.py'
      - 'AutoDraw_Stage20/tests/game_renderer_reference.js'
      - 'AutoDraw_Stage20/docs/ENGINE001_B1R_P4B1_HYBRID_ZONE_COVERAGE_PREREG_2026-11-18.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine001-b1r-p4b1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-original-zone-native:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout bounded
        timeout-minutes: 5
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned original-source and native WebGL dependencies
        shell: bash
        run: |
          python -m pip install selenium==4.38.0 numpy==2.2.6 opencv-python-headless==4.11.0.86 Pillow==11.3.0 scikit-image==0.25.2 scipy==1.15.3 requests==2.32.5
      - name: Source safety E2 plus existing real-Egret renderer JS contracts
        shell: bash
        run: |
          python -m py_compile AutoDraw_Stage20/tests/run_engine001_b1r_p4b1_hybrid_zone_coverage.py AutoDraw_Stage20/tests/test_engine001_b1r_p4b1_hybrid_zone_coverage.py
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_b1r_p4b1_hybrid_zone_coverage.py -v
          node --check AutoDraw_Stage20/tests/game_renderer_reference.js
          node --test AutoDraw_Stage20/tests/game_renderer_reference.test.js
          python AutoDraw_Stage20/tools/check_markdown_docs.py --root AutoDraw_Stage20
      - name: Restore pinned source blob bytes without Windows CRLF conversion
        shell: bash
        run: |
          python - <<'PY'
          import subprocess,hashlib
          from pathlib import Path
          for path,expected in {
            "AutoDraw_Stage20/gameEngine/main.min_653f95bc.js":
              "46cc74de00b6cb5d207b1e1a2ffcd81613b6d388",
            "AutoDraw_Stage20/tests/game_renderer_reference.js":
              "76d950e0a8911888a9df3b675b866519ecf7bba4",
          }.items():
            raw=subprocess.check_output(["git","show","HEAD:"+path])
            blob=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
            assert blob==expected,(path,blob,expected)
            Path(path).write_bytes(raw)
            assert Path(path).read_bytes()==raw
            print("P4B1_PINNED_GIT_BLOB",path,len(raw),blob)
          PY
      - name: Recompute original P3D for all 4 sources and Egret source-owner four A/B scenes
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python AutoDraw_Stage20/tests/run_engine001_b1r_p4b1_hybrid_zone_coverage.py \
            --workspace . \
            --source AutoDraw_Stage20/testImages/wV6VeZI9S1Y.png \
            --engine-js AutoDraw_Stage20/gameEngine/main.min_653f95bc.js \
            --renderer AutoDraw_Stage20/tests/game_renderer_reference.js \
            --output "$RUNNER_TEMP/engine001-b1r-p4b1"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"engine001-b1r-p4b1"
          r=json.loads((root/"report.json").read_text(encoding="utf8"))
          assert r["experiment"]=="ENGINE001_B1R_P4B1_HYBRID_OWNER_COVERAGE_V1"
          assert r["github_sha"]==os.environ["GITHUB_SHA"]
          assert r["github_run_id"]==os.environ["GITHUB_RUN_ID"]
          assert r["source_SHA256"]=="07cc4568cb5e90d9514bc6f6c2112fee623f87f8fd0cea02fa517b04108e502a"
          assert r["engine_git_blob_SHA1"]=="46cc74de00b6cb5d207b1e1a2ffcd81613b6d388"
          assert r["renderer_git_blob_SHA1"]=="76d950e0a8911888a9df3b675b866519ecf7bba4"
          assert r["P3D_original_only_recomputed"] is True
          assert r["P3D_all8_source_quality_pass"] is True
          assert r["legacy_G32_P4c1_V44_as_input"] is False
          assert r["original_P3D_frozen_ZIP_as_input"] is False
          assert r["source_keys"]==["C_096_D_BORDER","C_096_D_COMPONENT24",
                                   "C_192_D_BORDER","C_192_D_COMPONENT24"]
          assert r["methods"]==["E_SOBEL90","F_SOBEL90_LAB12"]
          assert r["strategy_names"]==["A_ORIENTED","B_CONTOUR_HYBRID"]
          assert r["widths"]==list(range(10,0,-1))
          assert r["native_4_scenes_captured"] is True
          assert r["actual_game_E4"]=="NOT_RUN"
          assert r["exact_run_bound_CHALK"] is None
          assert r["production_promotion"] is False
          assert r["result"] in ["NATIVE_COMPONENT_ALL_4_PASS",
                                 "NATIVE_COMPONENT_QUALITY_NOT_ALL_PASS"]
          checked=0
          for key,src in r["source_results"].items():
            assert src["source_common_owner"]["common_intersection_pixels"]>=256
            for method,planners in src["methods"].items():
              assert set(planners)=={"A_ORIENTED","B_CONTOUR_HYBRID"}
              for name,item in planners.items():
                d=item["model"]
                assert d["strokes_count"]<=250
                assert d["synthetic_vertices_NOT_CHALK"]<=500
                assert 0<=d["model_coverage_NOT_NATIVE"]<=1
                if key==r["native_source_key"]:
                  assert item["native_status"] in {
                      "NATIVE_COMPONENT_PASS","NATIVE_COMPONENT_QUALITY_FAIL",
                      "BUDGET_LIMITED"}
                  assert item["native"] is not None
                  assert item["native"]["real_Egret_BoardPane_renderer"] is True
                  assert (root/("NATIVE_"+method+"_"+name)).is_dir()
                  print("P4B1_NATIVE_RESULT",method,name,item["native_status"],
                        "alpha24",item["native"]["alpha_masks"]["24"])
                  checked+=1
                else:
                  assert item["native_status"]=="NOT_RUN"
          assert checked==4
          for file,want in r["file_sha256"].items():
            assert hashlib.sha256((root/file).read_bytes()).hexdigest()==want,file
          print("P4B1_SHA256_MANIFEST_PASS",len(r["file_sha256"]))
          print("P4B1_TECHNICAL_E3_NATIVE_SCENES_COMPLETE_QUALITY_SEPARATE",r["result"])
          print("P4B1_NATIVE_E3_ONLY_NOT_E4_OR_CHALK")
          PY
      - name: Always preserve one ZIP with original E/F, candidate models, real native PNG, negatives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-b1r-p4b1-original-zone-native-A-vs-B-one-zip
          path: ${{ runner.temp }}/engine001-b1r-p4b1/
          retention-days: 30
          if-no-files-found: warn
