name: ENGINE-001 B1-R P4B3 native Egret subpixel raster phase x y xy
on:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - '.github/workflows/engine001-b1r-p4b3-native-grid-phase.yml'
      - 'AutoDraw_Stage20/tests/run_engine001_b1r_p4b3_native_grid_phase.py'
      - 'AutoDraw_Stage20/tests/test_engine001_b1r_p4b3_native_grid_phase.py'
      - 'AutoDraw_Stage20/tests/run_engine001_b1r_p4b2_native_edge_repair.py'
      - 'AutoDraw_Stage20/tests/run_engine001_b1r_p4b1_hybrid_zone_coverage.py'
      - 'AutoDraw_Stage20/tests/run_engine001_complex_holdout_v5.py'
      - 'AutoDraw_Stage20/tests/game_renderer_reference.js'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine001-b1r-p4b3-native-grid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-grid-phase:
    runs-on: windows-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 1
          submodules: false
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned Egret math and Selenium dependencies
        shell: bash
        run: |
          python -m pip install selenium==4.38.0 numpy==2.2.6 opencv-python-headless==4.11.0.86 Pillow==11.3.0 scikit-image==0.25.2 scipy==1.15.3 requests==2.32.5
      - name: P4B3 E2 and inherited source+renderer regressions and docs audit
        shell: bash
        run: |
          python -m py_compile AutoDraw_Stage20/tests/run_engine001_b1r_p4b3_native_grid_phase.py AutoDraw_Stage20/tests/test_engine001_b1r_p4b3_native_grid_phase.py
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_b1r_p4b3_native_grid_phase.py -v
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_b1r_p4b2_native_edge_repair.py -v
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_b1r_p4b1_hybrid_zone_coverage.py -v
          node --check AutoDraw_Stage20/tests/game_renderer_reference.js
          node --test AutoDraw_Stage20/tests/game_renderer_reference.test.js
          python AutoDraw_Stage20/tools/check_markdown_docs.py --root AutoDraw_Stage20
      - name: Restore exact pinned engine/renderer and parent source Git blobs
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,subprocess
          from pathlib import Path
          frozen={
            "AutoDraw_Stage20/gameEngine/main.min_653f95bc.js":
              "46cc74de00b6cb5d207b1e1a2ffcd81613b6d388",
            "AutoDraw_Stage20/tests/game_renderer_reference.js":
              "76d950e0a8911888a9df3b675b866519ecf7bba4",
            "AutoDraw_Stage20/tests/run_engine001_b1r_p4b1_hybrid_zone_coverage.py":
              "b95aa361cf2ec94d5fa28e7309bd3e4af15eca93",
            "AutoDraw_Stage20/tests/run_engine001_b1r_p4b2_native_edge_repair.py":
              "0053829480c6327ef5c541024593f6e0018aa35e",
          }
          for path,want in frozen.items():
            raw=subprocess.check_output(["git","show","HEAD:"+path])
            actual=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
            assert actual==want,(path,actual,want)
            Path(path).write_bytes(raw)
            assert Path(path).read_bytes()==raw
            print("P4B3_PINNED_GIT_BLOB",path,actual)
          PY
      - name: Original-only same-run P4B1 then P4B2 then three P4B3 native phase variants E F
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python AutoDraw_Stage20/tests/run_engine001_b1r_p4b3_native_grid_phase.py \
            --workspace . \
            --source AutoDraw_Stage20/testImages/wV6VeZI9S1Y.png \
            --engine-js AutoDraw_Stage20/gameEngine/main.min_653f95bc.js \
            --renderer AutoDraw_Stage20/tests/game_renderer_reference.js \
            --output "$RUNNER_TEMP/engine001-b1r-p4b3"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"engine001-b1r-p4b3"
          r=json.loads((root/"report.json").read_text(encoding="utf8"))
          assert r["experiment"]=="ENGINE001_B1R_P4B3_NATIVE_GRID_PHASE_V1"
          assert r["github_sha"]==os.environ["GITHUB_SHA"]
          assert r["github_run_id"]==os.environ["GITHUB_RUN_ID"]
          assert r["source_SHA256"]=="07cc4568cb5e90d9514bc6f6c2112fee623f87f8fd0cea02fa517b04108e502a"
          assert r["engine_git_blob_sha1"]=="46cc74de00b6cb5d207b1e1a2ffcd81613b6d388"
          assert r["renderer_git_blob_sha1"]=="76d950e0a8911888a9df3b675b866519ecf7bba4"
          assert r["p4b1_source_runner_blob_sha1"]=="b95aa361cf2ec94d5fa28e7309bd3e4af15eca93"
          assert r["p4b2_source_runner_blob_sha1"]=="0053829480c6327ef5c541024593f6e0018aa35e"
          assert r["source_original_only_P4B1_P4B2_recomputed"] is True
          assert r["frozen_P4B1_P4B2_archive_used_as_input"] is False
          assert r["legacy_G32_V44_P4c1_candidate_used"] is False
          assert r["methods"]==["E_SOBEL90","F_SOBEL90_LAB12"]
          assert r["phases"]=={
              "S_X25":[.25,0.0],
              "S_Y25":[0.0,.25],
              "S_XY25":[.25,.25]
          }
          assert r["fixed_resource_stroke_cap"]==250
          assert r["fixed_resource_vertices_cap_NOT_CHALK"]==500
          assert r["native_coverage_gate"]==.99
          assert r["far_leakage_logical_gate"]==3.0
          assert r["real_game_E4"]=="NOT_RUN"
          assert r["independent_E5"]=="NOT_RUN"
          assert r["exact_run_bound_CHALK"] is None
          assert r["production_promotion"] is False
          assert len(r["source_results"])==2
          observed=0
          for method,data in r["source_results"].items():
              assert set(data["fixed_phase_variants"])==set(r["phases"])
              assert data["original_combined_vertices_NOT_CHALK"]==500
              for name,entry in data["fixed_phase_variants"].items():
                  assert entry["status"] in {
                    "BLOCKED_SOURCE_CENTERLINE",
                    "NATIVE_PHASE_PASS","NATIVE_PHASE_FAIL"}
                  if entry["status"]=="BLOCKED_SOURCE_CENTERLINE":
                      assert entry["actual_native_e3_capture"]=="NOT_RUN"
                  else:
                      assert entry["actual_native_e3_capture"]=="PASS"
                      assert entry["cumulative_strokes"]==250
                      assert entry["cumulative_synthetic_vertices_NOT_CHALK"]==500
                      observed+=1
                      print("P4B3_NATIVE",method,name,entry["status"],
                            "alpha24_coverage",
                            entry["alpha_metrics"]["24"]["native_component_coverage"],
                            "far",
                            entry["alpha_metrics"]["24"]["native_beyond3logicalpx_other_color_pixels"])
          assert observed==r["actual_native_E3_phase_scenes"]
          assert r["planned_phase_source_method_comparisons"]==6
          assert r["actual_phase_99_gate_PASS_count"]<=observed
          assert r["status"] in {
              "NATIVE_PHASE_ALL_6_PASS","NATIVE_PHASE_SOME_QUALITY_PASS",
              "NATIVE_PHASE_SOURCE_BLOCKED_OR_QUALITY_FAIL"}
          for filename,expected in r["file_sha256"].items():
              assert hashlib.sha256((root/filename).read_bytes()).hexdigest()==expected,filename
          print("P4B3_SHA256_MANIFEST_PASS",len(r["file_sha256"]))
          print("P4B3_REAL_NATIVE_SCENES",observed,"out_of_6_preplanned")
          print("P4B3_TECHNICAL_E3_CAPTURE_NOT_GAME_E4_NO_EXACT_CHALK")
          PY
      - name: Always preserve original source native, all 3 phase alternatives and negative evidence one ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-b1r-p4b3-three-subpixel-Egret-phase-one-zip
          path: ${{ runner.temp }}/engine001-b1r-p4b3/
          retention-days: 30
          if-no-files-found: warn
