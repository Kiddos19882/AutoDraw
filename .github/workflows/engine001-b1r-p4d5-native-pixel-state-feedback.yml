name: ENGINE-001 B1-R P4D5 native pixel-state 0-1 owner feedback
on:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - '.github/workflows/engine001-b1r-p4d5-native-pixel-state-feedback.yml'
      - 'AutoDraw_Stage20/tests/run_engine001_b1r_p4d5_pixel_state_native_feedback.py'
      - 'AutoDraw_Stage20/tests/test_engine001_b1r_p4d5_pixel_state_native_feedback.py'
      - 'AutoDraw_Stage20/docs/ENGINE001_B1R_P4D5_PIXEL_STATE_NATIVE_FEEDBACK_PREREG_2026-11-19.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine001-b1r-p4d5-native-pixel-state-feedback
  cancel-in-progress: true
jobs:
  verified-real-board-egret-owner-greedy:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install prior pinned Egret native and image-analysis dependencies
        shell: bash
        run: |
          python -m pip install selenium==4.38.0 numpy==2.2.6 opencv-python-headless==4.11.0.86 Pillow==11.3.0 scikit-image==0.25.2 scipy==1.15.3 requests==2.32.5
      - name: E2 test pixel-state 0-1, source provenance, native safety and existing contracts
        shell: bash
        run: |
          python -m py_compile AutoDraw_Stage20/tests/run_engine001_b1r_p4d5_pixel_state_native_feedback.py AutoDraw_Stage20/tests/test_engine001_b1r_p4d5_pixel_state_native_feedback.py
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_b1r_p4d5_pixel_state_native_feedback.py -v
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_b1r_p4d2_owner_colored_boundary_as_fill_native.py -v
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_b1r_p4d3_native_brush_repeatability.py -v
          node --check AutoDraw_Stage20/tests/game_renderer_reference.js
          node --test AutoDraw_Stage20/tests/game_renderer_reference.test.js
          python AutoDraw_Stage20/tools/check_markdown_docs.py --root AutoDraw_Stage20
      - name: Restore exact original source, game and real Egret renderer blobs after Windows checkout
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,subprocess
          from pathlib import Path
          pins={
            "AutoDraw_Stage20/gameEngine/main.min_653f95bc.js":"46cc74de00b6cb5d207b1e1a2ffcd81613b6d388",
            "AutoDraw_Stage20/tests/game_renderer_reference.js":"76d950e0a8911888a9df3b675b866519ecf7bba4",
            "AutoDraw_Stage20/tests/run_engine001_b1r_p4b7_native_stroke_attribution.py":"87ea292c01c75e594c4ff09acf716c4500e88644",
            "AutoDraw_Stage20/tests/run_engine001_complex_holdout_v5.py":"1985af2763ba0169039e70eae693af854908783c",
            "AutoDraw_Stage20/tests/run_engine001_b1r_p4d0_unbounded_adaptive_vs_scanline_native.py":"cf4f0b0b8a1fef5879067f41901f2806758e81bd",
            "AutoDraw_Stage20/tests/run_engine001_b1r_p3d_source_edge_mask_ablation.py":"c350fb9a890de9bbe9f9e24eeea0eb6645f414f1",
          }
          for path,expected in pins.items():
              raw=subprocess.check_output(["git","show","HEAD:"+path])
              actual=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
              assert actual==expected,(path,actual,expected)
              Path(path).write_bytes(raw)
              print("P4D5_SOURCE_BLOB",path,actual)
          png=Path("AutoDraw_Stage20/testImages/wV6VeZI9S1Y.png").read_bytes()
          assert hashlib.sha256(png).hexdigest()=="07cc4568cb5e90d9514bc6f6c2112fee623f87f8fd0cea02fa517b04108e502a"
          PY
      - name: P4D5 true native E F pixel-state 0-1 decision and cumulative feedback
        shell: bash
        run: |
          python AutoDraw_Stage20/tests/run_engine001_b1r_p4d5_pixel_state_native_feedback.py \
            --workspace . \
            --source AutoDraw_Stage20/testImages/wV6VeZI9S1Y.png \
            --engine-js AutoDraw_Stage20/gameEngine/main.min_653f95bc.js \
            --renderer AutoDraw_Stage20/tests/game_renderer_reference.js \
            --output AutoDraw_Stage20/.p4d5-work
      - name: Independent report and native E F source-index safety plus full SHA manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from PIL import Image
          root=Path("AutoDraw_Stage20/.p4d5-work")
          d=json.loads((root/"report.json").read_text("utf8"))
          assert d["experiment"]=="ENGINE001_B1R_P4D5_PIXEL_STATE_NATIVE_FEEDBACK_V1"
          assert d["technical_result"]=="P4D5_EF_ORIGINAL_ROI_TRUE_NATIVE_ORACLE_AND_FEEDBACK"
          assert d["original_source_sha256"]=="07cc4568cb5e90d9514bc6f6c2112fee623f87f8fd0cea02fa517b04108e502a"
          assert d["original_recomputed_current_run"]
          assert d["source_active"]=="C_192_D_COMPONENT24"
          assert d["native_blank_alpha0"]
          assert d["no_global_dark_contour"]
          assert d["game_renderer"]=="real Egret 5.4.1 BoardPane/WebGLRenderer"
          assert d["renderer_git_blob"]=="76d950e0a8911888a9df3b675b866519ecf7bba4"
          assert d["source_game_engine_blob"]=="46cc74de00b6cb5d207b1e1a2ffcd81613b6d388"
          assert d["candidate_frozen_MAX_NATIVE_PROBES"]==240
          assert d["native_state_5of9_threshold"]==5
          assert d["native_alpha_threshold"]==24
          assert d["native_rgb_distance_threshold"]==32
          assert d["github_sha"]==os.environ["GITHUB_SHA"]
          assert d["github_run_id"]==os.environ["GITHUB_RUN_ID"]
          assert not d["production_promotion"]
          assert d["global_99_protected0_max3"]=="NOT_MEASURED"
          assert d["E4_live_game"]=="NOT_RUN" and d["E5_independent"]=="NOT_RUN"
          assert d["exact_run_bound_CHALK"] is None
          assert set(d["methods"])=={"E_SOBEL90","F_SOBEL90_LAB12"}
          with Image.open(root/"REAL_EGRET_BLANK.png") as im:
              assert im.size==(1380,720)
              assert im.getchannel("A").getbbox() is None
          for method,m in d["methods"].items():
              folder=root/method
              assert m["P3D_SOURCE_ONLY_NO_G32_V44"]
              assert m["crop_xyxy"]==[40,45,64,69]
              assert 0<m["target_nonwhite_pixels"]<=576
              assert m["oracle_single_native_probes"]<=240
              assert m["isolated_native_unsafe_candidates"]+m["isolated_native_safe_candidates"]==m["oracle_single_native_probes"]
              assert m["attempted_real_cumulative_native"]>=m["accepted_real_cumulative_native"]
              assert m["native_final_replay_equal"]
              assert m["accepted_candidate_native_foreign_alpha24_zero"]
              assert m["global_owner99_protected0_far3"]=="NOT_MEASURED_FULL_IMAGE"
              for label in ("source_owner_correct_zero_to_one_native_baseline",
                            "source_owner_correct_zero_to_one_native_greedy"):
                  result=m[label]
                  assert result["target_nonwhite_logical"]==m["target_nonwhite_pixels"]
                  assert 0<=result["correct_logical_native_5_of_9"]<=result["target_nonwhite_logical"]
                  assert result["correct_logical_native_5_of_9"]+result["remaining_zero_logical"]==result["target_nonwhite_logical"]
              assert m["source_owner_correct_zero_to_one_native_greedy"]["white_target_ink_alpha24_backing"]==0
              assert m["source_owner_correct_zero_to_one_native_greedy"]["any_ink_outside_crop_alpha24_backing"]==0
              with Image.open(folder/"COMPARISON_REAL_NATIVE.png") as im:
                  assert im.size==(1152,318)
              for stage in ("NATIVE_SCANLINE_W1_CONTROL.png","NATIVE_GREEDY_PIXEL_STATE_FINAL.png"):
                  with Image.open(folder/stage) as im:
                      assert im.size==(1380,720)
              rows=json.loads((folder/"NATIVE_CANDIDATES_AND_REJECTIONS.json").read_text("utf8"))
              assert len(rows)==m["oracle_single_native_probes"]
              assert len(list((folder/"NATIVE_SINGLE_PROBES").glob("*.png")))==len(rows)
              print("P4D5_NATIVE_EF",method,"probe",len(rows),
                    "baseline_correct",m["source_owner_correct_zero_to_one_native_baseline"]["correct_logical_native_5_of_9"],
                    "greedy_correct",m["source_owner_correct_zero_to_one_native_greedy"]["correct_logical_native_5_of_9"],
                    "remaining",m["source_owner_correct_zero_to_one_native_greedy"]["remaining_zero_logical"],
                    "accepted",m["accepted_real_cumulative_native"],
                    m["numeric_candidate"])
          assert len(d["members_sha256"])>30
          for filename,want in d["members_sha256"].items():
              assert hashlib.sha256((root/filename).read_bytes()).hexdigest()==want,filename
          print("P4D5_NATIVE_EF_AND_HASH_PASS",len(d["members_sha256"]))
          PY
      - name: Package one archive of source, rejected native probes, accepted replay and masks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-p4d5-original-EF-native-pixel-state-0-to-1
          path: AutoDraw_Stage20/.p4d5-work/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
