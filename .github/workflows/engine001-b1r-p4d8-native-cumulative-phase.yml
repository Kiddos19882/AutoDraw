name: ENGINE-001 B1-R P4D8 native cumulative owner pixel phases
on:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - '.github/workflows/engine001-b1r-p4d8-native-cumulative-phase.yml'
      - 'AutoDraw_Stage20/tests/run_engine001_b1r_p4d8_native_cumulative_phase_pixel_state.py'
      - 'AutoDraw_Stage20/tests/test_engine001_b1r_p4d8_native_cumulative_phase_pixel_state.py'
      - 'AutoDraw_Stage20/docs/ENGINE001_B1R_P4D8_NATIVE_CUMULATIVE_PHASE_PIXEL_STATE_PREREG_2026-11-19.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine001-b1r-p4d8-native-cumulative
  cancel-in-progress: true
jobs:
  native-owner-cumulative-phase:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned native Egret analysis dependencies
        shell: bash
        run: |
          python -m pip install selenium==4.38.0 numpy==2.2.6 opencv-python-headless==4.11.0.86 Pillow==11.3.0 scikit-image==0.25.2 scipy==1.15.3 requests==2.32.5
      - name: Verify original source and immutable parent modules
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,subprocess
          from pathlib import Path
          pins={
            "AutoDraw_Stage20/gameEngine/main.min_653f95bc.js":"46cc74de00b6cb5d207b1e1a2ffcd81613b6d388",
            "AutoDraw_Stage20/tests/game_renderer_reference.js":"76d950e0a8911888a9df3b675b866519ecf7bba4",
            "AutoDraw_Stage20/tests/run_engine001_b1r_p4d5_pixel_state_native_feedback.py":"147f4c2ec439bac72228b6828c67bfd45b49b28e",
            "AutoDraw_Stage20/tests/run_engine001_b1r_p4d7_native_width1_phase_feasibility.py":"dc707709e55069897e2bbef465a4ed1668e8a679",
            "AutoDraw_Stage20/tests/run_engine001_b1r_p4b4_boundary_tolerance_sweep.py":"6f67edcb942018bb006ed60b853470e4a202408d",
            "AutoDraw_Stage20/tests/run_engine001_b1r_p4b7_native_stroke_attribution.py":"87ea292c01c75e594c4ff09acf716c4500e88644",
            "AutoDraw_Stage20/tests/run_engine001_complex_holdout_v5.py":"1985af2763ba0169039e70eae693af854908783c",
            "AutoDraw_Stage20/tests/run_engine001_b1r_p3d_source_edge_mask_ablation.py":"c350fb9a890de9bbe9f9e24eeea0eb6645f414f1",
          }
          for path,expected in pins.items():
              raw=subprocess.check_output(["git","show","HEAD:"+path])
              actual=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
              assert actual==expected,(path,actual,expected)
              Path(path).write_bytes(raw)
              print("P4D8_PARENT_GIT_BLOB",path,actual)
          assert hashlib.sha256(Path("AutoDraw_Stage20/testImages/wV6VeZI9S1Y.png").read_bytes()).hexdigest()=="07cc4568cb5e90d9514bc6f6c2112fee623f87f8fd0cea02fa517b04108e502a"
          PY
      - name: E2 cumulative native-risk and inherited single-stroke unit contracts
        shell: bash
        run: |
          python -m py_compile AutoDraw_Stage20/tests/run_engine001_b1r_p4d8_native_cumulative_phase_pixel_state.py AutoDraw_Stage20/tests/test_engine001_b1r_p4d8_native_cumulative_phase_pixel_state.py
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_b1r_p4d8_native_cumulative_phase_pixel_state.py -v
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_b1r_p4d7_native_width1_phase_feasibility.py -v
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_b1r_p4d5_pixel_state_native_feedback.py -v
          node --check AutoDraw_Stage20/tests/game_renderer_reference.js
          node --test AutoDraw_Stage20/tests/game_renderer_reference.test.js
          python AutoDraw_Stage20/tools/check_markdown_docs.py --root AutoDraw_Stage20
      - name: E3 genuine Egret 1386 isolated and cumulative source-owner phase validation
        shell: bash
        run: |
          python AutoDraw_Stage20/tests/run_engine001_b1r_p4d8_native_cumulative_phase_pixel_state.py \
            --workspace . \
            --source AutoDraw_Stage20/testImages/wV6VeZI9S1Y.png \
            --engine-js AutoDraw_Stage20/gameEngine/main.min_653f95bc.js \
            --renderer AutoDraw_Stage20/tests/game_renderer_reference.js \
            --output AutoDraw_Stage20/.p4d8-native
      - name: Audit actual native cumulative attempt ledger and SHA256 evidence
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from PIL import Image
          root=Path("AutoDraw_Stage20/.p4d8-native")
          data=json.loads((root/"report.json").read_text("utf8"))
          assert data["experiment"]=="ENGINE001_B1R_P4D8_NATIVE_CUMULATIVE_PHASE_OWNER_PIXEL_V1"
          assert data["technical_result"]=="REAL_EGRET_P4D7_ISOLATED_PLUS_P4D8_CUMULATIVE"
          assert data["github_sha"]==os.environ["GITHUB_SHA"]
          assert data["github_run_id"]==os.environ["GITHUB_RUN_ID"]
          assert data["original_source_sha256"]=="07cc4568cb5e90d9514bc6f6c2112fee623f87f8fd0cea02fa517b04108e502a"
          assert data["fresh_original_B1R_P3D"] and data["original_EF_source_crop_duplicate"]
          assert data["fixed_samples"]==21 and data["target_nonwhite"]==307
          assert data["P4D7_fresh_native_isolated_scene_count"]==1387
          assert data["P4D7_fresh_safe_sample_count"]==21
          assert data["isolated_total_variants"]==1386
          assert data["real_native_cumulative_accepted"]+data["real_native_cumulative_rejected"]==data["real_native_cumulative_trial_count"]
          assert data["real_native_cumulative_accepted"]<=21
          assert 0<=data["final_accepted_sample_correct_out_of_21"]<=21
          assert data["final_owner_correct_out_of_307"]+data["final_remaining_source_zeros"]==307
          assert data["accepted_no_1_to_0"] and data["accepted_real_native_all_foreign_alpha24_change_zero"]
          assert data["accepted_original_white_native_alpha24_zero"]
          assert data["final_native_replay_rgba_exact"]
          assert data["real_native_renderer"]=="real Egret 5.4.1 BoardPane/WebGLRenderer"
          assert data["renderer_git_blob"]=="76d950e0a8911888a9df3b675b866519ecf7bba4"
          assert data["game_bundle_git_blob"]=="46cc74de00b6cb5d207b1e1a2ffcd81613b6d388"
          assert data["E4_live"]=="NOT_RUN" and data["E5_independent"]=="NOT_RUN"
          assert data["exact_run_bound_CHALK"] is None and not data["production_promotion"]
          rows=[json.loads(x) for x in (root/"NATIVE_CUMULATIVE_TRIALS_APPEND_ONLY.jsonl").read_text("utf8").splitlines()]
          assert len(rows)==data["real_native_cumulative_trial_count"]
          assert sum(bool(r["accepted"]) for r in rows)==data["real_native_cumulative_accepted"]
          assert all(not r["native_lost_correct_1_to_0"] and
                     not r["native_changed_foreign_alpha24_backing"] and
                     not r["native_original_white_alpha24_backing"]
                     for r in rows if r["accepted"])
          with Image.open(root/"REAL_EGRET_CUMULATIVE_BLANK.png") as im:
              assert im.size==(1380,720) and im.getchannel("A").getbbox() is None
          native_iso=list((root/"P4D7_FRESH_NATIVE_ISOLATED"/"REAL_EGRET_WIDTH1_PHASE_SCENES").rglob("*.png"))
          assert len(native_iso)==1386
          assert len(list((root/"REAL_EGRET_CUMULATIVE_TRIALS").rglob("*.png")))==len(rows)
          assert (root/"P4D8_ACTUAL_NATIVE_ROI_COMPARISON.png").exists()
          for f,sha in data["members_sha256"].items():
              assert hashlib.sha256((root/f).read_bytes()).hexdigest()==sha,f
          print("P4D8_NATIVE_CUMULATIVE_AUDIT_PASS")
          print("P4D8_SAMPLES",data["final_accepted_sample_correct_out_of_21"],"/21")
          print("P4D8_OWNER_CORRECT",data["final_owner_correct_out_of_307"],"/307")
          print("P4D8_H1",data["H1_more_covered_than_P4D5_with_protected_safety"])
          print("P4D8_H2",data["H2_all_21_fixed_samples_correct"])
          print("P4D8_MANIFEST_SHA_PASS",len(data["members_sha256"]))
          PY
      - name: Preserve isolated raw Egret and all cumulative trials in one archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-p4d8-native-cumulative-owner-pixel-phase
          path: AutoDraw_Stage20/.p4d8-native/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
