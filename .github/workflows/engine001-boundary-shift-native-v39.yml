name: ENGINE-001 V39 resource-neutral native boundary placement

on:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - ".github/workflows/engine001-boundary-shift-native-v39.yml"
      - "AutoDraw_Stage20/tests/run_engine001_boundary_shift_native_v39.py"
      - "AutoDraw_Stage20/tests/test_engine001_boundary_shift_v39.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-egret-boundary-reposition:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install previously used Egret native replay and source libraries
        run: python -m pip install "selenium>=4,<5" "numpy>=2,<3" "opencv-python-headless>=4.10,<5" "Pillow>=11,<13" "scikit-image>=0.25,<0.27" "scipy>=1.13,<2"
      - name: Recover frozen V37-P2 Egret PNG and candidate source plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/v37p2"
          gh run download 43747149144 --repo Kiddos19882/AutoDraw -n engine001-v37p2-native-full-contour-fill-color-evidence -D "$RUNNER_TEMP/v37p2"
      - name: Unit checks and native actual Egret candidate A B C
        shell: bash
        run: |
          node --check AutoDraw_Stage20/tests/game_renderer_reference.js
          node --test AutoDraw_Stage20/tests/game_renderer_reference.test.js
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_boundary_shift_v39.py -v
          python -m py_compile AutoDraw_Stage20/tests/run_engine001_boundary_shift_native_v39.py
          python AutoDraw_Stage20/tests/run_engine001_boundary_shift_native_v39.py \
            --workspace . \
            --source AutoDraw_Stage20/testImages/wV6VeZI9S1Y.png \
            --v37p2-archive "$RUNNER_TEMP/v37p2" \
            --output "$RUNNER_TEMP/engine001-v39"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"engine001-v39"
          report=json.loads((root/"report.json").read_text(encoding="utf-8"))
          assert report["experiment"]=="ENGINE001_BOUNDARY_SHIFT_V39"
          assert report["V37P2_C_control_pixel_exact"]
          assert report["dark_contour_alpha_pixel_exact_all"]
          assert (report["strokes"],report["synthetic_vertices_NOT_CHALK"])==(2355,5682)
          assert all(hashlib.sha256((root/p).read_bytes()).hexdigest()==h
                     for p,h in report["artifact_SHA256"].items())
          assert report["exact_game_CHALK"] is None
          print("V39 real Egret E3 diagnostic captured; NOT game CHALK/production quality")
          PY
      - name: Preserve actual source-bound native PNG and negative findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-v39-native-boundary-shift-evidence
          path: ${{ runner.temp }}/engine001-v39
          if-no-files-found: warn
