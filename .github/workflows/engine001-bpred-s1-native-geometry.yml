name: ENGINE-001 BPRED-S1 source geometry real Egret calibration
on:
  push:
    branches: ['feature/image-geometry-optimization']
    paths:
      - '.github/workflows/engine001-bpred-s1-native-geometry.yml'
      - 'AutoDraw_Stage20/tests/run_engine001_bpred_s1_native_geometry.py'
      - 'AutoDraw_Stage20/tests/test_engine001_bpred_s1_native_geometry.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: engine001-bpred-s1-source-geometry
  cancel-in-progress: true

jobs:
  geometry-calibration-only:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin Firefox 159.0 exact native brush backend
        id: firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795
        with:
          firefox-version: '159.0'
      - name: Install previous original Egret research dependencies
        shell: bash
        run: |
          python -m pip install selenium==4.38.0 numpy==2.2.6 opencv-python-headless==4.11.0.86 Pillow==11.3.0 scikit-image==0.25.2 scipy==1.15.3 requests==2.32.5
      - name: Restore exact frozen native renderer and original S0/P4D14 sources
        shell: pwsh
        env:
          BROWSER_PATH: ${{ steps.firefox.outputs.firefox-path }}
        run: |
          if (-not (Test-Path -LiteralPath $env:BROWSER_PATH -PathType Leaf)) { throw "Firefox159 missing" }
          & $env:BROWSER_PATH --version
          @'
          from pathlib import Path
          import subprocess,hashlib
          pinned={
            "AutoDraw_Stage20/gameEngine/main.min_653f95bc.js":"46cc74de00b6cb5d207b1e1a2ffcd81613b6d388",
            "AutoDraw_Stage20/tests/game_renderer_reference.js":"76d950e0a8911888a9df3b675b866519ecf7bba4",
            "AutoDraw_Stage20/tests/run_engine001_b1r_p4d3_native_brush_repeatability.py":"3437a9326b381d9c94d6ade80059d40adf233d09",
            "AutoDraw_Stage20/tests/run_engine001_b1r_p4d14_egret_halfpixel_centroid.py":"21000076aedf2a2db65d3b0d7db88525e33bf5da",
            "AutoDraw_Stage20/tests/run_engine001_bpred_s0_corpus_audit.py":"4b4166dafce7d04d8b34976734cf775cec748024",
          }
          for path,expected in pinned.items():
              raw=subprocess.check_output(["git","show","HEAD:"+path])
              got=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
              assert got==expected,(path,got,expected)
              Path(path).write_bytes(raw)
              assert Path(path).read_bytes()==raw
          print("BPRED_S1_SOURCE_PIN_PASS",len(pinned))
          '@ | python -
      - name: E2 source geometry adapter, bounds and original renderer tests
        shell: bash
        run: |
          python -m py_compile AutoDraw_Stage20/tests/run_engine001_bpred_s1_native_geometry.py AutoDraw_Stage20/tests/test_engine001_bpred_s1_native_geometry.py
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_bpred_s1_native_geometry.py -v
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_b1r_p4d14_egret_halfpixel_centroid.py -v
          node --check AutoDraw_Stage20/tests/game_renderer_reference.js
          python AutoDraw_Stage20/tools/check_markdown_docs.py --root AutoDraw_Stage20
      - name: Download exact frozen S0 manifest artifact, NO new BLIND scenes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44644039555 -R Kiddos19882/AutoDraw -n engine001-bpred-s0-frozen-native-corpus-v1 -D AutoDraw_Stage20/.bpred-s1-s0-frozen
          test -f AutoDraw_Stage20/.bpred-s1-s0-frozen/future_native_scene_plans.json
          test -f AutoDraw_Stage20/.bpred-s1-s0-frozen/report.json
      - name: E3 new 120 CALIBRATION native scenes; no BLIND/CONTROL
        shell: pwsh
        env:
          BROWSER_PATH: ${{ steps.firefox.outputs.firefox-path }}
        run: |
          $env:PATH = (Split-Path $env:BROWSER_PATH -Parent) + ";" + $env:PATH
          python AutoDraw_Stage20/tests/run_engine001_bpred_s1_native_geometry.py --workspace . --source-artifact AutoDraw_Stage20/.bpred-s1-s0-frozen --engine-js AutoDraw_Stage20/gameEngine/main.min_653f95bc.js --renderer AutoDraw_Stage20/tests/game_renderer_reference.js --output AutoDraw_Stage20/.bpred-s1-native
      - name: Independently validate case hashes, score, provenance and count
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,os
          root=Path("AutoDraw_Stage20/.bpred-s1-native")
          r=json.loads((root/"report.json").read_text("utf8"))
          assert r["experiment"]=="ENGINE001_BPRED_S1_GEOMETRY_V1"
          assert r["github_sha"]==os.getenv("GITHUB_SHA")
          assert r["github_run_id"]==os.getenv("GITHUB_RUN_ID")
          assert r["native_case_count"]==120 and r["native_scene_count"]==121
          assert r["native_calibration_observations"]==360
          assert r["browser"]["browserVersion"].startswith("159.")
          assert r["native_blank_alpha0"] and r["blind_holdout_E3"]=="NOT_RUN"
          assert r["metrics"]["odd_1_3_count"]==72
          assert r["metrics"]["other_widths_count"]==288
          assert r["metrics"]["H2_other_widths_source_invariant"]=="PASS"
          assert r["model_scope"].startswith("two-point")
          assert not r["production_promotion"] and r["exact_run_bound_CHALK"] is None
          assert r["E4_game"]=="NOT_RUN" and r["E5_validation"]=="NOT_RUN"
          rows=[json.loads(x) for x in (root/"CASE_ROWS_APPEND_ONLY.jsonl").read_text("utf8").splitlines()]
          assert len(rows)==120 and len({x["sample_id"] for x in rows})==120
          assert all(len(x["cells"])==3 for x in rows)
          assert all(x["angle_deg"] in (7,73,166) for x in rows)
          assert len(list((root/"native").rglob("*_REAL_EGRET.png")))==120
          assert len(list((root/"native").rglob("*_PLAN.json")))==240
          for f, expected in r["members_sha256"].items():
              assert hashlib.sha256((root/f).read_bytes()).hexdigest()==expected,f
          print("BPRED_S1_NATIVE_E3_120_CALIBRATION_PASS")
          print("BPRED_S1_H1_M1",r["metrics"]["H1_M1_halfpixel_effectiveness"])
          print("BPRED_S1_SHA_MANIFEST_PASS",len(r["members_sha256"]))
          PY
      - name: Preserve all real Egret scene PNG, plans, negative cases, provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-bpred-s1-real-egret-geometry-calibration-120
          path: AutoDraw_Stage20/.bpred-s1-native/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
