name: ENGINE-001 BPRED-S2v3 native-sourced alpha uncertainty calibration
on:
  push:
    branches: ['feature/image-geometry-optimization']
    paths:
      - '.github/workflows/engine001-bpred-s2v3-risk-aware-alpha.yml'
      - 'AutoDraw_Stage20/tests/run_engine001_bpred_s2v3_risk_aware_alpha.py'
      - 'AutoDraw_Stage20/tests/test_engine001_bpred_s2v3_risk_aware_alpha.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: engine001-bpred-s2v3-alpha-unknown
  cancel-in-progress: true

jobs:
  original-egret-alpha-residual-calibration-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned original native-source analysis dependencies
        run: python -m pip install selenium==4.38.0 numpy==2.2.6 opencv-python-headless==4.11.0.86 Pillow==11.3.0 scikit-image==0.25.2 scipy==1.15.3 requests==2.32.5
      - name: Verify frozen E0 and original source blobs before training
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,subprocess
          pins={
            "AutoDraw_Stage20/docs/ENGINE001_BPRED001_S2V3_RISK_AWARE_ALPHA_PREREG_2026-11-20.md":"fc6b1081c97519fd8dc25d34f77a0ea02dc8f879",
            "AutoDraw_Stage20/tests/run_engine001_bpred_s2_alpha_aa_eval.py":"ed29df1d559409d5a5783556a12c30d24df7118d",
            "AutoDraw_Stage20/tests/run_engine001_bpred_s2v2_isotonic_eval.py":"952c86aebf281ee71867f9e0d12fcd9442b7ce99",
            "AutoDraw_Stage20/tests/run_engine001_b1r_p4d16_canvas_aa_density.py":"9f30dbe7cd2e2cb913db1d4f816e74b80668125d",
            "AutoDraw_Stage20/tests/run_engine001_bpred_s1_native_geometry.py":"546f417c4dbddd0974db86b9015bd670326bb2d5",
            "AutoDraw_Stage20/tests/game_renderer_reference.js":"76d950e0a8911888a9df3b675b866519ecf7bba4",
          }
          for path,expected in pins.items():
              raw=subprocess.check_output(["git","show","HEAD:"+path])
              got=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
              assert got==expected,(path,got,expected)
              Path(path).write_bytes(raw)
          print("BPRED_S2V3_E0_AND_NATIVE_SOURCE_PIN_PASS",len(pins))
          PY
      - name: E2 quantile higher, UNKNOWN, false-safe and frozen original regression
        run: |
          python -m py_compile AutoDraw_Stage20/tests/run_engine001_bpred_s2v3_risk_aware_alpha.py AutoDraw_Stage20/tests/test_engine001_bpred_s2v3_risk_aware_alpha.py
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_bpred_s2v3_risk_aware_alpha.py -v
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_bpred_s2v2_isotonic_eval.py -v
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_bpred_s2_alpha_aa_eval.py -v
          python AutoDraw_Stage20/tools/check_markdown_docs.py --root AutoDraw_Stage20
      - name: Download ONLY three pinned historical CALIBRATION artifacts, NEVER BLIND
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44646682797 -R Kiddos19882/AutoDraw -n engine001-bpred-s1-real-egret-geometry-calibration-120 -D AutoDraw_Stage20/.bpred-s2v3-native-parent
          gh run download 44651134628 -R Kiddos19882/AutoDraw -n engine001-bpred-s2-native-alpha-aa-calibration-120 -D AutoDraw_Stage20/.bpred-s2v3-v1-parent
          gh run download 44652423011 -R Kiddos19882/AutoDraw -n engine001-bpred-s2v2-isotonic-angle-heldout-calibration -D AutoDraw_Stage20/.bpred-s2v3-v2-parent
          test -f AutoDraw_Stage20/.bpred-s2v3-native-parent/report.json
          test -f AutoDraw_Stage20/.bpred-s2v3-v1-parent/report.json
          test -f AutoDraw_Stage20/.bpred-s2v3-v2-parent/report.json
      - name: Train per-width guards only on two angles; evaluate third
        run: |
          python AutoDraw_Stage20/tests/run_engine001_bpred_s2v3_risk_aware_alpha.py \
            --workspace . \
            --source-native AutoDraw_Stage20/.bpred-s2v3-native-parent \
            --source-s2v1 AutoDraw_Stage20/.bpred-s2v3-v1-parent \
            --source-s2v2 AutoDraw_Stage20/.bpred-s2v3-v2-parent \
            --output AutoDraw_Stage20/.bpred-s2v3-result
      - name: Independently verify frozen source, split, performance verdict and raw file hashes
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          d=Path("AutoDraw_Stage20/.bpred-s2v3-result")
          r=json.loads((d/"report.json").read_text("utf8"))
          assert r["experiment"]=="ENGINE001_BPRED_S2V3_RISK_AWARE_ALPHA_V1"
          assert r["github_sha"]==os.getenv("GITHUB_SHA") and r["github_run_id"]==os.getenv("GITHUB_RUN_ID")
          assert r["source_calibration_cases"]==120 and r["fold_validation_scenes"]==120
          assert r["fold_validation_ROIs"]==360
          assert r["new_native_scenes_rendered"]==0 and r["S0_BLIND_scenes_evaluated"]==0
          assert r["native_parent_members_SHA_verified"]==363
          assert r["parent_S2v1_run"]=="44651134628" and r["parent_S2v2_run"]=="44652423011"
          assert r["source_browser"]["browserVersion"].startswith("159.")
          assert r["fixed_hypotheses"]=={
              "quantile":.995,"H1_M4_FP_ratio_max":.10,"H2_M4_TP_ratio_min":.90,
              "H3_each_fold_FP_ratio_max":.10,"H3_each_fold_TP_ratio_min":.80,
              "provisional_safety_requires_zero_FP":True}
          m=r["metrics"]
          assert m["all"]["M2"]["FP"]==2167 and m["all"]["M2"]["FN"]==559
          assert m["all"]["n_scenes"]==120 and m["all"]["n_ROIs"]==360
          assert all(m[k] in ("PASS","FAIL") for k in (
              "H1_total_FP_90pct_reduction","H2_total_TP_90pct_retention",
              "H3_each_angle_FP_and_TP","independent_safety_gate_zero_FP"))
          assert not m["M4_pixel_exact_safe"] and not r["production_promotion"]
          assert r["E4_live"]=="NOT_RUN" and r["E5_blind"]=="NOT_RUN"
          assert r["exact_run_bound_CHALK"] is None
          lines=[json.loads(x) for x in (d/"CASE_ROWS_APPEND_ONLY.jsonl").read_text("utf8").splitlines()]
          assert len(lines)==120 and len({x["sample_id"] for x in lines})==120
          assert set(x["heldout_angle"] for x in lines)=={7,73,166}
          guards=json.loads((d/"M4_FOLD_WIDTH_GUARDS.json").read_text("utf8"))
          assert len(guards["fold_width_guards"])==30
          assert all(len(x["train_sample_ids"])==8 and len(x["test_sample_ids"])==4
                     for x in guards["fold_width_guards"])
          assert len(r["members_sha256"])==3
          for name,digest in r["members_sha256"].items():
              assert hashlib.sha256((d/name).read_bytes()).hexdigest()==digest,name
          print("BPRED_S2V3_E2_NATIVE_SOURCE_AUDIT_PASS",len(lines),len(r["members_sha256"]))
          print("BPRED_S2V3_SCIENTIFIC_H1_H2_H3",
                m["H1_total_FP_90pct_reduction"],
                m["H2_total_TP_90pct_retention"],
                m["H3_each_angle_FP_and_TP"])
          print("BPRED_S2V3_ZERO_FALSE_SAFE",m["independent_safety_gate_zero_FP"])
          PY
      - name: Preserve full native-sourced model-only audit, negative science and guard tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-bpred-s2v3-risk-aware-alpha-calibration
          path: AutoDraw_Stage20/.bpred-s2v3-result/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
