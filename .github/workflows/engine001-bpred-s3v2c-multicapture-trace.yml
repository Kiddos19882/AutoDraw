name: ENGINE-001 BPRED-S3v2c original Egret duplicate Canvas structural trace
on:
  push:
    branches: ['feature/image-geometry-optimization']
    paths:
      - '.github/workflows/engine001-bpred-s3v2c-multicapture-trace.yml'
      - 'AutoDraw_Stage20/tests/engine001_bpred_s3v2c_multicapture_trace.js'
      - 'AutoDraw_Stage20/tests/run_engine001_bpred_s3v2c_multicapture_trace.py'
      - 'AutoDraw_Stage20/tests/test_engine001_bpred_s3v2c_multicapture_trace.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: engine001-bpred-s3v2c-multicapture-trace
  cancel-in-progress: true

jobs:
  genuine-eight-canvas-structural-e3:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin original Firefox159 browser
        id: firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795
        with:
          firefox-version: '159.0'
      - name: Install source-frozen browser testing dependencies
        shell: bash
        run: |
          python -m pip install selenium==4.38.0 numpy==2.2.6 opencv-python-headless==4.11.0.86 Pillow==11.3.0 scikit-image==0.25.2 scipy==1.15.3 requests==2.32.5
      - name: Verify frozen E0 original game and existing renderer Git blobs
        shell: pwsh
        env:
          BROWSER_PATH: ${{ steps.firefox.outputs.firefox-path }}
        run: |
          if (-not (Test-Path -LiteralPath $env:BROWSER_PATH -PathType Leaf)) { throw 'Pinned Firefox159 not found' }
          & $env:BROWSER_PATH --version
          @'
          from pathlib import Path
          import subprocess,hashlib
          pins={
            "AutoDraw_Stage20/docs/ENGINE001_BPRED001_S3V2C_CANVAS_CAPTURE_TRACE_PREREG_2026-11-20.md": "b8a22597fee26cc3e950bb6289aad83a5f465a2d",
            "AutoDraw_Stage20/gameEngine/main.min_653f95bc.js": "46cc74de00b6cb5d207b1e1a2ffcd81613b6d388",
            "AutoDraw_Stage20/tests/game_renderer_reference.js": "76d950e0a8911888a9df3b675b866519ecf7bba4",
            "AutoDraw_Stage20/tests/run_engine001_b1r_p4d3_native_brush_repeatability.py": "3437a9326b381d9c94d6ade80059d40adf233d09",
            "AutoDraw_Stage20/tests/run_engine001_bpred_s3_native_source_over.py": "1bf56df9507f2a34fd16e68eef190229c3184ce5",
            "AutoDraw_Stage20/tests/run_engine001_bpred_s2_alpha_aa_eval.py": "ed29df1d559409d5a5783556a12c30d24df7118d",
            "AutoDraw_Stage20/tests/run_engine001_b1r_p4d16_canvas_aa_density.py": "9f30dbe7cd2e2cb913db1d4f816e74b80668125d",
          }
          for path,sha in pins.items():
              raw=subprocess.check_output(["git","show","HEAD:"+path])
              got=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
              assert got==sha,(path,got,sha)
              Path(path).write_bytes(raw)
          print("BPRED_S3V2C_ALL_ORIGINAL_GIT_BLOBS_PASS",len(pins))
          '@ | python -
      - name: E2 immutable eight-scene plan and all-capture preservation
        shell: bash
        run: |
          python -m py_compile AutoDraw_Stage20/tests/run_engine001_bpred_s3v2c_multicapture_trace.py
          node --check AutoDraw_Stage20/tests/engine001_bpred_s3v2c_multicapture_trace.js
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_bpred_s3v2c_multicapture_trace.py -v
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_bpred_s3_native_source_over.py -v
          python AutoDraw_Stage20/tools/check_markdown_docs.py --root AutoDraw_Stage20
      - name: Read immutable S3 calibration source ZIP without opening S0 BLIND
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44683117471 -R Kiddos19882/AutoDraw -n engine001-bpred-s3-native-two-owner-91 -D AutoDraw_Stage20/.bpred-s3-source
          test -f AutoDraw_Stage20/.bpred-s3-source/report.json
      - name: Genuine 8 original Egret scenes and EVERY source CanvasRenderer call
        shell: pwsh
        env:
          BROWSER_PATH: ${{ steps.firefox.outputs.firefox-path }}
        run: |
          $env:PATH = (Split-Path $env:BROWSER_PATH -Parent) + ";" + $env:PATH
          python AutoDraw_Stage20/tests/run_engine001_bpred_s3v2c_multicapture_trace.py --workspace . --engine AutoDraw_Stage20/gameEngine/main.min_653f95bc.js --renderer AutoDraw_Stage20/tests/game_renderer_reference.js --trace-js AutoDraw_Stage20/tests/engine001_bpred_s3v2c_multicapture_trace.js --parent AutoDraw_Stage20/.bpred-s3-source --output AutoDraw_Stage20/.bpred-s3v2c-trace
      - name: Independently verify original eight scenes and all multi-stage PNG hashes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,os
          root=Path("AutoDraw_Stage20/.bpred-s3v2c-trace")
          report=json.loads((root/"report.json").read_text("utf8"))
          assert report["experiment"]=="ENGINE001_BPRED_S3V2C_MULTICAPTURE_TRACE_V1"
          assert report["github_sha"]==os.getenv("GITHUB_SHA")
          assert str(report["github_run_id"])==os.getenv("GITHUB_RUN_ID")
          assert report["parent_S3_run"]=="44683117471"
          assert report["parent_S3_SHA"]=="6dedf6ddfde36db17f07fc0aa00dd463dc525ca8"
          assert report["frozen_E0_blob"]=="b8a22597fee26cc3e950bb6289aad83a5f465a2d"
          assert report["native_browser"]["browserVersion"].startswith("159.")
          assert report["scenes_frozen"]==8 and report["true_final_webgl_PNG"]==8
          assert report["true_canvas_intermediate_PNG"]>=8
          assert report["all_canvas_snapshots_preserved_without_selection"]
          assert report["all_parent_webgl_deBG_only_equivalent"]
          assert report["S3_science_H1"]=="FAIL_UNCHANGED"
          assert report["S3v2_S3v2b_research_status"]=="TECHNICAL_BLOCKED_ARCHIVED"
          assert not report["S0_BLIND_used"] and not report["production_promotion"]
          assert report["E4_live"]=="NOT_RUN" and report["E5_independent"]=="NOT_RUN"
          rows=[json.loads(x) for x in (root/"CAPTURES_APPEND_ONLY.jsonl").read_text("utf8").splitlines()]
          assert len(rows)==8 and len({x["sample_id"] for x in rows})==8
          assert all(x["capture_count"]>=1 for x in rows)
          assert len(list((root/"native").rglob("*_REAL_EGRET_FINAL_WEBGL.png")))==8
          assert len(list((root/"native").rglob("*_TRUE.png")))==report["true_canvas_intermediate_PNG"]
          for filename,expected in report["members_sha256"].items():
              assert hashlib.sha256((root/filename).read_bytes()).hexdigest()==expected,filename
          print("BPRED_S3V2C_8_ORIGINAL_BOARD_AND_ALL_CANVAS_TRACE_PASS",
                report["true_canvas_intermediate_PNG"],len(report["members_sha256"]))
          print("BPRED_S3V2C_COUNTS", [x["capture_count"] for x in rows])
          PY
      - name: Preserve all raw Canvas calls and structural negative outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-bpred-s3v2c-native-multicapture-eight
          path: AutoDraw_Stage20/.bpred-s3v2c-trace/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
