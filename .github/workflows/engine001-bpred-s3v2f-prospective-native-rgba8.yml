name: ENGINE-001 BPRED-S3v2f 80 new original Egret Canvas RGB8
on:
  push:
    branches: ['feature/image-geometry-optimization']
    paths:
      - '.github/workflows/engine001-bpred-s3v2f-prospective-native-rgba8.yml'
      - 'AutoDraw_Stage20/tests/run_engine001_bpred_s3v2f_prospective_native_rgba8.py'
      - 'AutoDraw_Stage20/tests/test_engine001_bpred_s3v2f_prospective_native_rgba8.py'
      - 'AutoDraw_Stage20/tests/engine001_bpred_s3v2f_gl_upload_observer.js'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: engine001-bpred-s3v2f-original-Egret
  cancel-in-progress: true
jobs:
  new-native-egret-canvas-vs-webgl:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin original Firefox 159.0
        id: firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795
        with:
          firefox-version: '159.0'
      - name: Install pinned Egret harness dependencies
        shell: bash
        run: |
          python -m pip install selenium==4.38.0 numpy==2.2.6 opencv-python-headless==4.11.0.86 Pillow==11.3.0 scikit-image==0.25.2 scipy==1.15.3 requests==2.32.5
      - name: Restore and verify original pinned game and prereg Git blobs
        shell: pwsh
        env:
          BROWSER_PATH: ${{ steps.firefox.outputs.firefox-path }}
        run: |
          if (-not (Test-Path -LiteralPath $env:BROWSER_PATH -PathType Leaf)) { throw 'Pinned Firefox159 unavailable' }
          & $env:BROWSER_PATH --version
          @'
          from pathlib import Path
          import subprocess,hashlib
          pins={
            "AutoDraw_Stage20/docs/ENGINE001_BPRED001_S3V2F_PROSPECTIVE_NATIVE_RGBA8_PREREG_2026-11-20.md": "24259eeeadb9451c43390bdcf5a01fb67c7cf39a",
            "AutoDraw_Stage20/gameEngine/main.min_653f95bc.js": "46cc74de00b6cb5d207b1e1a2ffcd81613b6d388",
            "AutoDraw_Stage20/tests/game_renderer_reference.js": "76d950e0a8911888a9df3b675b866519ecf7bba4",
            "AutoDraw_Stage20/tests/run_engine001_b1r_p4d3_native_brush_repeatability.py": "3437a9326b381d9c94d6ade80059d40adf233d09",
            "AutoDraw_Stage20/tests/run_engine001_bpred_s3_native_source_over.py": "1bf56df9507f2a34fd16e68eef190229c3184ce5",
            "AutoDraw_Stage20/tests/run_engine001_bpred_s3v2_native_canvas_stage.py": "511e81a362c4340e0dfdc36a292faa9cb2ef1e83",
            "AutoDraw_Stage20/tests/run_engine001_bpred_s3v2c_multicapture_trace.py": "974de6a86359e9ff49e2e77ee1f420dffa08064b",
            "AutoDraw_Stage20/tests/run_engine001_bpred_s3v2e_rgba8_quantization.py": "82f8e0c3f3e10fb30ea61d1beb52edf98696563c",
            "AutoDraw_Stage20/tests/engine001_bpred_s3v2c_multicapture_trace.js": "250a6f46c12498c15157825664a08ee4f12a2b83",
            "AutoDraw_Stage20/tests/engine001_bpred_s3v2d_source_node_selector.js": "de3b5c5f956e3de7a71817830874b346904bc9e2",
            "AutoDraw_Stage20/tests/engine001_bpred_s3v2f_gl_upload_observer.js": "75ee0779cf1bf06ad89f0b0368f6a31725f2fa23"
          }
          for name,expected in pins.items():
              raw=subprocess.check_output(["git","show","HEAD:"+name])
              got=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
              assert got==expected,(name,got,expected)
              Path(name).write_bytes(raw)
              assert Path(name).read_bytes()==raw
          print("S3V2F_ORIGINAL_PINNED_GIT_BLOBS_PASS",len(pins))
          '@ | python -
      - name: E2 frozen matrix and original Q/Canvas source-over regressions
        shell: bash
        run: |
          python -m py_compile AutoDraw_Stage20/tests/run_engine001_bpred_s3v2f_prospective_native_rgba8.py
          node --check AutoDraw_Stage20/tests/engine001_bpred_s3v2f_gl_upload_observer.js
          node --check AutoDraw_Stage20/tests/engine001_bpred_s3v2c_multicapture_trace.js
          node --check AutoDraw_Stage20/tests/engine001_bpred_s3v2d_source_node_selector.js
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_bpred_s3v2f_prospective_native_rgba8.py -v
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_bpred_s3v2e_rgba8_quantization.py -v
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_bpred_s3v2_native_canvas_stage.py -v
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_bpred_s3_native_source_over.py -v
          python AutoDraw_Stage20/tools/check_markdown_docs.py --root AutoDraw_Stage20
      - name: E3 80 new true main Canvas and separate mask with actual GL upload
        shell: pwsh
        env:
          BROWSER_PATH: ${{ steps.firefox.outputs.firefox-path }}
        run: |
          $env:PATH = (Split-Path $env:BROWSER_PATH -Parent) + ";" + $env:PATH
          $env:AUTODRAW_PINNED_FIREFOX_BINARY = $env:BROWSER_PATH
          python AutoDraw_Stage20/tests/run_engine001_bpred_s3v2f_prospective_native_rgba8.py --workspace . --engine AutoDraw_Stage20/gameEngine/main.min_653f95bc.js --renderer AutoDraw_Stage20/tests/game_renderer_reference.js --trace-js AutoDraw_Stage20/tests/engine001_bpred_s3v2c_multicapture_trace.js --selector-js AutoDraw_Stage20/tests/engine001_bpred_s3v2d_source_node_selector.js --gl-observer-js AutoDraw_Stage20/tests/engine001_bpred_s3v2f_gl_upload_observer.js --output AutoDraw_Stage20/.bpred-s3v2f-original-native
      - name: Independently verify original Egret native source/GL, 80+80+91 PNG and hashes
        shell: bash
        run: |
          python - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          root=Path("AutoDraw_Stage20/.bpred-s3v2f-original-native")
          r=json.loads((root/"report.json").read_text("utf8"))
          assert r["experiment"]=="ENGINE001_BPRED_S3V2F_PROSPECTIVE_ORIGINAL_EGRET_RGBA8_V1"
          assert r["E0_blob"]=="24259eeeadb9451c43390bdcf5a01fb67c7cf39a"
          assert r["github_sha"]==os.environ["GITHUB_SHA"] and str(r["github_run_id"])==os.environ["GITHUB_RUN_ID"]
          assert r["native_browser"]["browserVersion"].startswith("159.")
          assert r["true_native_primary"]==80 and r["true_native_main_canvas_PNG"]==80
          assert r["true_native_mask_canvas_PNG"]==80 and r["true_native_final_webgl_PNG"]==91
          assert r["true_native_replays"]==10 and r["blank_alpha0"]
          assert r["all_source_main_GL_upload_present"] and r["all_replays_RGBA_ROI_exact"]
          assert r["D1_native_alpha_mismatch"]==0
          assert r["H1_QH_new_native_exact_stage"] in ("PASS","FAIL")
          assert r["H2_QH_source_over_at_least_30_of_40"] in ("PASS","FAIL")
          assert not r["scientific_S3_safe"] and not r["root_cause_proven"]
          assert not r["S0_BLIND_used"] and not r["production_promotion"]
          assert r["previous_S3_native_C0_H1"]=="FAIL_UNCHANGED"
          assert r["E4_live_game"]=="NOT_RUN" and r["E5_independent"]=="NOT_RUN"
          assert r["exact_game_CHALK"] is None
          m=json.loads((root/"FROZEN_S3V2F_MANIFEST.json").read_text("utf8"))
          assert len(m["scenes"])==80 and len({s["sample_id"] for s in m["scenes"]})==80
          assert len(m["controls"])==10 and m["S0_BLIND_used"] is False
          rows=[json.loads(s) for s in (root/"PRIMARY_APPEND_ONLY.jsonl").read_text("utf8").splitlines()]
          pairs=json.loads((root/"D2_ORDERED_40.json").read_text("utf8"))
          assert len(rows)==80 and len({s["sample_id"] for s in rows})==80
          assert len(pairs)==20 and len({s["pair_id"] for s in pairs})==20
          for glob,count in (("*_REAL_MAIN_CANVAS.png",80),("*_REAL_MASK_CANVAS.png",80),
                             ("*_REAL_WEBGL.png",80),("*_ALIGNED_MAIN_RGBA.png",80),
                             ("GL_PROVENANCE.json",80),("D1_ALL_CHANNELS.json",80)):
              assert len(list((root/"native").rglob(glob)))==count,glob
          assert len(list((root/"replays").glob("*_REAL_EGRET.png")))==10
          assert (root/"S3V2F_REAL_EGRET_BLANK.png").is_file()
          expected=r["members_sha256"]
          actual={p.relative_to(root).as_posix() for p in root.rglob("*") if p.is_file() and p.name!="report.json"}
          assert set(expected)==actual
          for name,value in expected.items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==value,name
          print("BPRED_S3V2F_NATIVE_ARCHIVE_SHA_PASS",len(expected))
          print("BPRED_S3V2F_SCIENCE_H1_H2",r["H1_QH_new_native_exact_stage"],r["H2_QH_source_over_at_least_30_of_40"])
          print("BPRED_S3V2F_D1",r["D1_RGB_mismatch_by_mode"])
          PY
      - name: Archive new native original Canvas, mask, WebGL and all negative cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-bpred-s3v2f-prospective-80-main-mask-webgl
          path: AutoDraw_Stage20/.bpred-s3v2f-original-native/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
