name: ENGINE-001 BPRED-S3v2i all original Canvas stroke events E3
on:
  push:
    branches: ['feature/image-geometry-optimization']
    paths:
      - '.github/workflows/engine001-bpred-s3v2i-all-original-native-stroke-events.yml'
      - 'AutoDraw_Stage20/tests/run_engine001_bpred_s3v2i_all_native_stroke_events.py'
      - 'AutoDraw_Stage20/tests/test_engine001_bpred_s3v2i_all_native_stroke_events.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: engine001-bpred-s3v2i-all-native-strokes
  cancel-in-progress: true
jobs:
  original-native-all-events:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 1
          submodules: false
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin authentic Firefox 159.0
        id: firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795
        with:
          firefox-version: '159.0'
      - name: Install exact native Egret and original math dependencies
        shell: bash
        run: |
          python -m pip install selenium==4.38.0 numpy==2.2.6 opencv-python-headless==4.11.0.86 Pillow==11.3.0 scikit-image==0.25.2 scipy==1.15.3 requests==2.32.5
      - name: Restore only original immutable game, scripts, E0 and research parents
        shell: pwsh
        env:
          BROWSER_PATH: ${{ steps.firefox.outputs.firefox-path }}
        run: |
          if (-not (Test-Path -LiteralPath $env:BROWSER_PATH -PathType Leaf)) { throw 'Firefox159 not available' }
          & $env:BROWSER_PATH --version
          @'
          from pathlib import Path
          import subprocess,hashlib
          pinned={
            "AutoDraw_Stage20/docs/ENGINE001_BPRED001_S3V2H_NATIVE_CANVAS_STROKE_STEP_PREREG_2026-11-20.md": "75255a7f48d5be00a34a164edb2bcf03e6349d76",
            "AutoDraw_Stage20/docs/ENGINE001_BPRED001_S3V2I_ALL_NATIVE_STROKE_EVENTS_PREREG_2026-11-20.md": "9350e69c5f83747a46c71eeb9142065be928a7a5",
            "AutoDraw_Stage20/gameEngine/main.min_653f95bc.js": "46cc74de00b6cb5d207b1e1a2ffcd81613b6d388",
            "AutoDraw_Stage20/tests/game_renderer_reference.js": "76d950e0a8911888a9df3b675b866519ecf7bba4",
            "AutoDraw_Stage20/tests/run_engine001_bpred_s3_native_source_over.py": "1bf56df9507f2a34fd16e68eef190229c3184ce5",
            "AutoDraw_Stage20/tests/run_engine001_bpred_s3v2_native_canvas_stage.py": "511e81a362c4340e0dfdc36a292faa9cb2ef1e83",
            "AutoDraw_Stage20/tests/run_engine001_bpred_s3v2c_multicapture_trace.py": "974de6a86359e9ff49e2e77ee1f420dffa08064b",
            "AutoDraw_Stage20/tests/run_engine001_bpred_s3v2f_prospective_native_rgba8.py": "0c3b799f6bc22958911d35420a30fef1950813dd",
            "AutoDraw_Stage20/tests/run_engine001_b1r_p4d3_native_brush_repeatability.py": "3437a9326b381d9c94d6ade80059d40adf233d09",
            "AutoDraw_Stage20/tests/run_engine001_bpred_s3v2h_native_stroke_steps.py": "4ae040c6f3720a5ee8fba43e0e4e9acd640264cd",
            "AutoDraw_Stage20/tests/engine001_bpred_s3v2c_multicapture_trace.js": "250a6f46c12498c15157825664a08ee4f12a2b83",
            "AutoDraw_Stage20/tests/engine001_bpred_s3v2d_source_node_selector.js": "de3b5c5f956e3de7a71817830874b346904bc9e2",
            "AutoDraw_Stage20/tests/engine001_bpred_s3v2h_original_stroke_step_trace.js": "383e0b25000f4c387687fb38423dce790f149499"
          }
          for p,expected in pinned.items():
              data=subprocess.check_output(["git","show","HEAD:"+p])
              got=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
              assert got==expected,(p,got,expected)
              Path(p).write_bytes(data)
              assert Path(p).read_bytes()==data
          print("BPRED_S3V2I_FROZEN_SOURCE_BLOBS_PASS",len(pinned))
          '@ | python -
      - name: E2 original all-events observability and negative-control regressions
        shell: bash
        run: |
          python -m py_compile AutoDraw_Stage20/tests/run_engine001_bpred_s3v2i_all_native_stroke_events.py
          node --check AutoDraw_Stage20/tests/engine001_bpred_s3v2h_original_stroke_step_trace.js
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_bpred_s3v2i_all_native_stroke_events.py -v
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_bpred_s3v2h_native_stroke_steps.py -v
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_bpred_s3v2f_prospective_native_rgba8.py -v
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_bpred_s3_native_source_over.py -v
          python AutoDraw_Stage20/tools/check_markdown_docs.py --root AutoDraw_Stage20
      - name: Restore exact original S3v2f 80-scene native parent archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44710870514 -R Kiddos19882/AutoDraw -n engine001-bpred-s3v2f-prospective-80-main-mask-webgl -D AutoDraw_Stage20/.bpred-s3v2i-source
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          parent=Path("AutoDraw_Stage20/.bpred-s3v2i-source")
          files=sorted(p for p in parent.rglob("*") if p.is_file())
          assert len(files)==656 and (parent/"report.json").is_file()
          target=Path("AutoDraw_Stage20/.bpred-s3v2i-source.zip")
          with ZipFile(target,"x",compression=ZIP_DEFLATED) as z:
              for p in files:
                  z.write(p,p.relative_to(parent).as_posix())
          with ZipFile(target) as z:
              assert z.testzip() is None and len(z.namelist())==656
          print("BPRED_S3V2I_FROZEN_PARENT_CRC_PASS",len(files))
          PY
      - name: E3 observe ALL genuine Egret stroke operations in24 original sources
        shell: pwsh
        env:
          BROWSER_PATH: ${{ steps.firefox.outputs.firefox-path }}
        run: |
          $env:PATH = (Split-Path $env:BROWSER_PATH -Parent) + ";" + $env:PATH
          $env:AUTODRAW_PINNED_FIREFOX_BINARY = $env:BROWSER_PATH
          python AutoDraw_Stage20/tests/run_engine001_bpred_s3v2i_all_native_stroke_events.py --workspace . --engine AutoDraw_Stage20/gameEngine/main.min_653f95bc.js --renderer AutoDraw_Stage20/tests/game_renderer_reference.js --trace-js AutoDraw_Stage20/tests/engine001_bpred_s3v2c_multicapture_trace.js --selector-js AutoDraw_Stage20/tests/engine001_bpred_s3v2d_source_node_selector.js --stroke-js AutoDraw_Stage20/tests/engine001_bpred_s3v2h_original_stroke_step_trace.js --source-zip AutoDraw_Stage20/.bpred-s3v2i-source.zip --output AutoDraw_Stage20/.bpred-s3v2i-original-native
      - name: Independent original source/full all-event PNG and report SHA verification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,os
          root=Path("AutoDraw_Stage20/.bpred-s3v2i-original-native")
          r=json.loads((root/"report.json").read_text("utf8"))
          assert r["experiment"]=="ENGINE001_BPRED_S3V2I_ALL_ORIGINAL_NATIVE_STROKE_EVENTS_V1"
          assert r["E0_blob"]=="9350e69c5f83747a46c71eeb9142065be928a7a5"
          assert r["github_sha"]==os.environ["GITHUB_SHA"] and str(r["github_run_id"])==os.environ["GITHUB_RUN_ID"]
          assert r["source_original_E3_run"]=="44710870514"
          assert r["source_original_E3_sha"]=="819b7fd20272e5ac87ead72ce0610687fa51cbf4"
          assert r["source_original_E3_verified_member_SHA"]==655
          assert str(r["native_browser"]["browserVersion"]).startswith("159.")
          assert r["true_original_scenes"]==24 and r["true_main_canvas_PNG"]==24 and r["true_mask_canvas_PNG"]==24
          assert r["true_final_webgl_PNG"]==28 and r["true_replays"]==3 and r["blank_alpha0"]
          assert r["H1_native_final_stroke_exact"] in ("PASS","FAIL")
          assert r["owner_operation_attribution"]=="UNKNOWN"
          assert r["original_S3v2f_two_owner_H2"]=="FAIL_UNCHANGED"
          assert r["original_S3v2g_integer_P2"]=="FAIL_UNCHANGED"
          assert r["original_S3v2h_fixed_operation_count"]=="BLOCKED_PRESERVED"
          assert r["no_new_model_validation"] and not r["S0_BLIND_used"] and not r["production_promotion"]
          assert r["E4_live_game"]=="NOT_RUN" and r["E5_independent"]=="NOT_RUN" and r["exact_game_CHALK"] is None
          dist=r["native_main_event_distribution"]
          rows=json.loads((root/"ALL_NATIVE_STROKE_COMPARISONS_24.json").read_text("utf8"))
          ctrls=json.loads((root/"REPLAY_CONTROLS.json").read_text("utf8"))
          assert len(dist)==24 and len({d["sample_id"] for d in dist})==24
          assert len(rows)==24 and len({d["sample_id"] for d in rows})==24
          assert len(ctrls)==3 and all(x["RGBA_ROI_exact"] for x in ctrls)
          assert r["native_main_stroke_event_PNG"]==sum(d["number_of_true_main_stroke_events"] for d in dist)
          assert all(1<=d["number_of_true_main_stroke_events"]<=32 for d in dist)
          native=root/"native"
          for p,n in [("*_REAL_MAIN_CANVAS.png",24),("*_REAL_MASK_CANVAS.png",24),
                      ("*_REAL_WEBGL.png",24),("*_REAL_NATIVE_STEP_*.png",r["native_main_stroke_event_PNG"]),
                      ("REAL_NATIVE_ALL_EVENT_METADATA.json",24),
                      ("REAL_NATIVE_STROKE_COUNTS.json",24),
                      ("LAST_STEP_TO_FINAL_MAIN_RGBA_DELTA.png",24)]:
              assert len(list(native.rglob(p)))==n,p
          assert len(list((root/"replays").glob("*_REAL_EGRET.png")))==3
          assert (root/"S3V2I_REAL_EGRET_BLANK.png").is_file()
          hashes=r["members_sha256"]
          members={p.relative_to(root).as_posix() for p in root.rglob("*") if p.is_file() and p.name!="report.json"}
          assert set(hashes)==members
          for p,expect in hashes.items():
              assert hashlib.sha256((root/p).read_bytes()).hexdigest()==expect,p
          print("S3V2I_NATIVE_EVENT_COUNTS",r["native_main_stroke_event_PNG"],[(d["variant"],d["number_of_true_main_stroke_events"]) for d in dist])
          print("S3V2I_NATIVE_REPORT_SHA_PASS",len(hashes))
          print("S3V2I_H1_LAST_EXACT",r["H1_native_final_stroke_exact"])
          PY
      - name: Archive ALL observed real Egret event snapshots and blocked diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-bpred-s3v2i-all-real-original-native-stroke-events
          path: AutoDraw_Stage20/.bpred-s3v2i-original-native/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
