name: ENGINE-001 BPRED-S3v2k frozen source-owner uncertainty E2 diagnostic
on:
  push:
    branches: ['feature/image-geometry-optimization']
    paths:
      - '.github/workflows/engine001-bpred-s3v2k-owner-alpha-interval-offline.yml'
      - 'AutoDraw_Stage20/tests/run_engine001_bpred_s3v2k_owner_alpha_interval.py'
      - 'AutoDraw_Stage20/tests/test_engine001_bpred_s3v2k_owner_alpha_interval.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: engine001-bpred-s3v2k-owner-uncertainty
  cancel-in-progress: true
jobs:
  source-native-known-egret-calibration-only:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned original owner-RGB scientific dependencies
        run: |
          python -m pip install numpy==2.2.6 Pillow==11.3.0 opencv-python-headless==4.11.0.86 scikit-image==0.25.2 scipy==1.15.3 selenium==4.38.0 requests==2.32.5
      - name: Pin frozen S3v2k E0 and original source mathematics Git blob
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,subprocess
          pins={
            "AutoDraw_Stage20/docs/ENGINE001_BPRED001_S3V2K_SOURCE_OWNER_ALPHA_INTERVAL_PREREG_2026-11-20.md": "3ae0356c353b89249ad636fa03cdd094e3d3e713",
            "AutoDraw_Stage20/docs/ENGINE001_BPRED001_S3V2J_NEW_NATIVE_ALPHA0_OWNER_INFLUENCE_PREREG_2026-11-20.md": "6801292e01a650a2b014ffe09256313ebe10562b",
            "AutoDraw_Stage20/tests/run_engine001_bpred_s3_native_source_over.py": "1bf56df9507f2a34fd16e68eef190229c3184ce5",
            "AutoDraw_Stage20/tests/run_engine001_bpred_s3v2f_prospective_native_rgba8.py": "0c3b799f6bc22958911d35420a30fef1950813dd",
          }
          for path,expected in pins.items():
              raw=subprocess.check_output(["git","show","HEAD:"+path])
              actual=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
              assert actual==expected,(path,actual,expected)
              Path(path).write_bytes(raw)
          print("BPRED_S3V2K_FROZEN_E0_ORIGINAL_SOURCE_GIT_BLOBS_PASS",len(pins))
          PY
      - name: E2 frozen I0 I1 I2 interval and fail-closed negative contracts
        run: |
          python -m py_compile AutoDraw_Stage20/tests/run_engine001_bpred_s3v2k_owner_alpha_interval.py
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_bpred_s3v2k_owner_alpha_interval.py -v
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_bpred_s3_native_source_over.py -v
          python AutoDraw_Stage20/tools/check_markdown_docs.py --root AutoDraw_Stage20
      - name: Retrieve frozen actual original Egret S3v2j E3 parent and CRC seal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44721915503 -R Kiddos19882/AutoDraw -n engine001-bpred-s3v2j-new-native-alpha0-owner-risk-80 -D AutoDraw_Stage20/.bpred-s3v2k-frozen-source
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          root=Path("AutoDraw_Stage20/.bpred-s3v2k-frozen-source")
          entries=sorted(p for p in root.rglob("*") if p.is_file())
          assert len(entries)==857 and (root/"report.json").is_file()
          out=Path("AutoDraw_Stage20/.bpred-s3v2k-frozen-source.zip")
          with ZipFile(out,"x",compression=ZIP_DEFLATED) as z:
              for p in entries:
                  z.write(p,p.relative_to(root).as_posix())
          with ZipFile(out) as z:
              assert z.testzip() is None and len(z.namelist())==857
          print("BPRED_S3V2K_ORIGINAL_NATIVE_857_INPUTS_CRC_PASS")
          PY
      - name: Recalculate all original frozen H1 B0 and S3v2k I1 I2 40 original Egret ordered cases
        run: |
          python AutoDraw_Stage20/tests/run_engine001_bpred_s3v2k_owner_alpha_interval.py --workspace . --source-zip AutoDraw_Stage20/.bpred-s3v2k-frozen-source.zip --output AutoDraw_Stage20/.bpred-s3v2k-result
      - name: Independently audit all source hash, 21 actual risk, untouched original gates and diagnostic FAIL
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os,hashlib
          root=Path("AutoDraw_Stage20/.bpred-s3v2k-result")
          r=json.loads((root/"report.json").read_text("utf8"))
          assert r["experiment"]=="ENGINE001_BPRED_S3V2K_OWNER_INTERVAL_OFFLINE_V1"
          assert r["E0_blob"]=="3ae0356c353b89249ad636fa03cdd094e3d3e713"
          assert r["github_sha"]==os.environ["GITHUB_SHA"] and str(r["github_run_id"])==os.environ["GITHUB_RUN_ID"]
          assert r["source_run"]=="44721915503" and r["source_sha"]=="ad1fa7fd66d4df563d729b7faae27651ca8279ea"
          assert r["source_archive_members_SHA_CRC"]==856 and r["source_scenes"]==80 and r["ordered_cases"]==40
          assert r["original_C0_canvas_pass_40"]==31 and r["original_C0_QH_webgl_pass_40"]==21
          assert r["QH_stage_RGB_mismatch"]==0 and r["QH_stage_alpha_mismatch"]==0
          assert r["source_hidden_alpha0_changed_owner_pixels"]==21
          assert r["D1_21_known_covered_zero_false_safe"] in ("PASS","FAIL")
          assert r["D2_full_source_owner_interval"] in ("PASS","FAIL")
          assert r["D3_nonvacuous_at_least_50_percent"] in ("PASS","FAIL")
          assert r["D4_original_metrics_unchanged"]=="PASS"
          assert r["model_status"]=="MODEL_ONLY_UNKNOWN" and r["new_native_E3"] is False
          assert r["original_S3v2j_source_over"]=="FAIL_UNCHANGED"
          assert r["original_S3v2f_H2"]=="FAIL_UNCHANGED" and r["original_S3v2g_P2"]=="FAIL_UNCHANGED"
          assert r["original_EF_protected_quality"]=="FAIL_UNCHANGED"
          assert not r["S0_BLIND_used"] and not r["production_promotion"]
          assert r["E4_game"]=="NOT_RUN" and r["E5_independent"]=="NOT_RUN" and r["exact_game_CHALK"] is None
          rows=json.loads((root/"ALL_40_SOURCE_OWNER_INTERVAL_CASES.json").read_text("utf8"))
          misses=json.loads((root/"ALL_I1_OUT_OF_ENVELOPE_PIXELS.json").read_text("utf8"))
          known=json.loads((root/"ALL_21_ALPHA0_OWNER_RISK_AUDIT.json").read_text("utf8"))
          assert len(rows)==40 and len({x["sample_id"] for x in rows})==40
          assert len(misses)==r["I1_full_image_source_owner_pixel_misses"]
          assert len(known)==21 and len({(x["sample_id"],tuple(x["xy_physical"])) for x in known})==21
          assert r["I1_known_risk_misses"]==sum(not x["I1_contains_RGBA"] for x in known)
          assert r["I2_correct_unchanged_candidates"]<=r["I2_genuine_unchanged_pixels"]
          hashes=r["members_sha256"]
          actual={p.relative_to(root).as_posix() for p in root.rglob("*") if p.is_file() and p.name!="report.json"}
          assert len(hashes)==3 and set(hashes)==actual
          for p,expect in hashes.items():
              assert hashlib.sha256((root/p).read_bytes()).hexdigest()==expect,p
          print("BPRED_S3V2K_RAW_OUTPUT_ALL_SHA_PASS",len(hashes))
          print("BPRED_S3V2K_D1_D2_D3",r["D1_21_known_covered_zero_false_safe"],r["D2_full_source_owner_interval"],r["D3_nonvacuous_at_least_50_percent"])
          print("BPRED_S3V2K_COUNTS",r["I1_known_risk_misses"],r["I1_full_image_source_owner_pixel_misses"],r["I2_false_safe_pixels"],r["I2_correct_unchanged_candidates"],r["I2_genuine_unchanged_pixels"])
          PY
      - name: Preserve all 40 original owner case metrics and every negative pixel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-bpred-s3v2k-original-source-owner-alpha-interval
          path: AutoDraw_Stage20/.bpred-s3v2k-result/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
