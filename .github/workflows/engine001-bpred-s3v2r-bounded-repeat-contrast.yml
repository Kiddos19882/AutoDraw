name: ENGINE-001 BPRED-S3v2r2 corrected original Egret true n+1 stroke events
on:
  push:
    branches: ['feature/image-geometry-optimization']
    paths:
      - '.github/workflows/engine001-bpred-s3v2r-bounded-repeat-contrast.yml'
      - 'AutoDraw_Stage20/tests/run_engine001_bpred_s3v2r_bounded_repeat_contrast_native.py'
      - 'AutoDraw_Stage20/tests/test_engine001_bpred_s3v2r_bounded_repeat_contrast_native.py'
      - 'AutoDraw_Stage20/tests/engine001_bpred_s3v2r_original_contrast_repeat_observer.js'
      - 'AutoDraw_Stage20/docs/ENGINE001_BPRED001_S3V2R_BOUNDED_REPEAT_CONTRAST_NATIVE_PREREG_2026-11-20.md'
      - 'AutoDraw_Stage20/docs/ENGINE001_BPRED001_S3V2R2_ORIGINAL_EVENT_COUNT_CORRECTION_PREREG_2026-11-20.md'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: engine001-bpred-s3v2r-bounded-repeat
  cancel-in-progress: true
jobs:
  original-egret-bounded-repeat-contrast:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin original native Firefox 159.0
        id: firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795
        with:
          firefox-version: '159.0'
      - name: Install source native Egret and exact-rational analysis dependencies
        shell: bash
        run: |
          python -m pip install selenium==4.38.0 numpy==2.2.6 opencv-python-headless==4.11.0.86 Pillow==11.3.0 scikit-image==0.25.2 scipy==1.15.3 requests==2.32.5
      - name: Verify new frozen S3v2r E0 and immutable original Egret source blobs
        shell: pwsh
        env:
          BROWSER_PATH: ${{ steps.firefox.outputs.firefox-path }}
        run: |
          if (-not (Test-Path -LiteralPath $env:BROWSER_PATH -PathType Leaf)) { throw "Missing pinned Firefox 159" }
          & $env:BROWSER_PATH --version
          @'
          from pathlib import Path
          import subprocess,hashlib
          pins={
            "AutoDraw_Stage20/docs/ENGINE001_BPRED001_S3V2O_NEW_NATIVE_LOW_ALPHA_READBACK_PREREG_2026-11-20.md": "72343545d1f8645625085afb36e5fddeda2f91c8",
            "AutoDraw_Stage20/docs/ENGINE001_BPRED001_S3V2J_NEW_NATIVE_ALPHA0_OWNER_INFLUENCE_PREREG_2026-11-20.md": "6801292e01a650a2b014ffe09256313ebe10562b",
            "AutoDraw_Stage20/docs/ENGINE001_BPRED001_S3V2N_CORRELATED_ALPHA_PREMULT_TRANSITIONS_PREREG_2026-11-20.md": "81f1a18ed5b04265123c337a3cbd63985a835307",
            "AutoDraw_Stage20/gameEngine/main.min_653f95bc.js": "46cc74de00b6cb5d207b1e1a2ffcd81613b6d388",
            "AutoDraw_Stage20/tests/game_renderer_reference.js": "76d950e0a8911888a9df3b675b866519ecf7bba4",
            "AutoDraw_Stage20/tests/engine001_bpred_s3v2c_multicapture_trace.js": "250a6f46c12498c15157825664a08ee4f12a2b83",
            "AutoDraw_Stage20/tests/engine001_bpred_s3v2d_source_node_selector.js": "de3b5c5f956e3de7a71817830874b346904bc9e2",
            "AutoDraw_Stage20/tests/engine001_bpred_s3v2h_original_stroke_step_trace.js": "383e0b25000f4c387687fb38423dce790f149499",
            "AutoDraw_Stage20/tests/run_engine001_bpred_s3v2j_new_native_alpha0_owner_influence.py": "42167e9dbcfad55dcb38216a335f61a0b93989e5",
            "AutoDraw_Stage20/tests/run_engine001_bpred_s3v2n_correlated_alpha_premult.py": "c55e13bbcf9d2786f741a56ee7a6b39873fee89f",
            "AutoDraw_Stage20/docs/ENGINE001_BPRED001_S3V2P_NATIVE_CANVAS_READBACK_VS_COMPOSITION_PREREG_2026-11-20.md": "44d6f3d72ed6c62f38054d11f050ee16cab50bc2",
            "AutoDraw_Stage20/tests/engine001_bpred_s3v2p_canvas_readback_observer.js": "137638cde42ce36e14abb917994f1cbb12bac0b2",
            "AutoDraw_Stage20/tests/run_engine001_bpred_s3v2p_native_canvas_readback_vs_composition.py": "ee6c947a20faff3f85413862d3bdf1a0d830be40",
            "AutoDraw_Stage20/docs/ENGINE001_BPRED001_S3V2Q_NATIVE_INCREMENTAL_MICROALPHA_OWNER_PREREG_2026-11-20.md": "ac0bd08ee45058e890ef16c75efea58ca27bec47",
            "AutoDraw_Stage20/tests/engine001_bpred_s3v2q_incremental_canvas_microalpha.js": "e975ab15f7f4b5646b6d53c8f55fe6bd1f8e6911",
            "AutoDraw_Stage20/docs/ENGINE001_BPRED001_S3V2R_BOUNDED_REPEAT_CONTRAST_NATIVE_PREREG_2026-11-20.md": "1909565e0a9e4fc7b742e88f2324b848d8f9e017",
            "AutoDraw_Stage20/docs/ENGINE001_BPRED001_S3V2R2_ORIGINAL_EVENT_COUNT_CORRECTION_PREREG_2026-11-20.md": "e98acc22663beb7f8051e7626c95f696e405f5f3",
            "AutoDraw_Stage20/docs/ENGINE001_BPRED001_S3V2I_ALL_NATIVE_STROKE_EVENTS_PREREG_2026-11-20.md": "9350e69c5f83747a46c71eeb9142065be928a7a5",
            "AutoDraw_Stage20/docs/ENGINE001_BPRED001_S3V2H_NATIVE_CANVAS_STROKE_STEP_PREREG_2026-11-20.md": "75255a7f48d5be00a34a164edb2bcf03e6349d76",
            "AutoDraw_Stage20/tests/run_engine001_bpred_s3_native_source_over.py": "1bf56df9507f2a34fd16e68eef190229c3184ce5",
            "AutoDraw_Stage20/tests/run_engine001_bpred_s3v2_native_canvas_stage.py": "511e81a362c4340e0dfdc36a292faa9cb2ef1e83",
            "AutoDraw_Stage20/tests/run_engine001_bpred_s3v2c_multicapture_trace.py": "974de6a86359e9ff49e2e77ee1f420dffa08064b",
            "AutoDraw_Stage20/tests/run_engine001_bpred_s3v2f_prospective_native_rgba8.py": "0c3b799f6bc22958911d35420a30fef1950813dd",
            "AutoDraw_Stage20/tests/run_engine001_bpred_s3v2i_all_native_stroke_events.py": "fdb1542437d645875c305f94bfddef007b4c3e40",
            "AutoDraw_Stage20/tests/run_engine001_bpred_s3v2h_native_stroke_steps.py": "4ae040c6f3720a5ee8fba43e0e4e9acd640264cd",
            "AutoDraw_Stage20/tests/run_engine001_b1r_p4d3_native_brush_repeatability.py": "3437a9326b381d9c94d6ade80059d40adf233d09",
            "AutoDraw_Stage20/tests/run_engine001_bpred_s3v2e_rgba8_quantization.py": "82f8e0c3f3e10fb30ea61d1beb52edf98696563c"
          }
          for path,expected in pins.items():
            raw=subprocess.check_output(["git","show","HEAD:"+path])
            sha=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
            assert sha==expected,(path,sha,expected)
            Path(path).write_bytes(raw)
            assert Path(path).read_bytes()==raw
          print("S3V2R_FIRST_FROZEN_E0_AND_PARENT_ORIGINAL_BLOBS_PASS",len(pins))
          '@ | python -
      - name: E2 bounded frozen source geometry and original native exact-byte provenance contracts
        shell: bash
        run: |
          python -m py_compile AutoDraw_Stage20/tests/run_engine001_bpred_s3v2r_bounded_repeat_contrast_native.py
          node --check AutoDraw_Stage20/tests/engine001_bpred_s3v2h_original_stroke_step_trace.js
          node --check AutoDraw_Stage20/tests/engine001_bpred_s3v2r_original_contrast_repeat_observer.js
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_bpred_s3v2r_bounded_repeat_contrast_native.py -v
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_bpred_s3v2j_new_native_alpha0_owner_influence.py -v
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_bpred_s3v2i_all_native_stroke_events.py -v
          python AutoDraw_Stage20/tools/check_markdown_docs.py --root AutoDraw_Stage20
      - name: E3 original Egret repeated 1 and 8 brush strokes on contrasting owners
        shell: pwsh
        env:
          BROWSER_PATH: ${{ steps.firefox.outputs.firefox-path }}
        run: |
          $env:PATH = (Split-Path $env:BROWSER_PATH -Parent) + ";" + $env:PATH
          $env:AUTODRAW_PINNED_FIREFOX_BINARY = $env:BROWSER_PATH
          python AutoDraw_Stage20/tests/run_engine001_bpred_s3v2r_bounded_repeat_contrast_native.py --workspace . --engine AutoDraw_Stage20/gameEngine/main.min_653f95bc.js --renderer AutoDraw_Stage20/tests/game_renderer_reference.js --trace-js AutoDraw_Stage20/tests/engine001_bpred_s3v2c_multicapture_trace.js --selector-js AutoDraw_Stage20/tests/engine001_bpred_s3v2d_source_node_selector.js --stroke-js AutoDraw_Stage20/tests/engine001_bpred_s3v2h_original_stroke_step_trace.js --observer-js AutoDraw_Stage20/tests/engine001_bpred_s3v2r_original_contrast_repeat_observer.js --output AutoDraw_Stage20/.bpred-s3v2r2-bounded-native
      - name: Independently audit new original genuine native per-stroke raw, controls, and all negatives
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path("AutoDraw_Stage20/.bpred-s3v2r2-bounded-native")
          r=json.loads((root/"report.json").read_text("utf8"))
          assert r["experiment"]=="ENGINE001_BPRED_S3V2R2_BOUNDED_NATIVE_CONTRAST_REPEATED_STROKES_V2"
          assert r["E0_blob"]=="e98acc22663beb7f8051e7626c95f696e405f5f3"
          assert r["github_sha"]==os.environ["GITHUB_SHA"]
          assert str(r["github_run_id"])==os.environ["GITHUB_RUN_ID"]
          assert r["browser"]["browserName"]=="firefox" and str(r["browser"]["browserVersion"]).startswith("159.")
          assert r["game_source_blob"]=="46cc74de00b6cb5d207b1e1a2ffcd81613b6d388"
          assert r["renderer_source_blob"]=="76d950e0a8911888a9df3b675b866519ecf7bba4"
          assert r["T0_provenance"]=="PASS"
          assert r["new_original_source_scenes"]==42
          assert r["native_original_main_PNG"]==42 and r["native_original_mask_PNG"]==42
          assert r["original_native_webgl_PNG"]==49
          assert r["original_input_source_strokes"]==150
          assert r["original_main_strokes"]==192 and r["original_direct_prepost_RGBA"]==384
          assert r["uninstrumented_replays"]==6 and r["replay_all_ROI_exact"] is True
          assert r["blank_original_alpha0"] is True
          assert r["T1_strict_foreign_zero"] in ("FAIL","NO_HARM_OBSERVED_IN_NEW_SAMPLE_ONLY")
          assert r["T2_next_decision"] in ("MATERIAL_EFFECT_OBSERVED","SMALL_BYTE_ONLY_IN_SAMPLE")
          assert r["T2_micro_threshold2_diagnostic_only"] is True
          assert r["T2_visually_acceptable_unproven"] is True
          assert r["T4_previous_S3v2q_strict_foreign"]=="FAIL_20"
          assert r["T4_original_failed_S3v2r_V1_provenance"]=="FAIL_N_PLUS_ONE_MAIN_EVENTS"
          assert r["T4_previous_S3v2q_G3_usefulness"]=="FAIL_7653_OF_8633"
          assert r["T4_original_EF_protected_quality"]=="FAIL_UNCHANGED"
          assert r["T4_internal_fractional_alpha"]=="UNKNOWN"
          assert r["S0_BLIND_used"] is False and r["production_promotion"] is False
          assert r["S4"]=="NOT_RUN" and r["E4_game"]=="NOT_RUN" and r["E5_game"]=="NOT_RUN"
          assert r["exact_game_CHALK"] is None
          m=json.loads((root/"FROZEN_S3V2R_MANIFEST.json").read_text("utf8"))
          assert len(m["scenes"])==42 and len({s["sample_id"] for s in m["scenes"]})==42
          assert len(m["replays"])==6
          assert sum(len(s["runtime_strokes"]) for s in m["scenes"])==150
          assert m["original_main_stroke_events"]==192
          assert m["direct_rgba_expected"]==384
          cases=json.loads((root/"ALL_12_TRUE_REPEATED_NATIVE_OWNER_PAIRS.json").read_text("utf8"))
          effects=json.loads((root/"EVERY_TRUE_INCREMENTAL_OWNER_CHANGED_PIXEL.json").read_text("utf8"))
          details=json.loads((root/"EVERY_FINAL_NON_MICRO_OR_ALPHA_CHANGED_PIXEL.json").read_text("utf8"))
          events=json.loads((root/"ALL_TRUE_NATIVE_STROKE_EVENT_METADATA.json").read_text("utf8"))
          replay=json.loads((root/"INDEPENDENT_REPLAY_CONTROLS.json").read_text("utf8"))
          assert len(cases)==12 and len(effects)==r["T1_affected_original_pixel_occurrences"]
          assert len(events)==192
          assert len(replay)==6 and all(x["uninstrumented_native_webgl_ROI_exact"] for x in replay)
          assert sum(c["R1"]["final_RGB_abs_over2_owner_pixels"]+c["R8"]["final_RGB_abs_over2_owner_pixels"] for c in cases)==r["T2_final_nonmicro_RGB_abs_gt2_pixels"]
          assert sum(c["R1"]["final_alpha_changed_owner_pixels"]+c["R8"]["final_alpha_changed_owner_pixels"] for c in cases)==r["T2_final_changed_alpha_pixels"]
          assert len(details)>=r["T2_final_nonmicro_RGB_abs_gt2_pixels"]
          native=root/"native"
          for pattern,expected in [
              ("*_REAL_MAIN_CANVAS.png",42),("*_REAL_MASK_CANVAS.png",42),
              ("*_REAL_WEBGL.png",42),("*_REAL_STROKE_STEP_*.png",192),
              ("*_REAL_PRE_STROKE_*.rgba",192),("*_REAL_POST_STROKE_*.rgba",192),
              ("TRUE_ORIGINAL_NATIVE_PROVENANCE.json",42)
          ]:
              found=len(list(native.rglob(pattern)))
              assert found==expected,(pattern,found,expected)
          assert len(list((root/"replays").glob("*_REAL_EGRET.png")))==6
          assert (root/"S3V2R_REAL_ORIGINAL_BLANK.png").is_file()
          paths={x.relative_to(root).as_posix() for x in root.rglob("*") if x.is_file() and x.name!="report.json"}
          assert paths==set(r["members_sha256"])
          for path,expect in r["members_sha256"].items():
              assert hashlib.sha256((root/path).read_bytes()).hexdigest()==expect,path
          print("S3V2R_ALL_ORIGINAL_SOURCES_AND_MEMBER_SHA_PASS",len(paths))
          print("S3V2R_GENUINE_OWNER_DELTA",len(effects),r["T2_final_nonmicro_RGB_abs_gt2_pixels"],r["T2_final_changed_alpha_pixels"])
          print("S3V2R_DECISION",r["T2_next_decision"],r["T2_max_final_RGB_abs_channel"])
          PY
      - name: Archive bounded original Egret actual stroke raw RGB alpha and negatives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-bpred-s3v2r2-bounded-contrast-native
          path: AutoDraw_Stage20/.bpred-s3v2r2-bounded-native/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
