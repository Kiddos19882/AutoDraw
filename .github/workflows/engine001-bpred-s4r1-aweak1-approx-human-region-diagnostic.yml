name: ENGINE-001 BPRED-S4R1 AWEAK1 human visual marks approximate source regions

on:
  push:
    branches: ['feature/image-geometry-optimization']
    paths:
      - '.github/workflows/engine001-bpred-s4r1-aweak1-approx-human-region-diagnostic.yml'
      - 'AutoDraw_Stage20/tests/run_engine001_bpred_s4r1_aweak1_original_region_hint_diagnostic.py'
      - 'AutoDraw_Stage20/tests/test_engine001_bpred_s4r1_aweak1_original_region_hint_diagnostic.py'
      - 'AutoDraw_Stage20/docs/ENGINE001_BPRED001_S4R1_AWEAK1_SINGLE_HUMAN_REGIONAL_DIAGNOSTIC_PREREG_2026-11-21.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine001-bpred-s4r1-aweak1-approx-human-dev
  cancel-in-progress: true

jobs:
  source-only-aweak1-frozen-a-exploratory:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 6
        with:
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing source numerical stack, no pretrained inference
        run: |
          python -m pip install numpy==2.2.6 opencv-python-headless==4.11.0.86 Pillow==11.3.0 scikit-image==0.25.2 scipy==1.15.3
      - name: Frozen E0, synthetic tolerance and source input gates
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path("AutoDraw_Stage20/docs/ENGINE001_BPRED001_S4R1_AWEAK1_SINGLE_HUMAN_REGIONAL_DIAGNOSTIC_PREREG_2026-11-21.md")
          raw=p.read_bytes()
          git_blob=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
          assert git_blob=="a6ceeceb6095b2b23224ce8c412a44818302066c", ("AWEAK1_E0_DRIFT",git_blob)
          print("FROZEN_AWEAK1_PRIOR_TO_NEW_METRICS",git_blob)
          PY
          python -m unittest discover -s AutoDraw_Stage20/tests -p 'test_engine001_bpred_s4r1_aweak1_original_region_hint_diagnostic.py' -v
          python -m unittest discover -s AutoDraw_Stage20/tests -p 'test_engine001_bpred_s4r1_semref1_aqa1_uploaded_a_intake.py' -v
      - name: Score approximate A-only markers against unchanged original source masks
        run: |
          python AutoDraw_Stage20/tests/run_engine001_bpred_s4r1_aweak1_original_region_hint_diagnostic.py --root . --out aweak1_four_dev_approx.json
          python - <<'PY'
          import json
          d=json.load(open("aweak1_four_dev_approx.json",encoding="utf8"))
          assert d["tested_frozen_A_only_sources"]==4 and len(d["per_original"])==4
          assert d["AQA1_technical_intake"]=="PASS_AT_SAME_INPUT_SOURCE"
          assert d["human_marks_pixel_exact_ground_truth"] is False
          assert d["human_rgb_equality_assumption"] is False
          assert d["scored_as_auto_quality_pass"] is False
          assert d["strict_two_reviewer_SEMREF1"].startswith("BLOCKED")
          assert d["strict_S4"]=="BLOCKED" and d["stroke_admission"]=="FORBIDDEN_UNTIL_NATIVE_INDEPENDENT_VALIDATION"
          assert d["source_owner_ground_truth"]=="MISSING"
          assert d["exact_game_CHALK"] is None and d["heldout_outputs"]==0
          for rec in d["per_original"]:
             m=rec["metrics"]
             assert m["status"]=="DESCRIPTIVE_A_ONLY_NO_INDEPENDENT_SEMANTIC_GROUND_TRUTH"
             assert m["strict_s4"]=="BLOCKED"
             for r in ("0","2","5"):
                 assert m["K_sensitivity_source_only"][r]["source_radius_px"]==int(r)
                 assert m["K_sensitivity_source_only"][r]["K_near_protected"] <= m["source_label_counts"]["K_critical_or_boundary"]
             assert m["source_label_counts"]["K_critical_or_boundary"]>0
             assert m["source_label_counts"]["human_visual_interior"]>0
          print("AWEAK1_FOUR_REAL_USER_A_VISUAL_REGIONS_SCORED_SOURCE_ONLY; NO_NATIVE_OR_STRICT_S4_PASS")
          PY
      - name: Audit documentation integrity
        run: python AutoDraw_Stage20/tools/check_markdown_docs.py --root AutoDraw_Stage20
      - name: Archive complete source-only approximate diagnostic and negative cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-bpred-s4r1-aweak1-human-a-original-region-source-only
          path: aweak1_four_dev_approx.json
          if-no-files-found: ignore
          retention-days: 30
