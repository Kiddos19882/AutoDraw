name: ENGINE-001 BPRED-S4R1 CHROMA-AB1 two frozen color-vs-detail source E2 DEV tests
on:
  push:
    branches: ['feature/image-geometry-optimization']
    paths:
      - '.github/workflows/engine001-bpred-s4r1-chroma-ab1-color-tests.yml'
      - 'AutoDraw_Stage20/tests/engine001_bpred_s4r1_chroma_ab1_color_tests.py'
      - 'AutoDraw_Stage20/tests/test_engine001_bpred_s4r1_chroma_ab1_color_tests.py'
      - 'AutoDraw_Stage20/tests/run_engine001_bpred_s4r1_chroma_ab1_dev.py'
      - 'AutoDraw_Stage20/docs/ENGINE001_BPRED001_S4R1_CHROMA_AB1_TWO_COLOR_TESTS_PREREG_2026-11-22.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine001-bpred-s4r1-chroma-ab1-color-source
  cancel-in-progress: true
jobs:
  chroma-ab1-two-tests-four-source-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout pinned branch commit
        uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Set Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source E2 dependencies
        run: |
          python -m pip install numpy==2.2.6 scipy==1.15.3 scikit-image==0.25.2 opencv-python-headless==4.11.0.86 Pillow==11.3.0 requests==2.32.5
      - name: Pin immutable A/B E0 before code and authentic game128
        run: |
          python - <<'PY'
          import hashlib,subprocess
          from pathlib import Path
          name="AutoDraw_Stage20/docs/ENGINE001_BPRED001_S4R1_CHROMA_AB1_TWO_COLOR_TESTS_PREREG_2026-11-22.md"
          raw=subprocess.check_output(['git','show','HEAD:'+name])
          sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert sha=='dc11901d7502679e98f945637625a83320b5d67b',('BLOCKED_AB_E0_CHANGED',sha)
          game=Path('AutoDraw_Stage20/gameEngine/main.min_653f95bc.js').read_bytes()
          blob=hashlib.sha1(b'blob '+str(len(game)).encode()+b'\0'+game).hexdigest()
          assert blob=='46cc74de00b6cb5d207b1e1a2ffcd81613b6d388',('BLOCKED_AB_GAME_ENGINE_CHANGED',blob)
          print('CHROMA_AB1_E0_AND_ENGINE128_PIN_PASS')
          PY
      - name: A/B source details and original RGB E2 regression
        run: |
          cd AutoDraw_Stage20/tests
          python -m unittest -v test_engine001_bpred_s4r1_chroma_ab1_color_tests
      - name: Two A and B tests each four unprocessed originals x2
        run: |
          python AutoDraw_Stage20/tests/run_engine001_bpred_s4r1_chroma_ab1_dev.py --root AutoDraw_Stage20 --output "$RUNNER_TEMP/chroma_ab1"
      - name: Independently verify A/B source raw and all file SHA
        run: |
          python - <<'PY'
          import os,hashlib,json
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'chroma_ab1'
          summary=json.loads((root/'00_CHROMA_AB1_SUMMARY.json').read_text(encoding='utf-8'))
          assert summary['tests']==['A','B'] and summary['original_source_count_per_test']==4
          assert summary['total_original_source_executions']==16 and summary['original_only'] and not summary['legacy_art_used']
          assert summary['e0_blob_sha1']=='dc11901d7502679e98f945637625a83320b5d67b'
          assert summary['native_egret']=='NOT_RUN' and summary['formal_s4']=='BLOCKED'
          paths=sorted(root.glob('*/manifest.json'))
          assert len(paths)==8
          assert len(list(root.glob('00_AB_COMPARE_*.png')))==4
          for path in paths:
              m=json.loads(path.read_text(encoding='utf-8'))
              assert m['original_only'] and not m['legacy_artistic_input'] and m['repeat_raw_identical']
              assert m['e0_git_blob_sha1']==summary['e0_blob_sha1']
              assert m['test_variant'] in ('A','B')
              assert len(m['outputs_sha256'])>=11
              assert '09_ALL_ORIGINAL_SOURCE_ARRAYS.npz' in m['outputs_sha256']
              for item,digest in m['outputs_sha256'].items():
                  assert hashlib.sha256((path.parent/item).read_bytes()).hexdigest()==digest,(path,item)
          print('CHROMA_AB1_TWO_COLOR_TESTS_ALL_ORIGINAL_RAW_SHA_PASS',len(paths))
          PY
      - name: Upload A and B original-source evidence regardless of quality PASS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-chroma-ab1-two-color-vs-detail-source-originals
          path: ${{ runner.temp }}/chroma_ab1
          retention-days: 30
          if-no-files-found: warn
