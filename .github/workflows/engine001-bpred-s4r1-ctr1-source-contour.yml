name: ENGINE-001 BPRED-S4.4 CTR1 original-source contour four full DEV
on:
  push:
    branches: ['feature/image-geometry-optimization']
    paths:
      - '.github/workflows/engine001-bpred-s4r1-ctr1-source-contour.yml'
      - 'AutoDraw_Stage20/tests/engine001_bpred_s4r1_ctr1_source_contour.py'
      - 'AutoDraw_Stage20/tests/test_engine001_bpred_s4r1_ctr1_source_contour.py'
      - 'AutoDraw_Stage20/tests/run_engine001_bpred_s4r1_ctr1_dev.py'
      - 'AutoDraw_Stage20/docs/ENGINE001_BPRED001_S4R1_CTR1_SOURCE_CONTOUR_PREREG_2026-11-22.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine001-bpred-s44-ctr1-source-contour
  cancel-in-progress: true
jobs:
  ctr1-source-four-original-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout pinned current original source
        uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 1
          persist-credentials: false
          lfs: false
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-only E2 dependencies
        run: |
          python -m pip install numpy==2.2.6 scipy==1.15.3 scikit-image==0.25.2 opencv-python-headless==4.11.0.86 Pillow==11.3.0 requests==2.32.5
      - name: Pin immutable E0 before code and genuine game128 engine palette
        run: |
          python - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          path='AutoDraw_Stage20/docs/ENGINE001_BPRED001_S4R1_CTR1_SOURCE_CONTOUR_PREREG_2026-11-22.md'
          data=subprocess.check_output(['git','show','HEAD:'+path])
          digest=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert digest=='5d0da0694ce0333e9d477fb2fb964329a06763eb',('BLOCKED_CTR1_E0_CHANGED',digest)
          engine=Path('AutoDraw_Stage20/gameEngine/main.min_653f95bc.js').read_bytes()
          digest2=hashlib.sha1(b'blob '+str(len(engine)).encode()+b'\0'+engine).hexdigest()
          assert digest2=='46cc74de00b6cb5d207b1e1a2ffcd81613b6d388',('BLOCKED_CTR1_GAME128_CHANGED',digest2)
          print('CTR1_E0_AND_GENUINE_ENGINE128_SHA_PASS')
          PY
      - name: CTR1 original true source 4neighbor crack and dot/line alpha E2
        run: |
          cd AutoDraw_Stage20/tests
          python -m unittest -v test_engine001_bpred_s4r1_ctr1_source_contour
      - name: Four full original fresh source CTR1 and identical double run
        run: |
          python AutoDraw_Stage20/tests/run_engine001_bpred_s4r1_ctr1_dev.py --root AutoDraw_Stage20 --output "$RUNNER_TEMP/ctr1_dev"
      - name: Independent current-original integrity and source raw SHA files
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          output=Path(os.environ['RUNNER_TEMP'])/'ctr1_dev'
          summary=json.loads((output/'00_CTR1_SUMMARY.json').read_text(encoding='utf-8'))
          assert summary['full_original_count']==4
          assert summary['repeat_clean_builds_per_original']==2
          assert summary['source_original_only'] and not summary['old_artistic_inputs']
          assert summary['e0_git_blob_sha1']=='5d0da0694ce0333e9d477fb2fb964329a06763eb'
          assert summary['formal_BPREDS4']=='BLOCKED' and summary['native']=='NOT_RUN'
          manifests=sorted(output.glob('*/manifest.json'))
          assert len(manifests)==4
          for f in manifests:
              m=json.loads(f.read_text(encoding='utf-8'))
              assert m['source_original_only'] and not m['old_candidate_artistic_input']
              assert m['current_original_regenerated_DG1'] and m['two_builds_raw_bitwise_equal']
              assert m['source_owner_status']=='MISSING'
              assert m['stroke_admission']=='FORBIDDEN_UNKNOWN_SOURCE_AND_NATIVE'
              assert m['provisional_source_quality']=='DG1_COLOR_ART125_FAIL_NOT_PROMOTED'
              assert m['e0_git_blob_sha1']==summary['e0_git_blob_sha1']
              assert '07_CTR1_ORIGINAL_RAW_SOURCE_SEGMENTS.npz' in m['outputs_sha256']
              assert len(m['outputs_sha256'])>=9
              assert m['source_metric']['source_segments']['contour_unit_segment_count']>=0
              for name, digest in m['outputs_sha256'].items():
                  path=f.parent/name
                  assert hashlib.sha256(path.read_bytes()).hexdigest()==digest,(f,name)
          print('CTR1_FOUR_FULL_ORIGINALS_SOURCE_RAW_AND_SHA_PASS',len(manifests))
          PY
      - name: Upload raw original source contours and visual evidence always
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-bpred-s44-ctr1-four-original-contours
          path: ${{ runner.temp }}/ctr1_dev
          retention-days: 30
          if-no-files-found: warn
