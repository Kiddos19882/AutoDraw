name: ENGINE-001 BPRED-S4R1 RAG1 fresh source region+game128 color E2 DEV
on:
  push:
    branches: ['feature/image-geometry-optimization']
    paths:
      - '.github/workflows/engine001-bpred-s4r1-rag1-region-color.yml'
      - 'AutoDraw_Stage20/tests/engine001_bpred_s4r1_rag1_region_color.py'
      - 'AutoDraw_Stage20/tests/test_engine001_bpred_s4r1_rag1_region_color.py'
      - 'AutoDraw_Stage20/tests/run_engine001_bpred_s4r1_rag1_dev.py'
      - 'AutoDraw_Stage20/tests/engine001_bpred_s4r1_generic_source_maps.py'
      - 'AutoDraw_Stage20/docs/ENGINE001_BPRED001_S4R1_REGION_COLOR_RAG1_PREREG_2026-11-22.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine001-bpred-s4r1-rag1-research
  cancel-in-progress: true
jobs:
  rag1-fresh-source-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing pinned numerical dependencies
        run: |
          python -m pip install numpy==2.2.6 opencv-python-headless==4.11.0.86 Pillow==11.3.0 scikit-image==0.25.2 scipy==1.15.3 requests==2.32.5
      - name: Verify frozen RAG1 E0 and original game source SHA
        run: |
          python - <<'PY'
          import hashlib,subprocess
          from pathlib import Path
          rel='AutoDraw_Stage20/docs/ENGINE001_BPRED001_S4R1_REGION_COLOR_RAG1_PREREG_2026-11-22.md'
          b=subprocess.check_output(['git','show','HEAD:'+rel])
          sha=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert sha=='97692d0c20bdfabfc81016cbbc34cd7d84af4cbe',('BLOCKED_RAG1_E0_DRIFT',sha)
          game=Path('AutoDraw_Stage20/gameEngine/main.min_653f95bc.js').read_bytes()
          sha=hashlib.sha1(b'blob '+str(len(game)).encode()+b'\0'+game).hexdigest()
          assert sha=='46cc74de00b6cb5d207b1e1a2ffcd81613b6d388',('BLOCKED_RAG1_ENGINE_DRIFT',sha)
          print('RAG1_FROZEN_E0_ENGINE_PASS')
          PY
      - name: E2 new source-only RAG1 regression tests
        run: |
          cd AutoDraw_Stage20/tests
          python -m unittest -v test_engine001_bpred_s4r1_rag1_region_color
      - name: E2 source original-only DEV four images and raw visual archive
        run: |
          python AutoDraw_Stage20/tests/run_engine001_bpred_s4r1_rag1_dev.py --root AutoDraw_Stage20 --output "$RUNNER_TEMP/rag1_dev"
      - name: Validate DEV artifact files and source provenance
        run: |
          python - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'rag1_dev'
          report=json.loads((root/'00_RAG1_RESEARCH_SUMMARY.json').read_text())
          assert report['source_count']==4
          assert report['all_fresh'] is True
          assert report['native_egret']=='NOT_RUN_SOURCE_ONLY'
          manifests=list(root.glob('*/manifest.json'))
          assert len(manifests)==4
          for p in manifests:
              m=json.loads(p.read_text())
              assert m['old_artistic_input'] is False
              assert m['e0_git_blob_sha1']=='97692d0c20bdfabfc81016cbbc34cd7d84af4cbe'
              for filename,expected in m['output_files_sha256'].items():
                  data=(p.parent/filename).read_bytes()
                  assert hashlib.sha256(data).hexdigest()==expected,filename
          print('RAG1_DEV_ARCHIVE_HASHES_PASS',len(manifests))
          PY
      - name: Upload visual research results (even if experiment scientific FAIL)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-bpred-s4r1-rag1-four-originals-region-color-review
          path: ${{ runner.temp }}/rag1_dev
          if-no-files-found: warn
          retention-days: 30
