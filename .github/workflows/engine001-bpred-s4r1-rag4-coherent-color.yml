name: ENGINE-001 BPRED-S4R1 RAG4 source-coherent interior color E2 DEV
on:
  push:
    branches: ['feature/image-geometry-optimization']
    paths:
      - '.github/workflows/engine001-bpred-s4r1-rag4-coherent-color.yml'
      - 'AutoDraw_Stage20/tests/engine001_bpred_s4r1_rag4_coherent_detail.py'
      - 'AutoDraw_Stage20/tests/test_engine001_bpred_s4r1_rag4_coherent_detail.py'
      - 'AutoDraw_Stage20/tests/run_engine001_bpred_s4r1_rag4_dev.py'
      - 'AutoDraw_Stage20/docs/ENGINE001_BPRED001_S4R1_REGION_COLOR_RAG4_COHERENT_DETAIL_PREREG_2026-11-22.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine001-bpred-s4r1-rag4-coherent-color
  cancel-in-progress: true
jobs:
  rag4-source-color-four-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned source E2 dependencies
        run: |
          python -m pip install numpy==2.2.6 scipy==1.15.3 scikit-image==0.25.2 opencv-python-headless==4.11.0.86 Pillow==11.3.0 requests==2.32.5
      - name: Pin frozen prospective RAG4 E0 and real game128 engine
        run: |
          python - <<'PY'
          import hashlib,subprocess
          from pathlib import Path
          rel='AutoDraw_Stage20/docs/ENGINE001_BPRED001_S4R1_REGION_COLOR_RAG4_COHERENT_DETAIL_PREREG_2026-11-22.md'
          raw=subprocess.check_output(['git','show','HEAD:'+rel])
          blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert blob=='34add17b33edd54cdefeb551d781cc987433ba23',('BLOCKED_RAG4_FROZEN_E0_CHANGED',blob)
          game=Path('AutoDraw_Stage20/gameEngine/main.min_653f95bc.js').read_bytes()
          gameblob=hashlib.sha1(b'blob '+str(len(game)).encode()+b'\0'+game).hexdigest()
          assert gameblob=='46cc74de00b6cb5d207b1e1a2ffcd81613b6d388',('BLOCKED_RAG4_GAME_ENGINE_CHANGED',gameblob)
          print('RAG4_E0_AND_GAME128_BLOBS_PASS')
          PY
      - name: RAG4 E2 source color hierarchy details and alpha invariants
        run: |
          cd AutoDraw_Stage20/tests
          python -m unittest -v test_engine001_bpred_s4r1_rag4_coherent_detail
      - name: RAG4 four original-only DEV source maps and two independent replays
        run: |
          python AutoDraw_Stage20/tests/run_engine001_bpred_s4r1_rag4_dev.py --root AutoDraw_Stage20 --output "$RUNNER_TEMP/rag4_dev"
      - name: Independently verify every raw file SHA and frozen manifest claims
        run: |
          python - <<'PY'
          import os,hashlib,json
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'rag4_dev'
          summary=json.loads((out/'00_RAG4_SUMMARY.json').read_text(encoding='utf-8'))
          assert summary['source_count']==4 and summary['no_legacy_art']
          assert summary['native_egret']=='NOT_RUN' and summary['formal_s4']=='BLOCKED'
          manifests=sorted(out.glob('*/manifest.json'))
          assert len(manifests)==4
          for path in manifests:
              m=json.loads(path.read_text(encoding='utf-8'))
              assert m['original_only'] and not m['legacy_artistic_input']
              assert m['e0_git_blob_sha1']=='34add17b33edd54cdefeb551d781cc987433ba23'
              assert m['two_clean_runs_array_identical']
              assert '07_RAG4_SOURCE_LAYERS.npz' in m['output_files_sha256']
              assert len(m['output_files_sha256'])>=9
              for filename,want in m['output_files_sha256'].items():
                  file=path.parent/filename
                  assert hashlib.sha256(file.read_bytes()).hexdigest()==want,(path,filename)
          print('RAG4_FOUR_ORIGINALS_RAW_SHA_AND_REPLAY_PASS',len(manifests))
          PY
      - name: Upload signed source-only visuals even if E2 or scientific gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-bpred-s4r1-rag4-coherent-color-four-dev
          path: ${{ runner.temp }}/rag4_dev
          if-no-files-found: warn
          retention-days: 30
