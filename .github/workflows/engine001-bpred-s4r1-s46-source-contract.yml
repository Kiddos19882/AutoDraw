name: ENGINE-001 BPRED-S4.6 quarantined original-only source contract E2
on:
  push:
    branches: ['feature/image-geometry-optimization']
    paths:
      - '.github/workflows/engine001-bpred-s4r1-s46-source-contract.yml'
      - 'AutoDraw_Stage20/tests/engine001_bpred_s4r1_s46_source_contract.py'
      - 'AutoDraw_Stage20/tests/test_engine001_bpred_s4r1_s46_source_contract.py'
      - 'AutoDraw_Stage20/tests/run_engine001_bpred_s4r1_s46_dev.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine001-bpred-s46-source-contract
  cancel-in-progress: true
jobs:
  original-source-only-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout current original source
        uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 1
          persist-credentials: false
          lfs: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing CTR1 source-only dependencies
        run: |
          python -m pip install numpy==2.2.6 scipy==1.15.3 scikit-image==0.25.2 opencv-python-headless==4.11.0.86 Pillow==11.3.0 requests==2.32.5
      - name: Immutable S4.6 E0 and genuine game128
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          def blob_sha(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          e0=Path('AutoDraw_Stage20/docs/ENGINE001_BPRED001_S4R1_S46_SOURCE_CONTRACT_PREREG_2026-11-23.md').read_bytes()
          engine=Path('AutoDraw_Stage20/gameEngine/main.min_653f95bc.js').read_bytes()
          assert blob_sha(e0)=='0da1fd6689f4396862da688dc214b897ab6e46f7', 'BLOCKED_S46_E0_MUTATED'
          assert blob_sha(engine)=='46cc74de00b6cb5d207b1e1a2ffcd81613b6d388', 'BLOCKED_S46_ENGINE_CHANGED'
          print('S46_E0_AND_ENGINE_BLOB_PASS')
          PY
      - name: Synthetic strict source contract and fail-closed E2
        run: |
          cd AutoDraw_Stage20/tests
          python -m unittest -v test_engine001_bpred_s4r1_s46_source_contract
      - name: Fresh original x2 four DEV source contracts
        run: |
          python AutoDraw_Stage20/tests/run_engine001_bpred_s4r1_s46_dev.py --root AutoDraw_Stage20 --output "$RUNNER_TEMP/s46_dev"
      - name: Verify exported original source files, SHA and blocked native status
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, os, sys
          root=Path(os.environ['RUNNER_TEMP'])/'s46_dev'
          summary=json.loads((root/'00_S46_RESULTS.json').read_text())
          assert summary['count']==4 and summary['double_fresh']
          assert not summary['admissible_for_gameplay']
          assert summary['formal_BPREDS4']=='BLOCKED' and summary['native']=='NOT_RUN'
          assert len(summary['sources'])==4
          for i,item in enumerate(summary['sources']):
              m=(root/f'{i:02d}'/'source_contract.json').read_bytes()
              raw=(root/f'{i:02d}'/'source_arrays.npz').read_bytes()
              assert hashlib.sha256(m).hexdigest()==item['manifest_sha256']
              assert hashlib.sha256(raw).hexdigest()==item['raw_npz_sha256']
              meta=json.loads(m)
              assert meta['input_sha256']==item['input_sha256']
              assert meta['admissible_for_gameplay'] is False
              assert meta['source_owner_status']=='MISSING'
              assert meta['native_calibration']=='UNVERIFIED'
              assert meta['next_stage_S5']=='BLOCKED'
          print('S46_FOUR_ORIGINAL_SOURCE_ONLY_EXPORT_PASS')
          PY
      - name: Upload quarantined source research evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-bpred-s46-quarantined-source-contract
          path: ${{ runner.temp }}/s46_dev
          retention-days: 30
          if-no-files-found: warn
