name: ENGINE-001 S5-R5 content region lanes synthetic E2
on:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - '.github/workflows/engine001-bpred-s5r5-content-synthetic.yml'
      - 'AutoDraw_Stage20/tests/engine001_bpred_s5r4_offset_lanes.py'
      - 'AutoDraw_Stage20/tests/test_engine001_bpred_s5r5_content_lanes.py'
      - 'AutoDraw_Stage20/docs/ENGINE001_BPRED_S5R5_CONTENT_STRATIFIED_REGION_LANES_PREREG_2026-11-23.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine001-bpred-s5r5-content-synthetic
  cancel-in-progress: true
jobs:
  s5r5-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned geometry dependencies
        run: |
          python -m pip install numpy==2.2.6 scipy==1.15.3 Pillow==11.3.0
      - name: Verify frozen E0 and syntax
        run: |
          test -s AutoDraw_Stage20/docs/ENGINE001_BPRED_S5R5_CONTENT_STRATIFIED_REGION_LANES_PREREG_2026-11-23.md
          python -m py_compile AutoDraw_Stage20/tests/engine001_bpred_s5r4_offset_lanes.py AutoDraw_Stage20/tests/test_engine001_bpred_s5r5_content_lanes.py
      - name: Run S5-R4 unchanged baseline tests and S5-R5 synthetic E2
        run: |
          cd AutoDraw_Stage20/tests
          python -m unittest -v test_engine001_bpred_s5r4_offset_lanes test_engine001_bpred_s5r5_content_lanes
      - name: Check document integrity
        run: |
          python AutoDraw_Stage20/tools/check_markdown_docs.py --root AutoDraw_Stage20
