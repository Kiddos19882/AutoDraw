name: ENGINE-001 R2 P2 P2 B2 source-safe 32-swatch component cleanup
on:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - '.github/workflows/engine001-color-island-b2-safe-cleanup.yml'
      - 'AutoDraw_Stage20/tests/run_engine001_color_island_r2_p2_p2_b2_safe_cleanup.py'
      - 'AutoDraw_Stage20/tests/test_engine001_color_island_r2_p2_p2_b2_safe_cleanup.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: engine001-color-island-b2-safe-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-safe-component-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout bounded
        uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 1
          submodules: false
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned source-only tools
        run: |
          python -m pip install numpy==2.2.6 opencv-python-headless==4.11.0.86 Pillow==11.3.0 scikit-image==0.25.2 scipy==1.15.3 requests==2.32.5
      - name: Source-only B2 synthetic contracts and markdown
        run: |
          python -m py_compile AutoDraw_Stage20/tests/run_engine001_color_island_r2_p2_p2_b2_safe_cleanup.py AutoDraw_Stage20/tests/test_engine001_color_island_r2_p2_p2_b2_safe_cleanup.py
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_color_island_r2_p2_p2_b2_safe_cleanup.py -v
          python AutoDraw_Stage20/tools/check_markdown_docs.py --root AutoDraw_Stage20
      - name: Fetch frozen B1 negative, M1 protect and V44 native RGB contour archives
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_TEMP: ${{ runner.temp }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,os,requests
          from pathlib import Path
          dest=Path(os.environ["RUNNER_TEMP"])
          for artifact_id,name,digest in [
            (14394179902,"b1-original.zip","5998d4c9cc4e9f20eda637ebd0192ba5f38e824d22946fea6f3363dbfcbed916"),
            (14388687061,"m1-original.zip","8bedc496bf01cf7205ecc8ceb7be8eb0f68b751b11c53ea67dbdd3982c7fe583"),
            (14201581692,"v44-original.zip","43cb8e14a7e387b26772612ac06d1c7c6f176b8bd0c2d41e8945042fc80304a1")]:
              url=f"https://api.github.com/repos/Kiddos19882/AutoDraw/actions/artifacts/{artifact_id}/zip"
              res=requests.get(url,headers={
                  "Authorization":"Bearer "+os.environ["GH_TOKEN"],
                  "Accept":"application/vnd.github+json",
                  "User-Agent":"AutoDraw-B2-SourceSafe"},
                  timeout=180,allow_redirects=True)
              res.raise_for_status()
              got=hashlib.sha256(res.content).hexdigest()
              if got!=digest:raise ValueError(f"BLOCKED_ARCHIVE_SHA {artifact_id} {got}")
              (dest/name).write_bytes(res.content)
              print("PINNED_ARCHIVE_SHA_PASS",artifact_id,digest)
          PY
      - name: One-pass source-safe component candidates and archived original V44
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        shell: bash
        run: |
          python AutoDraw_Stage20/tests/run_engine001_color_island_r2_p2_p2_b2_safe_cleanup.py \
            --source AutoDraw_Stage20/testImages/wV6VeZI9S1Y.png \
            --palette AutoDraw_Stage20/data/palettes/browser_palette.json \
            --b1-archive "$RUNNER_TEMP/b1-original.zip" \
            --m1-archive "$RUNNER_TEMP/m1-original.zip" \
            --v44-archive "$RUNNER_TEMP/v44-original.zip" \
            --output "$RUNNER_TEMP/engine001-b2-safe-cleanup"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          d=Path(os.environ["RUNNER_TEMP"])/"engine001-b2-safe-cleanup"
          r=json.loads((d/"report.json").read_text(encoding="utf8"))
          assert r["github_sha"]==os.environ["GITHUB_SHA"] and r["github_run_id"]==os.environ["GITHUB_RUN_ID"]
          assert r["original_V44_detail_strokes"]==410 and r["original_V44_detail_vertices_NOT_CHALK"]==1792
          assert r["source_protected_pixels"]==7947
          assert r["game_round_brush"]=="NOT_RUN" and r["game_exact_CHALK"] is None
          assert set(r["ledgers"])=={"B2_SAFE4","B2_SAFE12"}
          for name,digest in r["file_sha256"].items():
              assert hashlib.sha256((d/name).read_bytes()).hexdigest()==digest,name
          print("B2_TECHNICAL_E3_REPORT_LINKED_SHA_PASS",len(r["file_sha256"]))
          for k,v in r["metrics"].items():
              print(k,v.get("status","FROZEN_CONTROL"),"meanDE",round(v["mean_deltaE00"],4),
                "components",v["nonwhite_components4"],"singletons",v["nonwhite_singletons"],
                "excess_chroma",v["excess_chroma_pixels"])
          for k,v in r["ledgers"].items():
              print(k,"ACCEPTED",v["accepted_region_count"],"CHANGED_PIXELS",v["changed_pixels"])
          print("SOURCE_DIAGNOSTIC_ONLY_NOT_NATIVE_GAME_NOT_EXACT_CHALK")
          PY
      - name: Preserve B2 negative and positive maps, all report-linked PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-b2-p0-source-safe-real-game32
          path: ${{ runner.temp }}/engine001-b2-safe-cleanup/
          retention-days: 30
          if-no-files-found: warn
