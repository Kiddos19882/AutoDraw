name: ENGINE-001 R2-P1 genuine pretrained DINOv2 merge assistant replay N1

on:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - ".github/workflows/engine001-color-island-r2-p1-n1.yml"
      - "AutoDraw_Stage20/tests/run_engine001_color_island_r2_p1_n1.py"
      - "AutoDraw_Stage20/tests/test_engine001_color_island_r2_p1_n1.py"
      - "AutoDraw_Stage20/tests/run_engine001_color_island_r2_p1_m0.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: autodraw-engine001-r2-p1-n1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-dinov2-frozen-feature-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source (bounded, no LFS/submodules)
        uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only source CPU numerical dependencies (no new model inference)
        run: |
          python -m pip install "numpy>=2,<3" "opencv-python-headless>=4.10,<5" "Pillow>=11,<13" "scipy>=1.13,<2" "scikit-image>=0.25,<0.27" "selenium>=4,<5" "requests>=2.31,<3"
      - name: M0 and N1 source-only deterministic unit contracts
        shell: bash
        run: |
          python -m py_compile AutoDraw_Stage20/tests/run_engine001_color_island_r2_p1_m0.py AutoDraw_Stage20/tests/run_engine001_color_island_r2_p1_n1.py AutoDraw_Stage20/tests/test_engine001_color_island_r2_p1_m0.py AutoDraw_Stage20/tests/test_engine001_color_island_r2_p1_n1.py
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_color_island_r2_p1_m0.py -v
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_color_island_r2_p1_n1.py -v
          python AutoDraw_Stage20/tools/check_markdown_docs.py --root AutoDraw_Stage20
      - name: Obtain pinned original M0 and genuine DINOv2 S4 artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import hashlib,os,requests
          from pathlib import Path
          items = {
            14385505684: ("r2-p1-m0-ci44208734155.zip", "574320c11cd189adab08c1fd85de2119204589194e44c5df9d8279dcf6f2f782"),
            14352502866: ("s4-original-real-dinov2.zip", "408f26b7d349bb5ee503bdf8f825c9f1dde9d639abd4bf4c96ee575beb3c860e"),
          }
          for aid,(name,pinned) in items.items():
              response=requests.get(f'https://api.github.com/repos/Kiddos19882/AutoDraw/actions/artifacts/{aid}/zip',
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                           'Accept':'application/vnd.github+json','User-Agent':'AutoDraw-R2-P1-N1'}, timeout=180)
              response.raise_for_status()
              data=response.content
              if hashlib.sha256(data).hexdigest()!=pinned:
                  raise ValueError('BLOCKED_R2_P1_FROZEN_ARTIFACT_SHA')
              (Path(os.environ['RUNNER_TEMP'])/name).write_bytes(data)
              print('R2-P1 exact frozen archive verified',aid,name,pinned)
          PY
      - name: Replay real DINOv2 dense features only as eligible merge ranking
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python AutoDraw_Stage20/tests/run_engine001_color_island_r2_p1_n1.py \
            --source AutoDraw_Stage20/testImages/wV6VeZI9S1Y.png \
            --palette AutoDraw_Stage20/data/palettes/browser_palette.json \
            --m0-archive "$RUNNER_TEMP/r2-p1-m0-ci44208734155.zip" \
            --s4-archive "$RUNNER_TEMP/s4-original-real-dinov2.zip" \
            --output "$RUNNER_TEMP/engine001-color-island-r2-p1-n1"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'engine001-color-island-r2-p1-n1'
          r=json.loads((root/'report.json').read_text(encoding='utf-8'))
          assert r['experiment']=='ENGINE001_COLOR_ISLAND_R2_P1_NEURAL_MERGE_REPLAY_N1'
          assert r['github_sha']==os.environ['GITHUB_SHA']
          assert r['github_run_id']==os.environ['GITHUB_RUN_ID']
          assert r['source_sha256']=='07cc4568cb5e90d9514bc6f6c2112fee623f87f8fd0cea02fa517b04108e502a'
          assert r['palette_blob_sha']=='461b5f3725b9b79888ad36e807b3cf4c9e445e98'
          assert r['M0_original_CI_sha']=='bf2ffce720c3ec21408971153c7f979807b11cdb'
          assert r['M0_archive_sha256']=='574320c11cd189adab08c1fd85de2119204589194e44c5df9d8279dcf6f2f782'
          assert r['S4_archive_sha256']=='408f26b7d349bb5ee503bdf8f825c9f1dde9d639abd4bf4c96ee575beb3c860e'
          assert r['checkpoint']['real_pretrained_checkpoint_sha256']=='ae1e99fcefd534ed978cdeb8326f08030c96e28b7a81ffcbc98a857c84d14be1'
          assert r['DINO_dense_repooled_for_R2'] is True
          assert r['source_gates']['identical_source_partition_and_m0_labels']
          assert r['source_gates']['protected_original_region_ids_unchanged']
          assert r['true_pretrained_inference']=='REPLAY_OF_HISTORICAL_S4_NOT_NEW_INFERENCE'
          assert r['status'] in ('SOURCE_GATE_FAIL','SOURCE_RGB_VISUAL_PENDING','NEURAL_NO_EFFECT')
          assert r['N2_BIREFNET']==r['game32_candidate']==r['native_Egret']=='NOT_RUN'
          assert r['original_V44B_410_LAST']=='UNCHANGED_NOT_OVERLAID'
          assert r['game_E4']==r['independent_E5']=='NOT_RUN'
          assert r['exact_CHALK'] is None and r['production_accepted'] is False
          for name,digest in r['files_sha256'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest,name
          print('R2-P1 N1 genuine archive replay status:',r['status'])
          print('R2-P1 N1 changed merge choices:',r['M0_N1_changed_merge_choices'])
          print('R2-P1 M0 archived RGB vs same-env replay drift:',r['M0_frozen_to_same_environment_render_drift_pixels'])
          print('R2-P1 N1 source quality:',r['N1_RGB_source_quality'])
          print('R2-P1 N1 gates:',r['source_gates'])
          print('R2-P1 N1 report SHA256:',hashlib.sha256((root/'report.json').read_bytes()).hexdigest())
          PY
      - name: Save explicit technical failure metadata
        if: failure()
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'engine001-color-island-r2-p1-n1'
          out.mkdir(exist_ok=True,parents=True)
          if not (out/'report.json').exists():
              (out/'ci-failure.json').write_text(json.dumps({
                'status':'BLOCKED_R2_P1_N1_TECHNICAL_OR_PROVENANCE',
                'github_sha':os.getenv('GITHUB_SHA'),
                'github_run_id':os.getenv('GITHUB_RUN_ID'),
                'new_pretrained_inference':'NOT_RUN',
                'production_accepted':False
              },indent=2)+'\n')
          PY
      - name: Upload complete positive or negative source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-color-island-r2-p1-n1-genuine-dinov2-replay
          path: ${{ runner.temp }}/engine001-color-island-r2-p1-n1/
          if-no-files-found: warn
          retention-days: 30