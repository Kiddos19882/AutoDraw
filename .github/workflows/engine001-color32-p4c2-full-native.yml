name: ENGINE-001 P4c2 frozen P4c1 all 17 owners actual Egret paint only

on:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - ".github/workflows/engine001-color32-p4c2-full-native.yml"
      - "AutoDraw_Stage20/tests/run_engine001_color32_p4c2_full_native.py"
      - "AutoDraw_Stage20/tests/test_engine001_color32_p4c2_full_native.py"
      - "AutoDraw_Stage20/tests/run_engine001_color32_p4c1_directional_micro.py"
      - "AutoDraw_Stage20/docs/ENGINE001_COLOR32_P4C2_FULL_NATIVE_17_OWNER_PROTOCOL_2026-11-17.md"
      - ".gitattributes"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: engine001-p4c2-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full17-frozen-native-paint:
    runs-on: windows-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing native Egret and G32 dependencies
        run: python -m pip install "selenium>=4,<5" "numpy>=2,<3" "opencv-python-headless>=4.10,<5" "Pillow>=11,<13" "scipy>=1.13,<2" "scikit-image>=0.25,<0.27" "requests>=2,<3"
      - name: Immutable P4c1 source and P4c2 native metric regressions
        shell: bash
        run: |
          python -m py_compile AutoDraw_Stage20/tests/run_engine001_color32_p4c2_full_native.py AutoDraw_Stage20/tests/test_engine001_color32_p4c2_full_native.py
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_color32_p4c2_full_native.py -v
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_color32_p4c1_directional_micro.py -v
          python AutoDraw_Stage20/tools/check_markdown_docs.py --root AutoDraw_Stage20
          node --check AutoDraw_Stage20/tests/game_renderer_reference.js
          node --test AutoDraw_Stage20/tests/game_renderer_reference.test.js
      - name: Download and verify exact P4c1 original E2 ZIP (cross-platform frozen source)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import hashlib,os
          from pathlib import Path
          import requests
          url="https://api.github.com/repos/Kiddos19882/AutoDraw/actions/artifacts/14334728680/zip"
          response=requests.get(
              url,
              headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                       "Accept":"application/vnd.github+json",
                       "User-Agent":"AutoDraw-ENGINE001-P4c2"},
              timeout=180,allow_redirects=True)
          response.raise_for_status()
          blob=response.content
          digest=hashlib.sha256(blob).hexdigest()
          expected="fac1fcf1ff6a43ac6e59da116b68b86e2238c2da13be0b167cf34f8241ac5eeb"
          if digest != expected:
              raise ValueError("BLOCKED_P4C2_ORIGINAL_ARCHIVE_DRIFT")
          path=Path(os.environ["RUNNER_TEMP"])/"engine001-p4c1-original.zip"
          path.write_bytes(blob)
          print("Verified original P4c1 ZIP",len(blob),digest)
          PY
      - name: Strict archived P4c1 original G32 and paths provenance preflight
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import hashlib,os,sys,tempfile
          from pathlib import Path
          sys.path.insert(0, "AutoDraw_Stage20/tests")
          from run_engine001_color32_p4c2_full_native import (
              load_frozen_archive, FROZEN_PAINT_PATHS,
              FROZEN_PAINT_VERTICES, OWNERS)
          archive=Path(os.environ["RUNNER_TEMP"])/"engine001-p4c1-original.zip"
          g,paths=load_frozen_archive(archive)
          assert g.shape==(240,150) and g.dtype.name=="uint8"
          assert sorted(int(x) for x in set(g.flat) if x != 30)==list(OWNERS)
          assert len(paths)==FROZEN_PAINT_PATHS==1133
          assert sum(len(x["points"]) for x in paths)==FROZEN_PAINT_VERTICES==3485
          with tempfile.TemporaryDirectory() as tmp:
              corrupt=Path(tmp)/"corrupted-original.zip"
              content=bytearray(archive.read_bytes())
              content[0] ^= 1
              corrupt.write_bytes(content)
              try:
                  load_frozen_archive(corrupt)
              except ValueError as exc:
                  assert str(exc)=="BLOCKED_P4C2_FROZEN_ZIP_SHA",str(exc)
              else:
                  raise AssertionError("P4c2 corrupt original archive must fail closed")
          print("P4C2 FROZEN INPUT PASS: 17 owners, 1133 unique strokes, 3485 vertices")
          print("P4C2 FAIL-CLOSED BAD ARCHIVE PASS")
          print("P4C2 ORIGINAL PNG ARRAY SHA:",hashlib.sha256(g.tobytes()).hexdigest())
          PY
      - name: Diagnose Windows G32 recomputation against frozen original (non-gating)
        continue-on-error: true
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          import numpy as np
          sys.path.insert(0, "AutoDraw_Stage20/tests")
          from run_engine001_color32_p4c2_full_native import load_frozen_archive
          from run_engine001_palette32_region_study import read_source,read_palette,nearest32
          from run_engine001_color32_s2_edge_protection import strong_edges,protected_merge
          archive=Path(os.environ["RUNNER_TEMP"])/"engine001-p4c1-original.zip"
          original,_=load_frozen_archive(archive)
          source=Path("AutoDraw_Stage20/testImages/wV6VeZI9S1Y.png")
          palette=read_palette(Path("AutoDraw_Stage20/data/palettes/browser_palette.json"))
          _,rgb=read_source(source)
          b=nearest32(rgb,palette)
          protected,_=strong_edges(rgb)
          reconstructed,_=protected_merge(rgb,b,palette,protected)
          ys,xs=np.nonzero(reconstructed!=original)
          details={
              "diagnostic_only":True,
              "frozen_original_array_SHA256":hashlib.sha256(original.tobytes()).hexdigest(),
              "windows_recomputed_array_SHA256":hashlib.sha256(reconstructed.tobytes()).hexdigest(),
              "mismatched_logical_pixels":int(len(xs)),
              "first_12_mismatches":[{"x":int(x),"y":int(y),
                  "frozen":int(original[y,x]),"windows":int(reconstructed[y,x])}
                  for y,x in zip(ys[:12],xs[:12])],
              "native_uses_original_frozen_G_only":True,
          }
          print("P4C2 CROSS-OS G RECOMPUTATION:",json.dumps(details))
          PY
      - name: Paint every frozen original G32 owner using actual archived BoardPane
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python AutoDraw_Stage20/tests/run_engine001_color32_p4c2_full_native.py \
            --workspace . \
            --source AutoDraw_Stage20/testImages/wV6VeZI9S1Y.png \
            --palette AutoDraw_Stage20/data/palettes/browser_palette.json \
            --frozen-source-archive "$RUNNER_TEMP/engine001-p4c1-original.zip" \
            --output "$RUNNER_TEMP/engine001-p4c2-native"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"engine001-p4c2-native"
          r=json.loads((root/"report.json").read_text(encoding="utf-8"))
          assert r["experiment"]=="ENGINE001_COLOR32_P4C2_FULL_17_OWNER_NATIVE"
          assert r["github_sha"]==os.environ["GITHUB_SHA"]
          assert r["github_run_id"]==os.environ["GITHUB_RUN_ID"]
          assert r["status"] in ("P4C2_NATIVE_PAINT_ONLY_PARTIAL","P4C2_NATIVE_PAINT_FAIL")
          assert r["original_410_V44B_LAST"]=="NOT_RENDERED_UNCHANGED"
          assert r["native_paint_only"] and r["exact_CHALK"] is None
          assert not r["production_accepted"] and r["game_E4"]=="NOT_RUN"
          assert len(r["native_manifest"]["colors_rendered"])==17
          assert len(r["linked_file_SHA256"])>=19
          for name,expected in r["linked_file_SHA256"].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==expected,name
          print("P4C2 NATIVE STATUS:",r["status"])
          print("P4C2 NATIVE ALPHA24 BELOW99:",r["native_observations"]["owners_below99_native_alpha24"])
          print("P4C2 ALL17 NATIVE SAFE:",r["native_observations"]["native_alpha24_128_all17_safety"])
          print("P4C2 REPORT SHA:",hashlib.sha256((root/"report.json").read_bytes()).hexdigest())
          PY
      - name: Preserve all 17 original Egret owner PNGs, composite and negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-p4c2-frozen-g32-native-paint-only
          path: ${{ runner.temp }}/engine001-p4c2-native
          if-no-files-found: warn
          retention-days: 30
