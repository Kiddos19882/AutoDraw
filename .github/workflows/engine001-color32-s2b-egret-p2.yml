name: ENGINE-001 S2b Egret P2 native multiring fill vs P1

on:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - ".github/workflows/engine001-color32-s2b-egret-p2.yml"
      - "AutoDraw_Stage20/tests/run_engine001_color32_s2b_egret_p2.py"
      - "AutoDraw_Stage20/tests/test_engine001_color32_s2b_egret_p2.py"
      - "AutoDraw_Stage20/tests/run_engine001_color32_s2b_egret_p1.py"
      - "AutoDraw_Stage20/tests/run_engine001_v43p4_b3_contour_source.py"
      - ".gitattributes"
      - "AutoDraw_Stage20/docs/README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine001-s2b-egret-p2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p2-real-egret:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original BoardPane harness prerequisites
        run: python -m pip install "selenium>=4,<5" "numpy>=2,<3" "opencv-python-headless>=4.10,<5" "Pillow>=11,<13" "scipy>=1.13,<2" "scikit-image>=0.25,<0.27"
      - name: Verify original palette and renderer source, P2 and original JS regressions
        shell: bash
        run: |
          python -m py_compile AutoDraw_Stage20/tests/run_engine001_color32_s2b_egret_p2.py AutoDraw_Stage20/tests/test_engine001_color32_s2b_egret_p2.py
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_color32_s2b_egret_p2.py -v
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_color32_s2b_egret_p1.py -v
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_color32_s2b_rgb_edge.py -v
          python AutoDraw_Stage20/tools/check_markdown_docs.py --root AutoDraw_Stage20
          node --check AutoDraw_Stage20/tests/game_renderer_reference.js
          node --test AutoDraw_Stage20/tests/game_renderer_reference.test.js
      - name: Render P1 width10 and P2 adaptive multiring in ORIGINAL Egret WebGL
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python AutoDraw_Stage20/tests/run_engine001_color32_s2b_egret_p2.py \
            --workspace . \
            --source AutoDraw_Stage20/testImages/wV6VeZI9S1Y.png \
            --palette AutoDraw_Stage20/data/palettes/browser_palette.json \
            --output "$RUNNER_TEMP/engine001-s2b-egret-p2"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"engine001-s2b-egret-p2"
          data=json.loads((root/"report.json").read_text(encoding="utf-8"))
          assert data["experiment"]=="ENGINE001_COLOR32_S2B_EGRET_P2_NATIVE_MULTIRING"
          assert data["github_sha"]==os.environ["GITHUB_SHA"]
          assert data["github_run_id"]==os.environ["GITHUB_RUN_ID"]
          assert data["status"] in ("NATIVE_P2_SOURCE_GATE_PASS_NOT_FULL_FILL",
                                    "NATIVE_P2_SOURCE_GATE_FAIL_NOT_FULL_FILL")
          assert data["p2_preflight"]["status"]=="SOURCE_MODEL_READY_FOR_E3"
          assert data["p2_preflight"]["provisioned_total_strokes_with_V44B410"]<=3000
          assert data["p2_preflight"]["provisioned_total_vertices_NOT_CHALK"]<=5900
          assert data["full_image_quality"]=="NOT_RUN"
          assert data["visual_review"]=="PENDING"
          assert data["exact_game_CHALK"] is None and data["production_accepted"] is False
          for file,digest in data["report_linked_SHA256"].items():
              assert hashlib.sha256((root/file).read_bytes()).hexdigest()==digest
          for variant in ("P1-W10","P2-MULTIRING"):
              assert (root/variant).is_dir()
              assert len(list((root/variant).glob("*-color-*.png")))==2
              assert len(list((root/variant).glob("*-composite.png")))==1
          print("P2 NATIVE SOURCE GATE:",data["status"])
          print("P2 actual native comparison:",json.dumps(data["native_comparison"],ensure_ascii=False))
          print("P2 primary report SHA:",hashlib.sha256((root/"report.json").read_bytes()).hexdigest())
          PY
      - name: Preserve native P1/P2 alpha RGBA and negative gates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-s2b-egret-p2-multiring-vs-p1
          path: ${{ runner.temp }}/engine001-s2b-egret-p2
          if-no-files-found: warn
          retention-days: 30
