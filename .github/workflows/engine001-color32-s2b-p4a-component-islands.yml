name: ENGINE-001 COLOR32 P4a frozen G vs component-aware H source-only

on:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - ".github/workflows/engine001-color32-s2b-p4a-component-islands.yml"
      - "AutoDraw_Stage20/tests/run_engine001_color32_s2b_p4a_component_islands.py"
      - "AutoDraw_Stage20/tests/test_engine001_color32_s2b_p4a_component_islands.py"
      - ".gitattributes"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine001-color32-p4a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p4a-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source metric dependencies without altering game
        run: python -m pip install "numpy>=2,<3" "opencv-python-headless>=4.10,<5" "Pillow>=11,<13" "scipy>=1.13,<2" "scikit-image>=0.25,<0.27" "selenium>=4,<5"
      - name: Validate frozen source identity, component policy and docs
        shell: bash
        run: |
          python -m py_compile AutoDraw_Stage20/tests/run_engine001_color32_s2b_p4a_component_islands.py AutoDraw_Stage20/tests/test_engine001_color32_s2b_p4a_component_islands.py
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_color32_s2b_p4a_component_islands.py -v
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_color32_s2b_rgb_edge.py -v
          python AutoDraw_Stage20/tools/check_markdown_docs.py --root AutoDraw_Stage20
      - name: Original G versus H source-only PNG and all-game32 diagnostics
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python AutoDraw_Stage20/tests/run_engine001_color32_s2b_p4a_component_islands.py \
            --source AutoDraw_Stage20/testImages/wV6VeZI9S1Y.png \
            --palette AutoDraw_Stage20/data/palettes/browser_palette.json \
            --output "$RUNNER_TEMP/engine001-color32-p4a"
          python - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"engine001-color32-p4a"
          data=json.loads((root/"report.json").read_text(encoding="utf-8"))
          assert data["experiment"]=="ENGINE001_COLOR32_S2B_P4A_COMPONENT_ISLAND_SOURCE_ONLY"
          assert data["github_sha"]==os.environ["GITHUB_SHA"]
          assert data["github_run_id"]==os.environ["GITHUB_RUN_ID"]
          assert data["original_G_index_png_SHA256"]=="b8dcd5f00d2c39c81997aaae084eaae19a776454e6fd6466209839288c1e5637"
          assert data["status"] in ("SOURCE_GATE_PASS_VISUAL_PENDING","SOURCE_GATE_FAIL")
          assert data["native_Egret"]=="NOT_RUN" and data["exact_CHALK"] is None
          assert not data["production_accepted"]
          for name,expected in data["file_sha256"].items():
              actual=hashlib.sha256((root/name).read_bytes()).hexdigest()
              assert actual==expected,(name,actual,expected)
          assert len(data["file_sha256"])==8
          assert data["P4a_source_checks"]["checks"]["protected_pixels_unchanged"]
          print("P4A SOURCE NUMERIC GATE:",data["status"])
          print("P4A CHANGES:",data["P4a_merges"]["changed_pixel_count"])
          print("P4A CHECKS:",json.dumps(data["P4a_source_checks"]["checks"]))
          print("P4A REPORT SHA256:",hashlib.sha256((root/"report.json").read_bytes()).hexdigest())
          PY
      - name: Always preserve original G and H visuals and negative gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-color32-p4a-frozen-G-vs-island-H-source-only
          path: ${{ runner.temp }}/engine001-color32-p4a
          retention-days: 30
          if-no-files-found: warn
