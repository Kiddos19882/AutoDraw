name: ENGINE-001 S5-P1 genuine pretrained OneFormer original semantic preflight

on:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - ".github/workflows/engine001-color32-s5p1-oneformer-original-semantics.yml"
      - "AutoDraw_Stage20/tests/run_engine001_color32_s5p1_oneformer.py"
      - "AutoDraw_Stage20/tests/test_engine001_color32_s5p1_oneformer.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autodraw-s5p1-oneformer-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  source-only-authentic-oneformer:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CPU PyTorch runtime
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.7.1" "torchvision==0.22.1"
      - name: Install pinned original RGB and model dependencies
        run: |
          python -m pip install "transformers==4.51.3" "huggingface_hub>=0.30,<1" "Pillow>=11,<13" "numpy>=2,<3" "scikit-image>=0.25,<0.27" "scipy>=1.13,<2" "timm>=1.0,<2"
      - name: Synthetic semantic contract tests and docs audit
        shell: bash
        run: |
          python -m py_compile AutoDraw_Stage20/tests/run_engine001_color32_s5p1_oneformer.py AutoDraw_Stage20/tests/test_engine001_color32_s5p1_oneformer.py
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_color32_s5p1_oneformer.py -v
          python AutoDraw_Stage20/tools/check_markdown_docs.py --root AutoDraw_Stage20
      - name: Genuine official pinned OneFormer on original RGB only
        shell: bash
        run: |
          python AutoDraw_Stage20/tests/run_engine001_color32_s5p1_oneformer.py \
            --source AutoDraw_Stage20/testImages/wV6VeZI9S1Y.png \
            --output "${{ runner.temp }}/engine001-s5p1-oneformer"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("${{ runner.temp }}/engine001-s5p1-oneformer")
          report=json.loads((root/"report.json").read_text())
          assert report["actual_pretrained_inference"] is True
          assert report["model_checkpoint_bytes"] >= 100_000_000
          assert report["input_original_rgb_only"] is True
          assert report["trained_game32_palette_head"] is False
          assert report["game32_palette_conversion"]=="NOT_RUN"
          assert report["V44_B_410_final_strokes_changed"] is False
          assert not report["production_accepted"] and report["exact_CHALK"] is None
          for name,sha in report["output_sha256"].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==sha
          print("S5P1 SEMANTIC GATE",report["semantic_stats"]["feasibility_gate"])
          print("S5P1 REPORT SHA",hashlib.sha256((root/"report.json").read_bytes()).hexdigest())
          PY
      - name: Preserve explicit failure marker (do not claim neural inference)
        if: failure()
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/engine001-s5p1-oneformer"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"engine001-s5p1-oneformer"
          if not (root/"report.json").exists():
              (root/"ci-failure.json").write_text(json.dumps({
                "status":"CI_FAIL_PRETRAINED_ONEFORMER_NOT_CONFIRMED",
                "inference":"NOT_CONFIRMED",
                "github_sha":os.getenv("GITHUB_SHA"),
                "github_run_id":os.getenv("GITHUB_RUN_ID"),
                "production_accepted":False},indent=2)+"\n")
          PY
        env:
          RUNNER_TEMP: ${{ runner.temp }}
      - name: Always archive real semantic output or explicitly negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-s5p1-real-oneformer-original-semantic-only
          path: ${{ runner.temp }}/engine001-s5p1-oneformer/
          if-no-files-found: warn
          retention-days: 30
