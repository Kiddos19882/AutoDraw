name: AutoDraw ENGINE-001 offline E5 native screen comparison

on:
  push:
    branches:
      - feature/image-geometry-optimization
    paths:
      - "AutoDraw_Stage20/tests/game_renderer_reference.js"
      - "AutoDraw_Stage20/source/preparation/chalk_fill_strategy_comparison.py"
      - "AutoDraw_Stage20/source/preparation/chalk_fill_fixed_radius_planner.py"
      - "AutoDraw_Stage20/tests/game_renderer_reference.test.js"
      - "AutoDraw_Stage20/tests/run_egret_stage_reference_firefox.py"
      - "AutoDraw_Stage20/tests/validate_engine001_e5_native.py"
      - "AutoDraw_Stage20/tests/compare_stage_renderer_reference.py"
      - "AutoDraw_Stage20/source/preparation/renderer_acceptance.py"
      - "AutoDraw_Stage20/source/preparation/renderer_geometry.py"
      - ".github/workflows/engine001-e5-offline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autodraw-engine001-e5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-screen-e5:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install E5 analysis dependencies
        run: python -m pip install "selenium>=4.27" numpy pillow opencv-python pytest
      - name: Check accepted-point replay syntax and regression tests
        run: |
          node --check AutoDraw_Stage20/tests/game_renderer_reference.js
          node --test AutoDraw_Stage20/tests/game_renderer_reference.test.js
      - name: Test renderer capture validation contracts
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\AutoDraw_Stage20\source\preparation"
          python -m pytest -q AutoDraw_Stage20/source/preparation/tests/test_renderer_acceptance.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate nine immutable native Stage A-D references and compare live PNG
        shell: pwsh
        run: |
          $journal = "AutoDraw_Stage20/data/results/brush_behavior_tests/chalk_test_blocks/chalk-block-ENGINE001-chalk-20261108-080330-af2835-9fdb9bd9.json"
          $native = Join-Path $env:RUNNER_TEMP "engine001-e5-native"
          $reports = Join-Path $env:RUNNER_TEMP "engine001-e5-results"
          $server = Start-Process -FilePath python -ArgumentList @("-m", "http.server", "8765", "--bind", "127.0.0.1") -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 3
            python AutoDraw_Stage20/tests/run_egret_stage_reference_firefox.py --base-url "http://127.0.0.1:8765" --workspace "$env:GITHUB_WORKSPACE" --engine001-journal $journal --engine001-only --output-dir $native
            if ($LASTEXITCODE -ne 0) { throw "ENGINE-001 native Stage rendering failed." }
            python AutoDraw_Stage20/tests/validate_engine001_e5_native.py --workspace "$env:GITHUB_WORKSPACE" --journal $journal --reference-root $native --output-root $reports
            if ($LASTEXITCODE -ne 0) { throw "ENGINE-001 E5 comparison incomplete; inspect reports." }
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
      - name: Upload native Stage renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autodraw-engine001-e5-native-stage
          path: ${{ runner.temp }}/engine001-e5-native/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload independent E5 comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autodraw-engine001-e5-screen-results
          path: ${{ runner.temp }}/engine001-e5-results/
          if-no-files-found: warn
          retention-days: 30

  fill001-contour-native:
    name: FILL-001 native contour-first BoardPane (offline, not live E5)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native renderer and frozen planner dependencies
        run: python -m pip install "selenium>=4.27" numpy pillow opencv-python-headless pytest
      - name: Check browser syntax
        run: node --check AutoDraw_Stage20/tests/game_renderer_reference.js
      - name: Export immutable-shape native contour fixture
        shell: pwsh
        run: |
          Push-Location AutoDraw_Stage20/source/preparation
          try {
            python chalk_fill_strategy_comparison.py --native-fixture --output-dir "../../tests/fill001-contour-first-native-input.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
      - name: Render native BoardPane WebGL baseline and ordered contour variants
        shell: pwsh
        run: |
          $native = Join-Path $env:RUNNER_TEMP "fill001-native"
          $server = Start-Process -FilePath python -ArgumentList @("-m", "http.server", "8765", "--bind", "127.0.0.1") -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 3
            python AutoDraw_Stage20/tests/run_egret_stage_reference_firefox.py --base-url "http://127.0.0.1:8765" --workspace "$env:GITHUB_WORKSPACE" --fill001-contour-only --output-dir $native
            if ($LASTEXITCODE -ne 0) { throw "FILL001 native compositor probe failed." }
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
      - name: Audit native alpha vs 3x frozen logical target (not live PNG gate)
        shell: pwsh
        run: |
          python AutoDraw_Stage20/source/preparation/chalk_fill_strategy_comparison.py --native-render-dir "$env:RUNNER_TEMP\fill001-native\fill001-contour-native-v1" --output-dir "$env:RUNNER_TEMP\fill001-native\fill001-contour-native-v1\native-alpha-audit.json"
          if ($LASTEXITCODE -ne 0) { throw "Native FILL001 alpha audit failed." }
      - name: Export V2 frozen trim sweep into native browser fixture
        shell: pwsh
        run: |
          Push-Location AutoDraw_Stage20/source/preparation
          try {
            python chalk_fill_strategy_comparison.py --native-trim-fixture --output-dir "../../tests/fill001-contour-trims-native-input.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
      - name: Render native V2 BoardPane endpoint-trim controls
        shell: pwsh
        run: |
          $native = Join-Path $env:RUNNER_TEMP "fill001-native"
          $server = Start-Process -FilePath python -ArgumentList @("-m", "http.server", "8765", "--bind", "127.0.0.1") -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 3
            python AutoDraw_Stage20/tests/run_egret_stage_reference_firefox.py --base-url "http://127.0.0.1:8765" --workspace "$env:GITHUB_WORKSPACE" --fill001-contour-trim-only --output-dir $native
            if ($LASTEXITCODE -ne 0) { throw "Native V2 BoardPane trim replay failed." }
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
      - name: Audit V2 native alpha vs frozen 3x logical target (no live quality)
        shell: pwsh
        run: |
          python AutoDraw_Stage20/source/preparation/chalk_fill_strategy_comparison.py --native-render-dir "$env:RUNNER_TEMP\fill001-native\fill001-contour-native-v2" --output-dir "$env:RUNNER_TEMP\fill001-native\fill001-contour-native-v2\native-alpha-audit-v2.json"
          if ($LASTEXITCODE -ne 0) { throw "Native V2 alpha diagnostic failed." }
      - name: Export mixed-width V3 contour/native frozen fixture
        shell: pwsh
        run: |
          Push-Location AutoDraw_Stage20/source/preparation
          try {
            python chalk_fill_strategy_comparison.py --native-mixed-fixture --output-dir "../../tests/fill001-contour-mixed-native-input.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
      - name: Render mixed-width V3 native BoardPane candidates
        shell: pwsh
        run: |
          $native = Join-Path $env:RUNNER_TEMP "fill001-native"
          $server = Start-Process -FilePath python -ArgumentList @("-m", "http.server", "8765", "--bind", "127.0.0.1") -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 3
            python AutoDraw_Stage20/tests/run_egret_stage_reference_firefox.py --base-url "http://127.0.0.1:8765" --workspace "$env:GITHUB_WORKSPACE" --fill001-contour-mixed-only --output-dir $native
            if ($LASTEXITCODE -ne 0) { throw "Mixed-width V3 native replay failed." }
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
      - name: Audit V3 mixed-width native local alpha footprint
        shell: pwsh
        run: |
          python AutoDraw_Stage20/source/preparation/chalk_fill_strategy_comparison.py --native-render-dir "$env:RUNNER_TEMP\fill001-native\fill001-contour-native-v3" --output-dir "$env:RUNNER_TEMP\fill001-native\fill001-contour-native-v3\native-alpha-audit-v3.json"
          if ($LASTEXITCODE -ne 0) { throw "Native V3 mixed alpha audit failed." }
      - name: Upload native FILL-001 comparison (no gameplay)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autodraw-fill001-native-contour-first-v1
          path: ${{ runner.temp }}/fill001-native/
          if-no-files-found: warn
          retention-days: 30
