name: ENGINE-001 V32 native Egret adaptive color-region completion

on:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - ".github/workflows/engine001-native-adaptive-color-v32.yml"
      - "AutoDraw_Stage20/tests/run_engine001_native_adaptive_color_v32.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  existing-v5-plus-shape-fill:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install actual native Egret browser dependencies
        run: python -m pip install "selenium>=4,<5" "numpy>=2,<3" "opencv-python-headless>=4.10,<5" "Pillow>=11,<13" "scikit-image>=0.25,<0.27" "scipy>=1.13,<2" "pytest>=8,<10"
      - name: Download unchanged V5 real native benchmark
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/v5"
          gh run download 43692740514 --repo Kiddos19882/AutoDraw -n engine001-complex-multicolor-holdout-v5 -D "$RUNNER_TEMP/v5"
      - name: Reuse actual BoardPane V5 native renderer with V32 generated color-region strokes
        shell: bash
        run: |
          node --check AutoDraw_Stage20/tests/game_renderer_reference.js
          node --test AutoDraw_Stage20/tests/game_renderer_reference.test.js
          python AutoDraw_Stage20/tests/run_engine001_native_adaptive_color_v32.py \
            --workspace . \
            --v5-archive "$RUNNER_TEMP/v5" \
            --output "$RUNNER_TEMP/engine001-v32"
          python - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"engine001-v32"
          report=json.loads((root/"report.json").read_text())
          assert report["v5_native"]["strokes"]==123
          assert report["v32_native"]["strokes"]>123
          assert report["v32_native"]["synthetic_vertices_not_chalk"]<=5900
          assert all(hashlib.sha256((root/name).read_bytes()).hexdigest()==sha
                     for name,sha in report["derived_sha256"].items())
          print("V32 source provenance and real native Egret evidence reproducibility PASS, not image quality PASS")
          PY
      - name: Preserve all actual V32 Egret full-color PNGs, per-class RGBA and planning evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-v32-native-adaptive-color-visual-evidence
          path: ${{ runner.temp }}/engine001-v32
          if-no-files-found: warn
