name: ENGINE-001 V38 audit archived native color-boundary gaps

on:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - ".github/workflows/engine001-native-color-boundary-audit-v38.yml"
      - "AutoDraw_Stage20/tests/run_engine001_native_color_boundary_audit_v38.py"
      - "AutoDraw_Stage20/tests/test_engine001_native_color_boundary_audit_v38.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evidence-bound-offline-native-alpha-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis dependencies only
        run: python -m pip install "numpy>=2,<3" "opencv-python-headless>=4.10,<5" "Pillow>=11,<13"
      - name: Retrieve frozen true Egret V37-P2 source PNG evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/v37p2"
          gh run download 43747149144 --repo Kiddos19882/AutoDraw -n engine001-v37p2-native-full-contour-fill-color-evidence -D "$RUNNER_TEMP/v37p2"
      - name: Unit checks and deterministic source-bound audit
        shell: bash
        run: |
          python -m py_compile AutoDraw_Stage20/tests/run_engine001_native_color_boundary_audit_v38.py
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_native_color_boundary_audit_v38.py -v
          python AutoDraw_Stage20/tests/run_engine001_native_color_boundary_audit_v38.py \
            --source AutoDraw_Stage20/testImages/wV6VeZI9S1Y.png \
            --v37p2-archive "$RUNNER_TEMP/v37p2" \
            --output "$RUNNER_TEMP/engine001-v38-audit"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"engine001-v38-audit"/"audit.json"
          r=json.loads(p.read_text(encoding="utf-8"))
          assert r["experiment"]=="ENGINE001_NATIVE_COLOR_BOUNDARY_AUDIT_V38"
          assert r["native_alpha_A_B_C_pixel_identical"]
          for a in ("24","128"):
              rows=r["alpha_threshold_measurements"][a]["per_source_class"]
              assert sorted(rows)==["4","5","6","7"]
              assert all(0 <= rows[c]["native_recall"] <= 1 for c in rows)
          print("ARCHIVED E2/E3 AUDIT PASS; no new brush quality, no game CHALK or live E4")
          PY
      - name: Preserve audit evidence even if checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-v38-archived-native-color-boundary-audit
          path: ${{ runner.temp }}/engine001-v38-audit
          if-no-files-found: warn
