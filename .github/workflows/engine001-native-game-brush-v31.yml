name: ENGINE-001 V31 real Egret game brush footprint matrix

on:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - ".github/workflows/engine001-native-game-brush-v31.yml"
      - "AutoDraw_Stage20/tests/run_engine001_native_brush_v31.py"
      - "AutoDraw_Stage20/tests/game_renderer_reference.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boardpane-actual-brush:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser and test dependencies
        run: |
          python -m pip install "selenium>=4,<5" "Pillow>=11,<13" "numpy>=2,<3" "opencv-python-headless>=4.10,<5" "scikit-image>=0.25,<0.27" "scipy>=1.13,<2" "pytest>=8,<10"
      - name: Renderer JS regression and capsule algorithm tests
        shell: bash
        run: |
          node --check AutoDraw_Stage20/tests/game_renderer_reference.js
          node --test AutoDraw_Stage20/tests/game_renderer_reference.test.js
          PYTHONPATH=AutoDraw_Stage20/source/preparation python -m pytest AutoDraw_Stage20/source/preparation/tests/test_brush_footprint_geometry.py -q
      - name: Real archived Egret BoardPane game brush matrix, 30 cases plus blank
        shell: bash
        run: |
          python AutoDraw_Stage20/tests/run_engine001_native_brush_v31.py \
            --workspace . \
            --source AutoDraw_Stage20/testImages/wV6VeZI9S1Y.png \
            --output "$RUNNER_TEMP/engine001-v31"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"engine001-v31"
          r=json.loads((root/"report.json").read_text())
          assert r["metrics"]["cases"]==30 and r["blank"]["backingAlpha1"]==0
          assert r["productionModified"] is False
          assert all(hashlib.sha256((root/n).read_bytes()).hexdigest()==h
                     for n,h in r["derivedSha256"].items())
          print("V31 authentic Egret raster and independent capsule diagnostic E3 PASS; no gameplay CHALK")
          PY
      - name: Preserve native raw RGBA logical cells and actual PNG samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-v31-native-game-brush-footprint-evidence
          path: ${{ runner.temp }}/engine001-v31
          if-no-files-found: warn
