name: ENGINE-001 V43 P2b native thin edges wide center split

on:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - ".github/workflows/engine001-native-split-interior-v43p2b.yml"
      - "AutoDraw_Stage20/tests/run_engine001_native_split_interior_v43p2b.py"
      - "AutoDraw_Stage20/tests/test_engine001_native_split_interior_v43p2b.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  real-egret-thin-wide-split:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing actual Egret native replay dependencies
        run: python -m pip install "selenium>=4,<5" "numpy>=2,<3" "opencv-python-headless>=4.10,<5" "Pillow>=11,<13" "scikit-image>=0.25,<0.27" "scipy>=1.13,<2"
      - name: Restore original full 410-contour frozen V37-P2-C native plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/v37p2"
          gh run download 43747149144 --repo Kiddos19882/AutoDraw -n engine001-v37p2-native-full-contour-fill-color-evidence -D "$RUNNER_TEMP/v37p2"
      - name: Verify source-only selection then real Egret thin/wide A B C
        shell: bash
        run: |
          node --check AutoDraw_Stage20/tests/game_renderer_reference.js
          node --test AutoDraw_Stage20/tests/game_renderer_reference.test.js
          python -m py_compile AutoDraw_Stage20/tests/run_engine001_native_split_interior_v43p2b.py
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_native_split_interior_v43p2b.py -v
          python AutoDraw_Stage20/tests/run_engine001_native_split_interior_v43p2b.py \
            --workspace . \
            --source AutoDraw_Stage20/testImages/wV6VeZI9S1Y.png \
            --v37p2-archive "$RUNNER_TEMP/v37p2" \
            --output "$RUNNER_TEMP/engine001-v43-p2b"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"engine001-v43-p2b"
          r=json.loads((root/"report.json").read_text(encoding="utf-8"))
          assert r["experiment"]=="ENGINE001_V43P2B_NATIVE_SPLIT_THIN_WIDE"
          assert r["native_A_frozen_exact_RGBA"]
          assert r["all_original_410_dark_contours_alpha_exact"]
          assert [(r["variants"][c]["strokes"],r["variants"][c]["synthetic_vertices_NOT_CHALK"]) for c in "ABC"]==[(2355,5682),(2435,5842),(2455,5882)]
          assert all(hashlib.sha256((root/p).read_bytes()).hexdigest()==h for p,h in r["artifact_SHA256"].items())
          assert r["production_accepted"] is False and r["game_exact_CHALK"] is None
          print("Native Egret thin/wide split A/B/C completed. Diagnostic quality is separate from workflow PASS.")
          PY
      - name: Archive actual native P2b originals and negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-v43p2b-native-thin-wide-split-evidence
          path: ${{ runner.temp }}/engine001-v43-p2b
          if-no-files-found: warn
