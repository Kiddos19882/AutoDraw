name: ENGINE-001 V33 actual Egret width2 vs V29 Stage20 color preview

on:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - ".github/workflows/engine001-native-v29-brush2-v33.yml"
      - "AutoDraw_Stage20/tests/run_engine001_native_v29_brush2_v33.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  actual-game-brush-on-budget-plan:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install previously proven native-Egret replay dependencies
        run: python -m pip install "selenium>=4,<5" "numpy>=2,<3" "opencv-python-headless>=4.10,<5" "Pillow>=11,<13" "scikit-image>=0.25,<0.27" "scipy>=1.13,<2"
      - name: Recover original frozen Stage20 V29 plan and preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/v29"
          gh run download 43688844089 --repo Kiddos19882/AutoDraw -n engine001-v29-budgeted-color-visual-evidence -D "$RUNNER_TEMP/v29"
      - name: Native BoardPane WebGL render of unchanged V29 paths with game brush width2
        shell: bash
        run: |
          node --check AutoDraw_Stage20/tests/game_renderer_reference.js
          node --test AutoDraw_Stage20/tests/game_renderer_reference.test.js
          python AutoDraw_Stage20/tests/run_engine001_native_v29_brush2_v33.py \
            --workspace . \
            --source AutoDraw_Stage20/testImages/wV6VeZI9S1Y.png \
            --v29-archive "$RUNNER_TEMP/v29" \
            --output "$RUNNER_TEMP/engine001-v33"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"engine001-v33"
          r=json.loads((root/"report.json").read_text())
          assert r["synthetic_strokes"]==1945 and r["synthetic_vertices_not_CHALK"]==3890
          assert r["zero_length_dx_shim_count"]==447 and r["real_lineStyle_width"]==2
          assert r["status"]=="REAL_ARCHIVED_EGRET_E3_NOT_GAME"
          assert all(hashlib.sha256((root/n).read_bytes()).hexdigest()==v
                     for n,v in r["derived_sha256"].items())
          print("V33 E3 native WebGL capture reproducible; per-color game quality and CHALK NOT proved")
          PY
      - name: Preserve original real Egret color class PNGs and V33 visual comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-v33-game-brush2-budgeted-color-evidence
          path: ${{ runner.temp }}/engine001-v33
          if-no-files-found: warn
