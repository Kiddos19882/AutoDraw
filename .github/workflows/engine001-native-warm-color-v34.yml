name: ENGINE-001 V34 native warm color fidelity on frozen V33

on:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - ".github/workflows/engine001-native-warm-color-v34.yml"
      - "AutoDraw_Stage20/tests/run_engine001_native_warm_color_v34.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-warm-color-fidelity:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native Egret replay dependencies
        run: python -m pip install "selenium>=4,<5" "numpy>=2,<3" "opencv-python-headless>=4.10,<5" "Pillow>=11,<13" "scikit-image>=0.25,<0.27" "scipy>=1.13,<2"
      - name: Frozen artifact recovery from verified prior V29 and V33 runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/v29" "$RUNNER_TEMP/v33"
          gh run download 43688844089 --repo Kiddos19882/AutoDraw -n engine001-v29-budgeted-color-visual-evidence -D "$RUNNER_TEMP/v29"
          gh run download 43696364638 --repo Kiddos19882/AutoDraw -n engine001-v33-game-brush2-budgeted-color-evidence -D "$RUNNER_TEMP/v33"
      - name: Native BoardPane WebGL A/B on identical frozen strokes
        shell: bash
        run: |
          node --check AutoDraw_Stage20/tests/game_renderer_reference.js
          node --test AutoDraw_Stage20/tests/game_renderer_reference.test.js
          python -m py_compile AutoDraw_Stage20/tests/run_engine001_native_warm_color_v34.py
          python AutoDraw_Stage20/tests/run_engine001_native_warm_color_v34.py \
            --workspace . \
            --source AutoDraw_Stage20/testImages/wV6VeZI9S1Y.png \
            --v29-archive "$RUNNER_TEMP/v29" \
            --v33-archive "$RUNNER_TEMP/v33" \
            --output "$RUNNER_TEMP/engine001-v34"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"engine001-v34"
          r=json.loads((root/"report.json").read_text(encoding="utf-8"))
          assert r["strokes"]==1945 and r["synthetic_vertices_NOT_CHALK"]==3890
          assert r["identical_geometry"] and r["native_alpha_identical"]
          assert r["v33_native_png_byte_hash_reproduced"]
          assert all(hashlib.sha256((root/p).read_bytes()).hexdigest()==d
                     for p,d in r["derived_sha256"].items())
          print("V34 measured; candidate improvement is separate from quality gate:",r["color_fidelity_improvement_diagnostic"])
          PY
      - name: Preserve evidence even if diagnostics fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-v34-native-warm-color-evidence
          path: ${{ runner.temp }}/engine001-v34
          if-no-files-found: warn
