name: ENGINE-001 painted-frontier V2 native Egret diagnostic

on:
  push:
    branches:
      - feature/image-geometry-optimization
    paths:
      - ".github/workflows/engine001-painted-frontier-v2.yml"
      - "AutoDraw_Stage20/tests/run_engine001_painted_frontier_v2.py"
      - "AutoDraw_Stage20/tests/test_engine001_painted_frontier_v2.py"
      - "AutoDraw_Stage20/tests/run_engine001_two_icon_mask_probe.py"
      - "AutoDraw_Stage20/tests/run_engine001_predictive_contour_probe.py"
      - "AutoDraw_Stage20/tests/game_renderer_reference.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine001-painted-frontier-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  two-icon-painted-frontier:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned-experiment prerequisites
        run: python -m pip install selenium Pillow numpy opencv-python-headless
      - name: Run deterministic masks, contours, halo and baseline regression checks
        shell: pwsh
        run: |
          node --check AutoDraw_Stage20/tests/game_renderer_reference.js
          python -m unittest discover -s AutoDraw_Stage20/tests -p "test_engine001_painted_frontier_v2.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s AutoDraw_Stage20/tests -p "test_engine001_predictive_contour_probe.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Render painted-stripe-frontier V2 via actual BoardPane and Egret WebGL
        shell: pwsh
        run: |
          python AutoDraw_Stage20/tests/run_engine001_painted_frontier_v2.py --workspace . --output-dir "$env:RUNNER_TEMP\\engine001-frontier-v2"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve forecast, native image, negative results and point plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-two-icon-painted-frontier-v2
          path: ${{ runner.temp }}/engine001-frontier-v2/
          if-no-files-found: warn
          retention-days: 30
