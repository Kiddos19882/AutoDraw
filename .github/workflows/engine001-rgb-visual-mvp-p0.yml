name: ENGINE-001 RGB visual MVP P0 edge-aware original source research
on:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - '.github/workflows/engine001-rgb-visual-mvp-p0.yml'
      - 'AutoDraw_Stage20/tests/run_engine001_rgb_visual_mvp_p0.py'
      - 'AutoDraw_Stage20/tests/test_engine001_rgb_visual_mvp_p0.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: engine001-rgb-visual-mvp-p0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-rgb-visual-mvp-p0:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout (bounded)
        uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned source-only tools
        run: |
          python -m pip install numpy==2.2.6 opencv-python-headless==4.11.0.86 Pillow==11.3.0 scikit-image==0.25.2 scipy==1.15.3 requests==2.32.5
      - name: Check source-only synthetic contracts and docs
        run: |
          python -m py_compile AutoDraw_Stage20/tests/run_engine001_rgb_visual_mvp_p0.py AutoDraw_Stage20/tests/test_engine001_rgb_visual_mvp_p0.py
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_rgb_visual_mvp_p0.py -v
          python AutoDraw_Stage20/tools/check_markdown_docs.py --root AutoDraw_Stage20
      - name: Download pinned M1 RGB and original native V44 contour
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_TEMP: ${{ runner.temp }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,os,requests
          from pathlib import Path
          d=Path(os.environ["RUNNER_TEMP"])
          for artifact_id,name,expected in [
            (14388687061,"m1-original.zip","8bedc496bf01cf7205ecc8ceb7be8eb0f68b751b11c53ea67dbdd3982c7fe583"),
            (14201581692,"v44-original.zip","43cb8e14a7e387b26772612ac06d1c7c6f176b8bd0c2d41e8945042fc80304a1")]:
              res=requests.get(f"https://api.github.com/repos/Kiddos19882/AutoDraw/actions/artifacts/{artifact_id}/zip",
                 headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                 "Accept":"application/vnd.github+json","User-Agent":"AutoDraw-ENGINE001-RGB-P0"},
                 timeout=180,allow_redirects=True)
              res.raise_for_status()
              got=hashlib.sha256(res.content).hexdigest()
              if got!=expected: raise ValueError(f"BLOCKED_ARCHIVE_SHA {artifact_id} {got}")
              (d/name).write_bytes(res.content)
              print("Pinned artifact SHA PASS",artifact_id,got)
          PY
      - name: Run new unrestricted RGB prefilter candidates
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        shell: bash
        run: |
          python AutoDraw_Stage20/tests/run_engine001_rgb_visual_mvp_p0.py \
            --source AutoDraw_Stage20/testImages/wV6VeZI9S1Y.png \
            --m1-archive "$RUNNER_TEMP/m1-original.zip" \
            --v44-archive "$RUNNER_TEMP/v44-original.zip" \
            --output "$RUNNER_TEMP/engine001-rgb-visual-mvp-p0"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          d=Path(os.environ["RUNNER_TEMP"])/"engine001-rgb-visual-mvp-p0"
          r=json.loads((d/"report.json").read_text(encoding="utf8"))
          assert r["github_sha"]==os.environ["GITHUB_SHA"],"BLOCKED_WRONG_COMMIT"
          assert r["github_run_id"]==os.environ["GITHUB_RUN_ID"],"BLOCKED_WRONG_RUN"
          assert r["contour_strokes"]==410 and r["contour_vertices_not_CHALK"]==1792
          assert len(r["metrics"])==6
          assert all(x["protected_exact"] for k,x in r["metrics"].items() if k not in ("M1_MERGED",))
          for name,expected in r["file_sha256"].items():
              assert hashlib.sha256((d/name).read_bytes()).hexdigest()==expected,(name,"HASH_FAIL")
          print("TECHNICAL_E3_OUTPUT_AND_HASH_PASS")
          for k,v in r["metrics"].items():
              print(k,v["source_gate"],"meanDE",round(v["whole_mean_deltaE00"],5),
                    "source_edge",round(v["fixed_source_strong_sobel_overlap"],5))
          print("SOURCE_ONLY; REAL_EGRET_FILL_NOT_RUN; EXACT_CHALK_NOT_RUN")
          PY
      - name: Preserve PNGs and metrics even if screening fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-rgb-visual-mvp-p0-edge-aware-egret-source
          path: ${{ runner.temp }}/engine001-rgb-visual-mvp-p0/
          if-no-files-found: warn
          retention-days: 30
