name: ENGINE-001 S5 A14 Illustration F4 F6 no dots
on:
  workflow_dispatch:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - '.github/workflows/engine001-s5-native-a14-nodot.yml'
      - 'AutoDraw_Stage20/tests/run_engine001_s5_native_a14_nodot.py'
      - 'AutoDraw_Stage20/tests/engine001_s5_a14_free_angle.py'
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 Pillow==11.3.0
      - run: python AutoDraw_Stage20/tests/engine001_s5_a14_free_angle.py
  native:
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        case: [illustration]
        radius: [1, 2]
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install selenium==4.38.0 numpy==2.2.6 scipy==1.15.3 Pillow==11.3.0 scikit-image==0.25.2 opencv-python-headless==4.11.0.86 requests==2.32.5 PyMaxflow==1.3.2
      - run: python AutoDraw_Stage20/tests/run_engine001_s5_native_a14_nodot.py --radius ${{ matrix.radius }} --case ${{ matrix.case }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S5-A14-nodot-${{ matrix.case }}-r${{ matrix.radius }}
          path: ${{ runner.temp }}/s5-a14-nodot-${{ matrix.case }}-r0${{ matrix.radius }}
          if-no-files-found: error
