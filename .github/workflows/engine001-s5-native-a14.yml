name: ENGINE-001 S5 A14 P2 RTV contour bands
on:
  workflow_dispatch:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - '.github/workflows/engine001-s5-native-a14.yml'
      - 'AutoDraw_Stage20/tests/run_engine001_s5_native_a14.py'
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 Pillow==11.3.0
      - run: python AutoDraw_Stage20/tests/run_engine001_s5_native_a14.py --contracts
  native:
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        case: [home, illustration, second-png, wv]
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install selenium==4.38.0 numpy==2.2.6 scipy==1.15.3 Pillow==11.3.0 scikit-image==0.25.2 opencv-python-headless==4.11.0.86 requests==2.32.5 PyMaxflow==1.3.2
      - run: python AutoDraw_Stage20/tests/run_engine001_s5_native_a14.py --case ${{ matrix.case }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S5-A14-${{ matrix.case }}
          path: ${{ runner.temp }}/s5-a14-${{ matrix.case }}
          if-no-files-found: error
