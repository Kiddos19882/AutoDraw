name: ENGINE-001 S5 A15 Illustration three-stage native fill
on:
  workflow_dispatch:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - '.github/workflows/engine001-s5-native-a15.yml'
      - 'AutoDraw_Stage20/tests/run_engine001_s5_native_a15.py'
permissions:
  contents: read
  actions: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 Pillow==11.3.0
      - run: python AutoDraw_Stage20/tests/run_engine001_s5_native_a15.py --contracts
  native:
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        case: [illustration]
        radius: [1, 2]
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install selenium==4.38.0 numpy==2.2.6 scipy==1.15.3 Pillow==11.3.0 scikit-image==0.25.2 opencv-python-headless==4.11.0.86 requests==2.32.5 PyMaxflow==1.3.2
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45512562848
          name: S5-A14-nodot-l5-illustration-r${{ matrix.radius }}
          path: ${{ runner.temp }}/nodot-baseline
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45465036156
          name: S5-A14-nodot-illustration-r${{ matrix.radius }}
          path: ${{ runner.temp }}/nodot-source
      - run: python AutoDraw_Stage20/tests/run_engine001_s5_native_a15.py --radius ${{ matrix.radius }} --baseline "${{ runner.temp }}/nodot-baseline" --source "${{ runner.temp }}/nodot-source"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S5-A15-${{ matrix.case }}-r${{ matrix.radius }}
          path: ${{ runner.temp }}/s5-a15-${{ matrix.case }}-r0${{ matrix.radius }}
          if-no-files-found: error
