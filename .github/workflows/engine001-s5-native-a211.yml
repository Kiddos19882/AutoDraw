name: ENGINE-001 S5 A211 native redundant vertex pruning
on:
  workflow_dispatch:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - '.github/workflows/engine001-s5-native-a211.yml'
      - 'AutoDraw_Stage20/tests/run_engine001_s5_native_a211.py'
permissions:
  contents: read
  actions: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 Pillow==11.3.0
      - run: python AutoDraw_Stage20/tests/run_engine001_s5_native_a211.py --contracts
  native:
    needs: contracts
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install selenium==4.38.0 numpy==2.2.6 scipy==1.15.3 Pillow==11.3.0 scikit-image==0.25.2 opencv-python-headless==4.11.0.86 requests==2.32.5 PyMaxflow==1.3.2
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45512562848
          name: S5-A14-nodot-l5-illustration-r2
          path: ${{ runner.temp }}/nodot-l5-baseline
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45465036156
          name: S5-A14-nodot-illustration-r2
          path: ${{ runner.temp }}/nodot-source
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45562888542
          name: S5-A20-diagonal-illustration
          path: ${{ runner.temp }}/a20-baseline
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45565760896
          name: S5-A21-diagonal-illustration
          path: ${{ runner.temp }}/a21-baseline
      - run: python AutoDraw_Stage20/tests/run_engine001_s5_native_a211.py --baseline "${{ runner.temp }}/nodot-l5-baseline" --source "${{ runner.temp }}/nodot-source"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S5-A211-diagonal-illustration
          path: ${{ runner.temp }}/s5-a211-diagonal
          if-no-files-found: error
