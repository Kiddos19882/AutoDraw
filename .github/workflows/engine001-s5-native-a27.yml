name: ENGINE-001 S5 A27 A17 R3 W1 full fill and small stroke joining
on:
  workflow_dispatch:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - '.github/workflows/engine001-s5-native-a27.yml'
      - 'AutoDraw_Stage20/tests/run_engine001_s5_native_a27.py'
permissions:
  contents: read
  actions: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 Pillow==11.3.0
      - run: python AutoDraw_Stage20/tests/run_engine001_s5_native_a27.py --contracts
  native:
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        contour: [control, joined]
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install selenium==4.38.0 numpy==2.2.6 scipy==1.15.3 Pillow==11.3.0 scikit-image==0.25.2 opencv-python-headless==4.11.0.86 requests==2.32.5 PyMaxflow==1.3.2
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45692663252
          name: S5-A26-stage-17
          path: ${{ runner.temp }}/nodot-baseline
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45465036156
          name: S5-A14-nodot-illustration-r2
          path: ${{ runner.temp }}/nodot-source
      - run: python AutoDraw_Stage20/tests/run_engine001_s5_native_a27.py --radius 2 --baseline "${{ runner.temp }}/nodot-baseline" --source "${{ runner.temp }}/nodot-source" --tolerance 10 --contour ${{ matrix.contour }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S5-A27-${{ matrix.contour }}-full-illustration
          path: ${{ runner.temp }}/s5-a27-${{ matrix.contour }}
          if-no-files-found: error
