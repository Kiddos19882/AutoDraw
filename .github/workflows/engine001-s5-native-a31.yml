name: ENGINE-001 S5 A31 fixed R6 budgeted Blossom routing
on:
  workflow_dispatch:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - '.github/workflows/engine001-s5-native-a31.yml'
      - 'AutoDraw_Stage20/tests/run_engine001_s5_native_a31.py'
permissions:
  contents: read
  actions: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 Pillow==11.3.0 networkx==3.4.2
      - run: python AutoDraw_Stage20/tests/run_engine001_s5_native_a31.py --contracts
  native:
    needs: contracts
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install selenium==4.38.0 numpy==2.2.6 scipy==1.15.3 Pillow==11.3.0 scikit-image==0.25.2 opencv-python-headless==4.11.0.86 requests==2.32.5 PyMaxflow==1.3.2 networkx==3.4.2
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45704720111
          name: S5-A27-joined-full-illustration
          path: ${{ runner.temp }}/a27
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46068739911
          name: S5-A29-contour-comparison
          path: ${{ runner.temp }}/a29
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46070708715
          name: S5-A30-R6-contour-comparison
          path: ${{ runner.temp }}/a30
      - run: python AutoDraw_Stage20/tests/run_engine001_s5_native_a31.py --baseline "${{ runner.temp }}/a27" --a29 "${{ runner.temp }}/a29" --a30 "${{ runner.temp }}/a30"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S5-A31-R6-budgeted-blossom
          path: ${{ runner.temp }}/s5-a31-r6
          if-no-files-found: error
