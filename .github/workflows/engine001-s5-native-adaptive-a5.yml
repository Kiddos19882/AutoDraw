name: ENGINE-001 S5 A5 continuous width1 interval union
on:
  workflow_dispatch:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - '.github/workflows/engine001-s5-native-adaptive-a5.yml'
      - 'AutoDraw_Stage20/tests/run_engine001_s5_native_adaptive_a5.py'
      - 'AutoDraw_Stage20/tests/test_engine001_s5_native_adaptive_a5.py'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 Pillow==11.3.0 opencv-python-headless==4.11.0.86
      - run: python -m py_compile AutoDraw_Stage20/tests/run_engine001_s5_native_adaptive_a5.py
      - run: python AutoDraw_Stage20/tests/test_engine001_s5_native_adaptive_a3.py -v
      - run: python AutoDraw_Stage20/tests/test_engine001_s5_native_adaptive_a4.py -v
      - run: python AutoDraw_Stage20/tests/test_engine001_s5_native_adaptive_a5.py -v
  native:
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        case: [home, illustration, second-png]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install selenium==4.38.0 numpy==2.2.6 scipy==1.15.3 Pillow==11.3.0 scikit-image==0.25.2 opencv-python-headless==4.11.0.86 requests==2.32.5
      - run: python AutoDraw_Stage20/tests/run_engine001_s5_native_adaptive_a5.py --case ${{ matrix.case }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S5-A5-native-${{ matrix.case }}
          path: ${{ runner.temp }}/s5-adaptive-a5-${{ matrix.case }}
          if-no-files-found: error
