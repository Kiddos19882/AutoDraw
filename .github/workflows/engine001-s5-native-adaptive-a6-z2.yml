name: ENGINE-001 S5 A7 selected zoning and lane optimization
on:
  workflow_dispatch:
    inputs:
      historical_z2:
        description: 'Repeat historical all-method Z2 comparison instead of A7'
        type: boolean
        default: false
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - '.github/workflows/engine001-s5-native-adaptive-a6-z2.yml'
      - 'AutoDraw_Stage20/tests/run_engine001_s5_native_adaptive_a6_z2.py'
      - 'AutoDraw_Stage20/tests/engine001_s5_zone_methods.py'
      - 'AutoDraw_Stage20/tests/test_engine001_s5_zone_methods.py'
      - 'AutoDraw_Stage20/tests/engine001_s5_lane_phase.py'
      - 'AutoDraw_Stage20/tests/test_engine001_s5_lane_phase.py'
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 Pillow==11.3.0 scikit-image==0.25.2 opencv-python-headless==4.11.0.86 requests==2.32.5 PyMaxflow==1.3.2
      - run: python -m py_compile AutoDraw_Stage20/tests/run_engine001_s5_native_adaptive_a6_z2.py
      - run: python AutoDraw_Stage20/tests/test_engine001_s5_native_adaptive_a3.py -v
      - run: python AutoDraw_Stage20/tests/test_engine001_s5_native_adaptive_a4.py -v
      - run: python AutoDraw_Stage20/tests/test_engine001_s5_native_adaptive_a5.py -v
      - run: python AutoDraw_Stage20/tests/test_engine001_s5_zone_merge.py -v
      - run: python AutoDraw_Stage20/tests/test_engine001_s5_zone_methods.py -v
      - run: python AutoDraw_Stage20/tests/test_engine001_s5_lane_phase.py -v
  native:
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        case: [home, illustration, second-png]
        batch: ${{ fromJSON(inputs.historical_z2 && '["local","global","combined"]' || '["selected"]') }}
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install selenium==4.38.0 numpy==2.2.6 scipy==1.15.3 Pillow==11.3.0 scikit-image==0.25.2 opencv-python-headless==4.11.0.86 requests==2.32.5 PyMaxflow==1.3.2
      - run: python AutoDraw_Stage20/tests/run_engine001_s5_native_adaptive_a6_z2.py --case ${{ matrix.case }} --batch ${{ matrix.batch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S5-A6-Z2-${{ matrix.case }}-${{ matrix.batch }}
          path: ${{ runner.temp }}/s5-adaptive-a6-z2-${{ matrix.case }}-${{ matrix.batch }}
          if-no-files-found: error
