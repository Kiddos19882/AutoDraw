name: ENGINE-001 S5 true native Egret two-axis brush overlap
on:
  workflow_dispatch:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - '.github/workflows/engine001-s5-native-brush-overlap.yml'
      - 'AutoDraw_Stage20/tests/engine001_s5_native_brush_overlap.py'
      - 'AutoDraw_Stage20/tests/run_engine001_s5_native_brush_overlap.py'
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        case: [wv, hello, pink]
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install selenium==4.38.0 numpy==2.2.6 scipy==1.15.3 Pillow==11.3.0 scikit-image==0.25.2 opencv-python-headless==4.11.0.86 requests==2.32.5
      - run: python -m py_compile AutoDraw_Stage20/tests/engine001_s5_native_brush_overlap.py AutoDraw_Stage20/tests/run_engine001_s5_native_brush_overlap.py
      - run: python AutoDraw_Stage20/tests/run_engine001_s5_native_brush_overlap.py --case ${{ matrix.case }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S5-native-overlap-${{ matrix.case }}
          path: ${{ runner.temp }}/s5-native-overlap-${{ matrix.case }}
          if-no-files-found: error
