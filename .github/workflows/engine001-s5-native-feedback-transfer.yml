name: ENGINE-001 S5 transfer actual Egret feedback to originals
on:
  workflow_dispatch:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - '.github/workflows/engine001-s5-native-feedback-transfer.yml'
      - 'AutoDraw_Stage20/tests/run_engine001_s5_originals_native_transfer.py'
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        case: [hello, pink, ezal]
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install selenium==4.38.0 numpy==2.2.6 scipy==1.15.3 Pillow==11.3.0 scikit-image==0.25.2 opencv-python-headless==4.11.0.86 requests==2.32.5
      - run: python -m py_compile AutoDraw_Stage20/tests/run_engine001_s5_originals_native_transfer.py
      - run: python AutoDraw_Stage20/tests/run_engine001_s5_originals_native_transfer.py --case ${{ matrix.case }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S5-native-transfer-${{ matrix.case }}
          path: ${{ runner.temp }}/s5-transfer-${{ matrix.case }}
          if-no-files-found: error
