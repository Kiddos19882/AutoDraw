name: ENGINE-001 selective brush V4 two-icon native Egret

on:
  push:
    branches:
      - feature/image-geometry-optimization
    paths:
      - ".github/workflows/engine001-selective-brush-v4.yml"
      - "AutoDraw_Stage20/tests/run_engine001_selective_brush_v4.py"
      - "AutoDraw_Stage20/tests/test_engine001_selective_brush_v4.py"
      - "AutoDraw_Stage20/tests/run_engine001_adaptive_brush_v3.py"
      - "AutoDraw_Stage20/tests/game_renderer_reference.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine001-selective-brush-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-v3-vs-selective-v4:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native Egret and fixed geometry test dependencies
        run: python -m pip install selenium Pillow numpy opencv-python-headless
      - name: Run synthetic frozen-plan and prior V3 regressions
        shell: pwsh
        run: |
          node --check AutoDraw_Stage20/tests/game_renderer_reference.js
          python -m unittest discover -s AutoDraw_Stage20/tests -p "test_engine001_selective_brush_v4.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s AutoDraw_Stage20/tests -p "test_engine001_adaptive_brush_v3.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s AutoDraw_Stage20/tests -p "test_engine001_painted_frontier_v2.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check original V3 same-run and V4 actual Egret 5.4.1 WebGL
        shell: pwsh
        run: |
          python AutoDraw_Stage20/tests/run_engine001_selective_brush_v4.py --workspace . --output-dir "$env:RUNNER_TEMP\\engine001-selective-v4"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve control, experiment, forecasts and negative reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-selective-brush-v4-evidence
          path: ${{ runner.temp }}/engine001-selective-v4/
          if-no-files-found: warn
          retention-days: 30
