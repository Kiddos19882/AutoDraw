name: ENGINE-001 V41 selective native Egret alpha-guided endpoints

on:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - ".github/workflows/engine001-selective-endpoints-native-v41.yml"
      - "AutoDraw_Stage20/tests/run_engine001_selective_endpoints_native_v41.py"
      - "AutoDraw_Stage20/tests/test_engine001_selective_endpoints_v41.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  real-egret-source-owned-endpoint-selection:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install unchanged frozen native Egret and analysis dependencies
        run: python -m pip install "selenium>=4,<5" "numpy>=2,<3" "opencv-python-headless>=4.10,<5" "Pillow>=11,<13" "scikit-image>=0.25,<0.27" "scipy>=1.13,<2"
      - name: Recover immutable true Egret V37-P2-C reference
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/v37p2"
          gh run download 43747149144 --repo Kiddos19882/AutoDraw -n engine001-v37p2-native-full-contour-fill-color-evidence -D "$RUNNER_TEMP/v37p2"
      - name: Verify frozen source, unit tests, then native actual Egret A B C
        shell: bash
        run: |
          node --check AutoDraw_Stage20/tests/game_renderer_reference.js
          node --test AutoDraw_Stage20/tests/game_renderer_reference.test.js
          python -m py_compile AutoDraw_Stage20/tests/run_engine001_selective_endpoints_native_v41.py
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_selective_endpoints_v41.py -v
          python AutoDraw_Stage20/tests/run_engine001_selective_endpoints_native_v41.py \
            --workspace . \
            --source AutoDraw_Stage20/testImages/wV6VeZI9S1Y.png \
            --v37p2-archive "$RUNNER_TEMP/v37p2" \
            --output "$RUNNER_TEMP/engine001-v41"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"engine001-v41"
          r=json.loads((root/"report.json").read_text(encoding="utf-8"))
          assert r["experiment"]=="ENGINE001_V41_SELECTIVE_EGRET_ALPHA_ENDPOINT"
          assert r["V37P2_C_control_pixel_exact"] and r["full_410_dark_contour_alpha_exact"]
          assert (r["strokes"],r["synthetic_vertices_NOT_CHALK"])==(2355,5682)
          assert all(hashlib.sha256((root/p).read_bytes()).hexdigest()==v
                     for p,v in r["artifacts_SHA256"].items())
          assert r["production_quality_accepted"] is False and r["exact_game_CHALK"] is None
          print("V41 actual native evidence complete, no game E4/E5/exact CHALK claims")
          PY
      - name: Preserve all selected endpoints, failures and native PNG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-v41-selective-native-endpoints-evidence
          path: ${{ runner.temp }}/engine001-v41
          if-no-files-found: warn
