name: ENGINE-001 V36 native source colored contours after fill

on:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - ".github/workflows/engine001-source-color-contour-native-v36.yml"
      - "AutoDraw_Stage20/tests/run_engine001_source_color_contour_native_v36.py"
      - "AutoDraw_Stage20/tests/test_engine001_source_color_contour_v36.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  real-egret-source-color-contours:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned-range previously proven native tools
        run: python -m pip install "selenium>=4,<5" "numpy>=2,<3" "opencv-python-headless>=4.10,<5" "Pillow>=11,<13" "scikit-image>=0.25,<0.27" "scipy>=1.13,<2"
      - name: Download frozen native V35 pilot2 from successful run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/v35"
          gh run download 43742747278 --repo Kiddos19882/AutoDraw -n engine001-v35-pilot2-native-paint-then-detail-evidence -D "$RUNNER_TEMP/v35"
      - name: Validate native Egret and source-color candidate A/B/C
        shell: bash
        run: |
          node --check AutoDraw_Stage20/tests/game_renderer_reference.js
          node --test AutoDraw_Stage20/tests/game_renderer_reference.test.js
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_source_color_contour_v36.py -v
          python -m py_compile AutoDraw_Stage20/tests/run_engine001_source_color_contour_native_v36.py
          python AutoDraw_Stage20/tests/run_engine001_source_color_contour_native_v36.py \
            --workspace . \
            --source AutoDraw_Stage20/testImages/wV6VeZI9S1Y.png \
            --v35-archive "$RUNNER_TEMP/v35" \
            --output "$RUNNER_TEMP/engine001-v36"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"engine001-v36"
          r=json.loads((root/"report.json").read_text(encoding="utf-8"))
          assert r["experiment"]=="ENGINE001_SOURCE_COLOR_CONTOUR_V36"
          assert r["v35_control_pixel_exact"] and r["same_native_alpha_all_variants"]
          assert all(hashlib.sha256((root/n).read_bytes()).hexdigest()==h
                     for n,h in r["artifact_sha256"].items())
          assert r["quality_accepted"] is False and r["game_exact_CHALK"] is None
          print("V36 native source-color diagnostic captured; no production claims")
          PY
      - name: Preserve real Egret A B C and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-v36-native-source-colored-contours-evidence
          path: ${{ runner.temp }}/engine001-v36
          if-no-files-found: warn
