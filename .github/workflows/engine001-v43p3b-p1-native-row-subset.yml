name: ENGINE-001 V43P3b P1 native ink row-intersection subset

on:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - ".github/workflows/engine001-v43p3b-p1-native-row-subset.yml"
      - "AutoDraw_Stage20/tests/run_engine001_v43p3b_p1_native_row_subset.py"
      - "AutoDraw_Stage20/tests/test_engine001_v43p3b_p1_native_row_subset.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-row-intersection:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned-family Egret analysis tools
        run: python -m pip install "selenium>=4,<5" "numpy>=2,<3" "opencv-python-headless>=4.10,<5" "Pillow>=11,<13" "scikit-image>=0.25,<0.27" "scipy>=1.13,<2"
      - name: Download immutable V37-P2 native fill and V43-P3a3 candidate ink
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/v37p2" "$RUNNER_TEMP/p3a3"
          gh run download 43747149144 --repo Kiddos19882/AutoDraw -n engine001-v37p2-native-full-contour-fill-color-evidence -D "$RUNNER_TEMP/v37p2"
          gh run download 43864508620 --repo Kiddos19882/AutoDraw -n engine001-v43p3a3-isolated-native-footprint-evidence -D "$RUNNER_TEMP/p3a3"
      - name: P0/P1 subset unit and original Node renderer regressions
        shell: bash
        run: |
          python -m py_compile AutoDraw_Stage20/tests/run_engine001_v43p3b_native_subset.py AutoDraw_Stage20/tests/run_engine001_v43p3b_p1_native_row_subset.py
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_v43p3b_native_subset.py -v
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_v43p3b_p1_native_row_subset.py -v
          node --check AutoDraw_Stage20/tests/game_renderer_reference.js
          node --test AutoDraw_Stage20/tests/game_renderer_reference.test.js
      - name: Compare per-stroke real Egret ink at original ranked source rows
        shell: bash
        run: |
          python AutoDraw_Stage20/tests/run_engine001_v43p3b_p1_native_row_subset.py \
            --workspace . \
            --source AutoDraw_Stage20/testImages/wV6VeZI9S1Y.png \
            --v37p2-archive "$RUNNER_TEMP/v37p2" \
            --p3a3-archive "$RUNNER_TEMP/p3a3" \
            --output "$RUNNER_TEMP/engine001-v43p3b-p1"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"engine001-v43p3b-p1"
          r=json.loads((root/"report.json").read_text(encoding="utf-8"))
          assert r["experiment"]=="ENGINE001_V43P3B_P1_NATIVE_ROW_INTERSECTION"
          assert r["widths"]==[4,6,10]
          assert 1<=r["native_original_strokes_rendered"]<=36
          assert r["full_original_paint_strokes_removed"]==0
          assert r["new_oriented_paint_strokes_added_to_full_scene"]==0
          assert r["original_V44B_410_contour_strokes_modified"] is False
          assert r["game_exact_CHALK"] is None
          assert r["full_image_A_B_visual"]=="NOT_RUN"
          assert all(len(row["native_old_stroke_evidence"])<=12 for row in r["per_width"].values())
          assert all(hashlib.sha256((root/file).read_bytes()).hexdigest()==value
                     for file,value in r["report_linked_SHA256"].items())
          print("P1 native row-intersection evidence complete; full image NOT_RUN")
          PY
      - name: Preserve native per-stroke PNGs, negative cases, and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-v43p3b-p1-native-row-intersection-evidence
          path: ${{ runner.temp }}/engine001-v43p3b-p1
          if-no-files-found: warn
