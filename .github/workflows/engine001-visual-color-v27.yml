name: ENGINE-001 V27 colored visual diagnostic ROI gates

on:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - ".github/workflows/engine001-visual-color-v27.yml"
      - "AutoDraw_Stage20/tests/run_engine001_visual_color_v27.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compare-existing-color-planners:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned-compatible processing dependencies
        run: python -m pip install "numpy>=2,<3" "opencv-python-headless>=4.10,<5" "Pillow>=11,<13" "scikit-image>=0.25,<0.27" "scipy>=1.13,<2"
      - name: Download genuine frozen AniLines V14, V18 and V20 source previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/v14" "$RUNNER_TEMP/v18" "$RUNNER_TEMP/v20"
          gh run download 43653371987 --repo Kiddos19882/AutoDraw -n engine001-v14-anilines-detail -D "$RUNNER_TEMP/v14"
          gh run download 43677851946 --repo Kiddos19882/AutoDraw -n engine001-v18-anilines-junction-ab -D "$RUNNER_TEMP/v18"
          gh run download 43682497864 --repo Kiddos19882/AutoDraw -n engine001-v20-owner-guarded-short-recovery -D "$RUNNER_TEMP/v20"
          python - <<'PY'
          from pathlib import Path
          import hashlib,os
          b=Path(os.environ["RUNNER_TEMP"])
          assert hashlib.sha256((b/"v14"/"line-output.png").read_bytes()).hexdigest()=="2d4220381e18a86400e4afa950caa064ada5fe1adc821c9a230239cb91848f3b"
          assert hashlib.sha256((b/"v18"/"B-roi.png").read_bytes()).hexdigest()=="e2c604a31556b0414a451e36d6b7d2aa66cf01c65a36c4a31d3f9d601a3f1adf"
          assert hashlib.sha256((b/"v20"/"v20-three-panel.png").read_bytes()).hexdigest()=="8329081964a60399e8ed626384f5671f8e3e80ab716519810c33f4aa926804a5"
          print("Frozen visual source input SHA guard PASS")
          PY
      - name: Render existing Stage20 color plans on pinned 460x240 board
        run: |
          python AutoDraw_Stage20/tests/run_engine001_visual_color_v27.py \
            --source AutoDraw_Stage20/testImages/wV6VeZI9S1Y.png \
            --anilines "$RUNNER_TEMP/v14/line-output.png" \
            --v18-roi "$RUNNER_TEMP/v18/B-roi.png" \
            --v20-panel "$RUNNER_TEMP/v20/v20-three-panel.png" \
            --output "$RUNNER_TEMP/engine001-v27"
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"engine001-v27"
          d=json.loads((root/"report.json").read_text())
          assert d["source_sha256"]=="07cc4568cb5e90d9514bc6f6c2112fee623f87f8fd0cea02fa517b04108e502a"
          assert set(d["modes"])=={"scanline","contour","skeleton"}
          assert d["roi_gate_overall"] in ("PASS","FAIL")
          assert all(x["roi_gate"] in ("PASS","FAIL") and x["outside_source_roi_alpha_pixels"]>=0 for x in d["modes"].values())
          assert all(d["modes"][k]["stroke_count"]>0 for k in d["modes"])
          assert all(hashlib.sha256((root/name).read_bytes()).hexdigest()==sha
                     for name,sha in d["artifacts_sha256"].items())
          print("V27 color-preview diagnostic reproducibility PASS (ROI gate may separately FAIL)")
          PY
      - name: Preserve actual color plan and comparative PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-v27-existing-color-plans-visual-evidence
          path: ${{ runner.temp }}/engine001-v27
          if-no-files-found: warn
