name: ENGINE-001 V28 ROI-only palette recognition and quota

on:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - ".github/workflows/engine001-visual-roi-palette-v28.yml"
      - "AutoDraw_Stage20/tests/run_engine001_visual_roi_palette_v28.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  four-fixed-existing-color-plans:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install processing dependencies
        run: python -m pip install "numpy>=2,<3" "opencv-python-headless>=4.10,<5" "Pillow>=11,<13" "scikit-image>=0.25,<0.27" "scipy>=1.13,<2"
      - name: Retrieve frozen V27 actual Stage20 scanline baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/v27"
          gh run download 43687584670 --repo Kiddos19882/AutoDraw -n engine001-v27-existing-color-plans-visual-evidence -D "$RUNNER_TEMP/v27"
      - name: Compare four immutable palette variants with same existing scanline planner
        run: |
          python AutoDraw_Stage20/tests/run_engine001_visual_roi_palette_v28.py \
            --source AutoDraw_Stage20/testImages/wV6VeZI9S1Y.png \
            --frozen-a "$RUNNER_TEMP/v27/scanline-roi.png" \
            --output "$RUNNER_TEMP/engine001-v28"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"engine001-v28"
          r=json.loads((root/"report.json").read_text())
          assert set(r["modes"])=={"A-full-canvas8","B-source-roi8","C-source-roi6","D-roi8-skipwhite"}
          assert all(m["roi_gate"]=="PASS" and m["stroke_count"]>0 for m in r["modes"].values())
          assert all(hashlib.sha256((root/f).read_bytes()).hexdigest()==sha for f,sha in r["derived_sha256"].items())
          print("V28 E3 fixed-palette existing Stage20 color-plan diagnostic PASS; not game")
          PY
      - name: Preserve genuine plan JSONs and complete visual comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-v28-roi-palette-visual-evidence
          path: ${{ runner.temp }}/engine001-v28
          if-no-files-found: warn
