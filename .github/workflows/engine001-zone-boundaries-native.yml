name: ENGINE-001 original source color-zone boundaries real Egret

on:
  push:
    branches: [feature/image-geometry-optimization]
    paths:
      - ".github/workflows/engine001-zone-boundaries-native.yml"
      - "AutoDraw_Stage20/tests/run_engine001_color_zone_boundaries_native.py"
      - "AutoDraw_Stage20/tests/test_engine001_color_zone_boundaries_native.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: engine001-zone-boundaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-color-zones-egret:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing source and Egret renderer dependencies
        run: python -m pip install "selenium>=4,<5" "numpy>=2,<3" "opencv-python-headless>=4.10,<5" "Pillow>=11,<13" "scikit-image>=0.25,<0.27" "scipy>=1.13,<2"
      - name: Download frozen original V44-B Egret contours
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/v44"
          gh run download 43813812976 --repo Kiddos19882/AutoDraw -n engine001-v44-adaptive-contour-native-evidence -D "$RUNNER_TEMP/v44"
      - name: Validate source zone geometry and native Egret JS
        shell: bash
        run: |
          python -m py_compile AutoDraw_Stage20/tests/run_engine001_color_zone_boundaries_native.py
          python -m unittest discover -s AutoDraw_Stage20/tests -p test_engine001_color_zone_boundaries_native.py -v
          node --check AutoDraw_Stage20/tests/game_renderer_reference.js
          node --test AutoDraw_Stage20/tests/game_renderer_reference.test.js
      - name: Render all four color-zone boundaries via original Egret BoardPane
        shell: bash
        run: |
          python AutoDraw_Stage20/tests/run_engine001_color_zone_boundaries_native.py \
            --workspace . \
            --source AutoDraw_Stage20/testImages/wV6VeZI9S1Y.png \
            --v44-archive "$RUNNER_TEMP/v44" \
            --output "$RUNNER_TEMP/egret-source-zone-boundaries"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"egret-source-zone-boundaries"
          r=json.loads((root/"report.json").read_text(encoding="utf-8"))
          g=r["zones"]
          assert r["status"]=="REAL_EGRET_E3_COLOR_ZONE_CONTOUR_DIAGNOSTIC"
          assert r["source_sha256"]=="07cc4568cb5e90d9514bc6f6c2112fee623f87f8fd0cea02fa517b04108e502a"
          assert r["no_color_fill"] and r["all_zone_source_contours_included"]
          assert 1<=g["total_paths"]<=3000
          assert g["total_synthetic_vertices_NOT_CHALK"]<=5900
          assert set(g["per_owner"])=={"4","5","6","7"}
          assert r["exact_game_CHALK"] is None and r["production_accepted"] is False
          for file, sha in r["report_linked_SHA256"].items():
              assert hashlib.sha256((root/file).read_bytes()).hexdigest()==sha
          print("Real Egret source zone outlines",g["total_paths"],
                "vertices",g["total_synthetic_vertices_NOT_CHALK"])
          print("Images:",root/"egret-zones-only-600x960.png",
                root/"egret-zones-and-v44-outline-600x960.png")
          PY
        env:
          RUNNER_TEMP: ${{ runner.temp }}
      - name: Archive original real Egret images, all paths and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine001-source-zones-only-egret-evidence
          path: ${{ runner.temp }}/egret-source-zone-boundaries
          if-no-files-found: warn
          retention-days: 30
