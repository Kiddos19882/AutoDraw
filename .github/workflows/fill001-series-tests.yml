name: AutoDraw FILL-001 configurable series safety tests

on:
  push:
    branches:
      - feature/image-geometry-optimization
    paths:
      - ".github/workflows/fill001-series-tests.yml"
      - "AutoDraw_Stage20/source/preparation/fill001_series_runner.py"
      - "AutoDraw_Stage20/source/preparation/fill001_series_run_binding.py"
      - "AutoDraw_Stage20/source/preparation/fill001_series_stage6_preflight.py"
      - "AutoDraw_Stage20/source/preparation/fill001_series_stage6_execution.py"
      - "AutoDraw_Stage20/source/preparation/fill001_v5_live_gate.py"
      - "AutoDraw_Stage20/source/preparation/chalk_fill_ui.py"
      - "AutoDraw_Stage20/source/executor/stage6_execute_plan.py"
      - "AutoDraw_Stage20/integrated_app.py"
      - "AutoDraw_Stage20/source/preparation/fill001_firefox_auto_probe.py"
      - "AutoDraw_Stage20/source/preparation/calibrated_game_clear.py"
      - "AutoDraw_Stage20/source/preparation/brush_calibration.py"
      - "AutoDraw_Stage20/source/preparation/brush_calibration_ui.py"
      - "AutoDraw_Stage20/source/preparation/brush_behavior_test_ui.py"
      - "AutoDraw_Stage20/source/preparation/fill001_series_engine001_clear.py"
      - "AutoDraw_Stage20/source/preparation/fill001_series_offline_plans.py"
      - "AutoDraw_Stage20/source/preparation/fill001_series_statistics.py"
      - "AutoDraw_Stage20/source/preparation/fill001_series_handoff.py"
      - "AutoDraw_Stage20/source/preparation/fill001_series_clear_pilot.py"
      - "AutoDraw_Stage20/source/preparation/fill001_series_blank_verification.py"
      - "AutoDraw_Stage20/source/preparation/tests/test_fill001_series_runner.py"
      - "AutoDraw_Stage20/source/preparation/tests/test_fill001_series_run_binding.py"
      - "AutoDraw_Stage20/source/preparation/tests/test_fill001_series_stage6_preflight.py"
      - "AutoDraw_Stage20/source/preparation/tests/test_fill001_series_stage6_execution.py"
      - "AutoDraw_Stage20/source/preparation/tests/test_fill001_v5_live_gate.py"
      - "AutoDraw_Stage20/source/preparation/tests/test_fill001_series_firefox_probe.py"
      - "AutoDraw_Stage20/source/preparation/tests/test_calibrated_game_clear.py"
      - "AutoDraw_Stage20/source/preparation/tests/test_brush_calibration.py"
      - "AutoDraw_Stage20/source/preparation/tests/test_brush_behavior_test_ui.py"
      - "AutoDraw_Stage20/source/preparation/tests/test_fill001_series_engine001_clear.py"
      - "AutoDraw_Stage20/source/preparation/tests/test_fill001_series_offline_plans.py"
      - "AutoDraw_Stage20/source/preparation/tests/test_fill001_series_statistics.py"
      - "AutoDraw_Stage20/source/preparation/tests/test_fill001_series_handoff.py"
      - "AutoDraw_Stage20/source/preparation/tests/test_fill001_series_clear_pilot.py"
      - "AutoDraw_Stage20/source/preparation/tests/test_fill001_series_blank_verification.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  series-contract:
    name: Offline series controls and fail-closed regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: AutoDraw_Stage20/source/preparation
    env:
      PYTHONPATH: ${{ github.workspace }}/AutoDraw_Stage20:${{ github.workspace }}/AutoDraw_Stage20/source/executor:${{ github.workspace }}/AutoDraw_Stage20/source/preparation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline audit dependencies
        run: python -m pip install pytest numpy pillow opencv-python-headless
      - name: Run synthetic-only serial orchestration tests
        run: python -m pytest -q -ra tests/test_fill001_series_runner.py tests/test_fill001_series_blank_verification.py tests/test_fill001_series_offline_plans.py tests/test_fill001_series_statistics.py tests/test_fill001_series_handoff.py tests/test_fill001_series_clear_pilot.py tests/test_calibrated_game_clear.py tests/test_brush_calibration.py tests/test_fill001_series_engine001_clear.py tests/test_fill001_series_firefox_probe.py tests/test_fill001_firefox_auto_probe.py tests/test_fill001_series_run_binding.py tests/test_fill001_series_stage6_preflight.py tests/test_fill001_series_stage6_execution.py tests/test_fill001_v5_live_gate.py
      # Native-pointer GUI tests run in the Windows AutoDraw validation job.
      # This Linux job has no display or pyautogui and tests the pure Bridge
      # ring-buffer witness gate instead (also included in the main suite).
      - name: Run capped Bridge ring-buffer freshness regressions
        run: python -m pytest -q -ra tests/test_fill001_firefox_auto_probe.py -k "recent_samples"
      - name: Diagnose frozen third FILL001 run binding (read-only, large JSON)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from fill001_series_run_binding import validate_series_bridge_runs

          root = Path.cwd().parents[1] / "data/results/brush_behavior_tests"
          session = "8b06c144-eefa-4fe0-9547-4666914f95a6"
          rid = "fill001-series-8fab4b476a8b"
          raw = root / "game_monitor_bridge" / session / "game-monitor-run-20261112T173957581641Z-3610a9f1.json"
          report = root / "fill001/series" / (rid + "-runs") / "stage6/series-8166be22-858b-4c56-9fb0-b5eb740771f8/report.json"
          print("FROZEN_CASE", rid, "raw_bytes", raw.stat().st_size, "report_bytes", report.stat().st_size, flush=True)
          run = json.loads(raw.read_text(encoding="utf-8"))
          request = json.loads(report.read_text(encoding="utf-8"))["request"]
          exact = ("schema_version", "record_type", "session_id", "execution_status",
                   "monitor_dropped_events", "monitor_error_count", "collector_sequence_gap_count",
                   "bridge_send_failures_delta", "point_delta_matches_chalk", "monitor_errors")
          expected = (1, "autodraw_game_monitor_run", session, "completed", 0, 0, 0, 0, True, [])
          for field, target in zip(exact, expected):
              value = run.get(field)
              if field == "session_id":
                  value = "<expected-session>" if value == session else "<other-session>"
              print("INITIAL_GATE", field, "PASS" if run.get(field) == target else "FAIL",
                    "observed", value, flush=True)
          print("COUNTS", json.dumps({
              "run_id": run.get("run_id"),
              "events": len(run["events"]) if isinstance(run.get("events"), list) else None,
              "event_count": run.get("event_count"),
              "per_stroke_metrics": len(run["per_stroke_metrics"]) if isinstance(run.get("per_stroke_metrics"), list) else None,
              "stroke_count": run.get("stroke_count"),
              "stroke_candidate_count": run.get("stroke_candidate_count"),
              "non_consuming_stroke_candidate_count": run.get("non_consuming_stroke_candidate_count"),
              "chalk": run.get("chalk"),
              "pre": run.get("pre_test_snapshot"),
              "post": run.get("post_test_snapshot"),
          }, ensure_ascii=False, default=str), flush=True)
          try:
              binding = validate_series_bridge_runs(
                  [run], session_id=session,
                  task_id=request["task_id"],
                  expected_pointer_down_client=request["expected_pointer_down_client"][:161],
                  expected_brush_radii=request["expected_brush_radii"][:161],
                  board_client_rect=request["board_client_rect"],
                  slider_client_corridor=request["slider_client_corridor"],
                  expected_pre=1,
              )
          except ValueError as exc:
              print("EXACT_VALIDATOR_BLOCKED", type(exc).__name__, str(exc), flush=True)
          else:
              print("EXACT_VALIDATOR_PASS", json.dumps({
                  "status": binding["status"],
                  "stroke_count": binding["stroke_count"],
                  "exact_chalk": binding["exact_chalk"],
                  "post_pointCount": binding["post_pointCount"],
              }), flush=True)
          PY
      - name: Syntax-check existing FILL-001 UI and series module
        run: python -m py_compile brush_calibration.py brush_calibration_ui.py brush_behavior_test_ui.py chalk_fill_ui.py fill001_series_runner.py fill001_series_blank_verification.py fill001_series_offline_plans.py fill001_series_statistics.py fill001_series_handoff.py fill001_series_clear_pilot.py calibrated_game_clear.py fill001_series_engine001_clear.py fill001_series_run_binding.py fill001_series_stage6_preflight.py fill001_series_stage6_execution.py fill001_v5_live_gate.py ../executor/stage6_execute_plan.py ../../integrated_app.py fill001_firefox_auto_probe.py
      - name: Smoke-test offline 2-cycle manifest
        run: |
          python fill001_series_runner.py --cycles 2 --figures-per-cycle 3 --output "${RUNNER_TEMP}/series-manifest.json"
      - name: Smoke-test complete frozen shape/method/radius matrix offline
        run: |
          python fill001_series_runner.py --cycles 3 --figures-per-cycle 10 --output "${RUNNER_TEMP}/full-manifest.json"
          python fill001_series_offline_plans.py --manifest "${RUNNER_TEMP}/full-manifest.json" --output "${RUNNER_TEMP}/full-geometry.json"
