name: AutoDraw FILL-001 configurable series safety tests

on:
  push:
    branches:
      - feature/image-geometry-optimization
    paths:
      - ".github/workflows/fill001-series-tests.yml"
      - "AutoDraw_Stage20/source/preparation/fill001_series_runner.py"
      - "AutoDraw_Stage20/source/preparation/fill001_series_run_binding.py"
      - "AutoDraw_Stage20/source/preparation/fill001_series_stage6_preflight.py"
      - "AutoDraw_Stage20/source/preparation/fill001_series_stage6_execution.py"
      - "AutoDraw_Stage20/source/preparation/fill001_v5_live_gate.py"
      - "AutoDraw_Stage20/source/preparation/chalk_fill_ui.py"
      - "AutoDraw_Stage20/source/executor/stage6_execute_plan.py"
      - "AutoDraw_Stage20/integrated_app.py"
      - "AutoDraw_Stage20/source/preparation/fill001_firefox_auto_probe.py"
      - "AutoDraw_Stage20/source/preparation/calibrated_game_clear.py"
      - "AutoDraw_Stage20/source/preparation/fill001_series_engine001_clear.py"
      - "AutoDraw_Stage20/source/preparation/fill001_series_offline_plans.py"
      - "AutoDraw_Stage20/source/preparation/fill001_series_statistics.py"
      - "AutoDraw_Stage20/source/preparation/fill001_series_handoff.py"
      - "AutoDraw_Stage20/source/preparation/fill001_series_clear_pilot.py"
      - "AutoDraw_Stage20/source/preparation/fill001_series_blank_verification.py"
      - "AutoDraw_Stage20/source/preparation/tests/test_fill001_series_runner.py"
      - "AutoDraw_Stage20/source/preparation/tests/test_fill001_series_run_binding.py"
      - "AutoDraw_Stage20/source/preparation/tests/test_fill001_series_stage6_preflight.py"
      - "AutoDraw_Stage20/source/preparation/tests/test_fill001_series_stage6_execution.py"
      - "AutoDraw_Stage20/source/preparation/tests/test_fill001_v5_live_gate.py"
      - "AutoDraw_Stage20/source/preparation/tests/test_fill001_series_firefox_probe.py"
      - "AutoDraw_Stage20/source/preparation/tests/test_calibrated_game_clear.py"
      - "AutoDraw_Stage20/source/preparation/tests/test_fill001_series_engine001_clear.py"
      - "AutoDraw_Stage20/source/preparation/tests/test_fill001_series_offline_plans.py"
      - "AutoDraw_Stage20/source/preparation/tests/test_fill001_series_statistics.py"
      - "AutoDraw_Stage20/source/preparation/tests/test_fill001_series_handoff.py"
      - "AutoDraw_Stage20/source/preparation/tests/test_fill001_series_clear_pilot.py"
      - "AutoDraw_Stage20/source/preparation/tests/test_fill001_series_blank_verification.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  series-contract:
    name: Offline series controls and fail-closed regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: AutoDraw_Stage20/source/preparation
    env:
      PYTHONPATH: ${{ github.workspace }}/AutoDraw_Stage20:${{ github.workspace }}/AutoDraw_Stage20/source/executor:${{ github.workspace }}/AutoDraw_Stage20/source/preparation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline audit dependencies
        run: python -m pip install pytest numpy pillow opencv-python-headless
      - name: Run synthetic-only serial orchestration tests
        run: python -m pytest -q -ra tests/test_fill001_series_runner.py tests/test_fill001_series_blank_verification.py tests/test_fill001_series_offline_plans.py tests/test_fill001_series_statistics.py tests/test_fill001_series_handoff.py tests/test_fill001_series_clear_pilot.py tests/test_calibrated_game_clear.py tests/test_fill001_series_engine001_clear.py tests/test_fill001_series_firefox_probe.py tests/test_fill001_firefox_auto_probe.py tests/test_fill001_series_run_binding.py tests/test_fill001_series_stage6_preflight.py tests/test_fill001_series_stage6_execution.py tests/test_fill001_v5_live_gate.py
      - name: Syntax-check existing FILL-001 UI and series module
        run: python -m py_compile chalk_fill_ui.py fill001_series_runner.py fill001_series_blank_verification.py fill001_series_offline_plans.py fill001_series_statistics.py fill001_series_handoff.py fill001_series_clear_pilot.py calibrated_game_clear.py fill001_series_engine001_clear.py fill001_series_run_binding.py fill001_series_stage6_preflight.py fill001_series_stage6_execution.py fill001_v5_live_gate.py ../executor/stage6_execute_plan.py ../../integrated_app.py fill001_firefox_auto_probe.py
      - name: Smoke-test offline 2-cycle manifest
        run: |
          python fill001_series_runner.py --cycles 2 --figures-per-cycle 3 --output "${RUNNER_TEMP}/series-manifest.json"
      - name: Smoke-test complete frozen shape/method/radius matrix offline
        run: |
          python fill001_series_runner.py --cycles 3 --figures-per-cycle 10 --output "${RUNNER_TEMP}/full-manifest.json"
          python fill001_series_offline_plans.py --manifest "${RUNNER_TEMP}/full-manifest.json" --output "${RUNNER_TEMP}/full-geometry.json"
