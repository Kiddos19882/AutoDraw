name: Geometry planner tests

on:
  push:
    branches:
      - feature/image-geometry-optimization
  pull_request:
    paths:
      - "AutoDraw_Stage20/source/preparation/**"
      - "AutoDraw_Stage20/source/executor/**"
      - "AutoDraw_Stage20/integrated_app.py"
      - "AutoDraw_Stage20/tests/**"
      - "AutoDraw_Stage20/data/calibration/**"
      - "AutoDraw_Stage20/BROWSER_POINT_CALIBRATION.md"
      - "AutoDraw_Stage20/build_windows.bat"
      - "AutoDraw_Stage20/build_windows.py"
      - "AutoDraw_Stage20/app_features.json"
      - "AutoDraw_Stage20/run_all_tests.py"
      - "AutoDraw_Stage20/requirements-build.txt"
      - "AutoDraw_Stage20/requirements-runtime.txt"
      - "AutoDraw_Stage20/README.md"
      - "AutoDraw_Stage20/PROJECT_GUIDE.md"
      - "AutoDraw_Stage20/README.txt"
      - ".github/workflows/geometry-tests.yml"
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry-tests:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: AutoDraw_Stage20/source/preparation
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r ..\executor\requirements.txt pytest
      - name: Diagnose reference image from master
        shell: pwsh
        run: |
          git fetch origin master --depth=1
          python ..\..\tests\diagnose_reference_image.py --git-ref origin/master --git-path AutoDraw_Stage20/testImages/images.png --target-width 646 --target-height 323 --fit-mode contain
      - name: Report confirmed game point calibration
        run: python ..\..\tests\report_game_point_calibration.py

      - name: Benchmark drawing algorithms (Stage 5)
        shell: pwsh
        run: |
          python ..\..\tests\benchmark_drawing_algorithms.py --git-ref origin/master --git-path AutoDraw_Stage20/testImages/images.png --target-width 646 --target-height 323 --palette-json AutoDraw_Stage20/data/palettes/profiles/Browser_palette.autodraw-palette.json --background-mode edge-connected --target-usage-percent 75 --output AutoDraw_Stage20/benchmark-results/stage5-report.json --preview-dir AutoDraw_Stage20/benchmark-results/previews
      - name: Upload Stage 5 benchmark report and previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage5-drawing-algorithm-benchmark
          path: AutoDraw_Stage20/benchmark-results/
          if-no-files-found: ignore

      - name: Benchmark interior fill (Stage 7)
        shell: pwsh
        run: |
          python ..\..\tests\benchmark_stage7_interior_fill.py --git-ref HEAD --git-path AutoDraw_Stage20/testImages/images.png --target-width 646 --target-height 323 --palette-json AutoDraw_Stage20/data/palettes/profiles/Browser_palette.autodraw-palette.json --background-mode edge-connected --output AutoDraw_Stage20/benchmark-results/stage7-report.json --preview-dir AutoDraw_Stage20/benchmark-results/stage7-previews
      - name: Upload Stage 7 benchmark report and previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-interior-fill-benchmark
          path: AutoDraw_Stage20/benchmark-results/stage7-*
          if-no-files-found: ignore
      - name: Generate deterministic synthetic geometry cases
        shell: pwsh
        run: |
          $fixtureDir = Join-Path $env:GITHUB_WORKSPACE "AutoDraw_Stage20/benchmark-results/stage7-synthetic-inputs"
          python ..\..\tests\generate_stage7_synthetic_cases.py --output-dir $fixtureDir
      - name: Benchmark Stage 7 on synthetic geometry cases
        shell: pwsh
        run: |
          $fixtureDir = Join-Path $env:GITHUB_WORKSPACE "AutoDraw_Stage20/benchmark-results/stage7-synthetic-inputs"
          Get-ChildItem $fixtureDir -Filter *.png | ForEach-Object {
            $name = [System.IO.Path]::GetFileNameWithoutExtension($_.Name)
            python ..\..\tests\benchmark_stage7_interior_fill.py --image-file $_.FullName --target-width 646 --target-height 323 --palette-json AutoDraw_Stage20/data/palettes/profiles/Browser_palette.autodraw-palette.json --background-mode edge-connected --output "AutoDraw_Stage20/benchmark-results/stage7-synthetic/$name-report.json" --preview-dir "AutoDraw_Stage20/benchmark-results/stage7-synthetic/$name-previews"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $reportDir = Join-Path $env:GITHUB_WORKSPACE "AutoDraw_Stage20/benchmark-results/stage7-synthetic"
          python ..\..\tests\validate_stage7_synthetic_reports.py --report-dir $reportDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sweep fallback merge tolerances (Stage 7)
        shell: pwsh
        run: |
          $reportDir = Join-Path $env:GITHUB_WORKSPACE "AutoDraw_Stage20/benchmark-results/stage7-synthetic"
          python ..\..\tests\benchmark_stage7_fallback_merge_sweep.py --output (Join-Path $reportDir "fallback-merge-gap-sweep.json")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Stage 7 synthetic geometry reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-synthetic-geometry-benchmarks
          path: AutoDraw_Stage20/benchmark-results/stage7-synthetic/
          if-no-files-found: error

      - name: Benchmark Stage 8 geometry budget and preview quality
        shell: pwsh
        run: |
          python ..\\..\\tests\\benchmark_stage8_geometry_budget.py --git-ref origin/master --git-path AutoDraw_Stage20/testImages/images.png --target-width 646 --target-height 323 --palette-json AutoDraw_Stage20/data/palettes/profiles/Browser_palette.autodraw-palette.json --board-item-type BoardItem2 --target-usage-percent 75 --output AutoDraw_Stage20/benchmark-results/stage8/report.json --artifact-dir AutoDraw_Stage20/benchmark-results/stage8/cases
      - name: Validate Stage 8 budget and quality report
        shell: pwsh
        run: |
          python ..\\..\\tests\\validate_stage8_geometry_budget_report.py --report AutoDraw_Stage20/benchmark-results/stage8/report.json
      - name: Upload Stage 8 geometry budget reports and previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage8-geometry-budget-quality
          path: AutoDraw_Stage20/benchmark-results/stage8/
          if-no-files-found: ignore

      - name: Test fallback sweep path and coverage metrics
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\AutoDraw_Stage20;$env:GITHUB_WORKSPACE\AutoDraw_Stage20\source\preparation"
          python -m pytest -q -ra ..\..\tests\test_fallback_sweep_metrics.py

      - name: Test experimental outline-first fill planner
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\AutoDraw_Stage20;$env:GITHUB_WORKSPACE\AutoDraw_Stage20\source\preparation"
          python -m pytest -q -ra tests/test_outline_first_fill_planner.py

      - name: Compare outline-first and interior-fill strategies
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\AutoDraw_Stage20;$env:GITHUB_WORKSPACE\AutoDraw_Stage20\source\preparation"
          $comparisonReport = Join-Path $env:GITHUB_WORKSPACE "AutoDraw_Stage20/benchmark-results/outline-first-comparison.json"
          python ..\..\tests\benchmark_outline_first_fill.py --output $comparisonReport
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $comparisonReport)) {
            Write-Error "Outline-first comparison report was not created: $comparisonReport"
            exit 1
          }

      - name: Upload outline-first comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outline-first-fill-comparison
          path: AutoDraw_Stage20/benchmark-results/outline-first-comparison.json
          if-no-files-found: error

      - name: Run preparation and geometry tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\AutoDraw_Stage20;$env:GITHUB_WORKSPACE\AutoDraw_Stage20\source\preparation;$env:GITHUB_WORKSPACE\AutoDraw_Stage20\source\executor"
          python -m pytest -q -ra tests

      - name: Test Stage 7 validator tolerance boundaries
        run: python -m pytest -q -ra ..\..\tests\test_stage7_validator_rules.py

      - name: Run import resolution baseline diagnostics
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\AutoDraw_Stage20;$env:GITHUB_WORKSPACE\AutoDraw_Stage20\source\preparation;$env:GITHUB_WORKSPACE\AutoDraw_Stage20\source\executor"
          python ..\..\tests\test_import_resolution_diagnostics.py

      - name: Run unified-app UI regressions
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\AutoDraw_Stage20;$env:GITHUB_WORKSPACE\AutoDraw_Stage20\source\preparation;$env:GITHUB_WORKSPACE\AutoDraw_Stage20\source\executor"
          python -m pytest -q -ra ..\..\tests\test_unified_app.py

  executor-tests:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: AutoDraw_Stage20/source/executor
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install executor test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r ..\preparation\requirements.txt pytest
      - name: Run executor regression tests
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\AutoDraw_Stage20;$env:GITHUB_WORKSPACE\AutoDraw_Stage20\source\preparation;$env:GITHUB_WORKSPACE\AutoDraw_Stage20\source\executor;$env:GITHUB_WORKSPACE\AutoDraw_Stage20\source\executor\tests"
          python -m unittest discover -s tests -v

  windows-build-smoke:
    name: Windows portable build and startup smoke-test
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: AutoDraw_Stage20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build portable application and run its smoke-test
        shell: cmd
        env:
          AUTODRAW_NO_PAUSE: "1"
        run: build_windows.bat
