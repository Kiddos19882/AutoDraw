name: Geometry planner tests

on:
  push:
    branches:
      - feature/image-geometry-optimization
  pull_request:
    paths:
      - "AutoDraw_Stage20/source/preparation/**"
      - "AutoDraw_Stage20/source/executor/**"
      - "AutoDraw_Stage20/integrated_app.py"
      - "AutoDraw_Stage20/tests/**"
      - ".github/workflows/geometry-tests.yml"
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry-tests:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: AutoDraw_Stage20/source/preparation
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r ..\executor\requirements.txt pytest
      - name: Diagnose reference image from master
        shell: pwsh
        run: |
          git fetch origin master --depth=1
          python ..\..\tests\diagnose_reference_image.py --git-ref origin/master --git-path AutoDraw_Stage20/testImages/images.png --target-width 646 --target-height 323 --fit-mode contain
      - name: Report confirmed game point calibration
        run: python ..\..\tests\report_game_point_calibration.py

      - name: Benchmark drawing algorithms (Stage 5)
        shell: pwsh
        run: |
          python ..\..\tests\benchmark_drawing_algorithms.py --git-ref origin/master --git-path AutoDraw_Stage20/testImages/images.png --target-width 646 --target-height 323 --quantize-colors 8 --background-mode edge-connected --target-usage-percent 75 --output AutoDraw_Stage20/benchmark-results/stage5-report.json --preview-dir AutoDraw_Stage20/benchmark-results/previews
      - name: Upload Stage 5 benchmark report and previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage5-drawing-algorithm-benchmark
          path: AutoDraw_Stage20/benchmark-results/
          if-no-files-found: ignore

      - name: Run preparation and geometry tests
        run: python -m pytest -q -ra tests

      - name: Run unified-app UI regressions
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\AutoDraw_Stage20;$env:GITHUB_WORKSPACE\AutoDraw_Stage20\source\preparation;$env:GITHUB_WORKSPACE\AutoDraw_Stage20\source\executor"
          python -m pytest -q -ra ..\..\tests\test_unified_app.py

  executor-tests:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: AutoDraw_Stage20/source/executor
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install executor test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r ..\preparation\requirements.txt pytest
      - name: Run executor regression tests
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\AutoDraw_Stage20\source\preparation;$env:GITHUB_WORKSPACE\AutoDraw_Stage20\source\executor\tests"
          python -m unittest discover -s tests -v
