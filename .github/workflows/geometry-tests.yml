name: AutoDraw validation

on:
  push:
    branches:
      - feature/image-geometry-optimization
    paths:
      - ".github/workflows/geometry-tests.yml"
      - "AutoDraw_Stage20/source/**"
      - "AutoDraw_Stage20/integrated_app.py"
      - "AutoDraw_Stage20/tests/**"
      - "AutoDraw_Stage20/data/**"
      - "AutoDraw_Stage20/*.py"
      - "AutoDraw_Stage20/BROWSER_POINT_CALIBRATION.md"
      - "AutoDraw_Stage20/build_windows.bat"
      - "AutoDraw_Stage20/build_windows.py"
      - "AutoDraw_Stage20/app_features.json"
      - "AutoDraw_Stage20/run_all_tests.py"
      - "AutoDraw_Stage20/requirements-build.txt"
      - "AutoDraw_Stage20/requirements-runtime.txt"
      - "AutoDraw_Stage20/README.md"
      - "AutoDraw_Stage20/PROJECT_GUIDE.md"
      - "AutoDraw_Stage20/README.txt"
  workflow_dispatch:
    inputs:
      run_algorithm_benchmarks:
        description: Run the long Stage 5/7/8 algorithm benchmark suite
        required: false
        type: boolean
        default: false

concurrency:
  group: autodraw-validation-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  game-monitor-tests:
    name: Game Monitor and bridge tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: AutoDraw_Stage20/source/game_monitor/requirements-smoke.txt
      - name: Check Game Monitor JavaScript syntax
        run: node --check AutoDraw_Stage20/source/game_monitor/game_monitor.js
      - name: Check offline Egret renderer reference harness syntax
        run: node --check AutoDraw_Stage20/tests/game_renderer_reference.js
      - name: Test offline Egret renderer path semantics
        run: node --test AutoDraw_Stage20/tests/game_renderer_reference.test.js
      - name: Test Game Monitor resource snapshot
        run: node --test AutoDraw_Stage20/source/game_monitor/tests/game_monitor.test.js
      - name: Install bridge smoke-test dependencies
        run: python -m pip install -r AutoDraw_Stage20/source/game_monitor/requirements-smoke.txt pytest
      - name: Test local WebSocket smoke server
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\AutoDraw_Stage20\source\game_monitor"
          python -m pytest -q -ra AutoDraw_Stage20/tests/test_websocket_smoke_server.py

  preparation-tests:
    name: Preparation and G3 matrix tests
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: AutoDraw_Stage20/source/preparation
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            AutoDraw_Stage20/source/preparation/requirements.txt
            AutoDraw_Stage20/source/executor/requirements.txt
      - name: Install preparation and executor test dependencies
        run: python -m pip install -r requirements.txt -r ..\executor\requirements.txt pytest
      - name: Run preparation, brush, Game Monitor capture and G3 block tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\AutoDraw_Stage20;$env:GITHUB_WORKSPACE\AutoDraw_Stage20\source\preparation;$env:GITHUB_WORKSPACE\AutoDraw_Stage20\source\executor"
          python -m pytest -q -ra tests
      - name: Benchmark capsule global versus per-segment broad phase
        shell: pwsh
        run: |
          python ..\..\tests\benchmark_capsule_rasterization.py --repeats 7 --output "$env:RUNNER_TEMP\capsule-broad-phase\benchmark.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload capsule broad-phase benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autodraw-capsule-broad-phase-benchmark
          path: ${{ runner.temp }}/capsule-broad-phase/
          if-no-files-found: warn
          retention-days: 14
      - name: Reproduce exhaustive FILL-001-RS static spacing sweep
        shell: pwsh
        run: |
          python ..\..\tests\analyze_chalk_fill001_rs_sweep.py --output "$env:RUNNER_TEMP\fill001-rs-static-sweep\analysis.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload FILL-001-RS static sweep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autodraw-fill001-rs-static-sweep
          path: ${{ runner.temp }}/fill001-rs-static-sweep/
          if-no-files-found: warn
          retention-days: 14

  chalk-png-analysis:
    name: INT-006 pixel-level PNG geometry audit
    needs:
      - preparation-tests
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: AutoDraw_Stage20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: AutoDraw_Stage20/source/preparation/requirements.txt
      - name: Install image-analysis dependencies
        run: python -m pip install -r source/preparation/requirements.txt
      - name: Analyse all INT-006 V1-V5 board captures
        shell: pwsh
        run: |
          python tests\\analyze_chalk_int006_png.py data\\results\\brush_behavior_tests --output-dir "$env:RUNNER_TEMP\\int006-png-analysis" --expected-runs-per-series 9
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload pixel-level metrics and diagnostic images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autodraw-int006-png-analysis
          path: ${{ runner.temp }}/int006-png-analysis/
          if-no-files-found: warn
          retention-days: 14
      - name: Run independent INT-006 CHALK prediction validation
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE/AutoDraw_Stage20/source/preparation"
          python source/preparation/chalk_int006_validation.py --journal data/results/brush_behavior_tests/chalk_test_blocks/chalk-block-INT006-chalk-20261102-232320-7cea27-1f93ddca.json --results-dir data/results/brush_behavior_tests --output "$env:RUNNER_TEMP/int006-chalk-validation/analysis.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload independent INT-006 CHALK validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autodraw-int006-chalk-validation
          path: ${{ runner.temp }}/int006-chalk-validation/
          if-no-files-found: warn
          retention-days: 14
      - name: Run independent INT006R radius × geometry validation on live captures
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE/AutoDraw_Stage20;$env:GITHUB_WORKSPACE/AutoDraw_Stage20/source/preparation;$env:GITHUB_WORKSPACE/AutoDraw_Stage20/source/executor"
          python source/preparation/chalk_int006r_validation.py --journal data/results/brush_behavior_tests/chalk_test_blocks/chalk-block-INT006R-chalk-20261103-030837-a20df5-a8e0b9ec.json --results-dir data/results/brush_behavior_tests --output "$env:RUNNER_TEMP/int006r-live-validation/analysis.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload INT006R live validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autodraw-int006r-live-validation
          path: ${{ runner.temp }}/int006r-live-validation/
          if-no-files-found: warn
          retention-days: 14
      - name: Package INT006R before/after PNGs for manual visual review
        if: always()
        shell: pwsh
        run: |
          $journalPath = "data/results/brush_behavior_tests/chalk_test_blocks/chalk-block-INT006R-chalk-20261103-030837-a20df5-a8e0b9ec.json"
          $journal = Get-Content $journalPath -Raw | ConvertFrom-Json
          if ($journal.tasks.Count -ne 45) { throw "Expected 45 INT006R tasks, found $($journal.tasks.Count)." }
          $sourceRoot = "data/results/brush_behavior_tests"
          $targetRoot = Join-Path $env:RUNNER_TEMP "int006r-visual-review-source"
          New-Item -ItemType Directory -Path $targetRoot -Force | Out-Null
          $copied = 0
          foreach ($task in $journal.tasks) {
            $attempt = $task.attempts | Where-Object { $_.status -eq "completed" } | Select-Object -First 1
            if ($null -eq $attempt) { throw "Completed attempt missing for task $($task.task_id)." }
            $directoryName = Split-Path -Path $attempt.experiment_dir -Leaf
            $sourceDirectory = Join-Path $sourceRoot $directoryName
            $targetDirectory = Join-Path $targetRoot $directoryName
            New-Item -ItemType Directory -Path $targetDirectory -Force | Out-Null
            foreach ($fileName in @("before_clear-board.png", "after_draw-board.png", "experiment.json", "monitor_report.json")) {
              $sourceFile = Join-Path $sourceDirectory $fileName
              if (-not (Test-Path $sourceFile -PathType Leaf)) { throw "Missing $fileName for $($task.task_id)." }
              Copy-Item $sourceFile (Join-Path $targetDirectory $fileName) -Force
              $copied++
            }
          }
          if ($copied -ne 180) { throw "Expected 180 visual review source files, copied $copied." }
      - name: Upload INT006R visual review source captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autodraw-int006r-visual-review-source
          path: ${{ runner.temp }}/int006r-visual-review-source/
          if-no-files-found: error
          retention-days: 14

  integration-tests:
    name: Application integration tests
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: AutoDraw_Stage20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            AutoDraw_Stage20/source/preparation/requirements.txt
            AutoDraw_Stage20/source/executor/requirements.txt
      - name: Install application test dependencies
        run: python -m pip install -r source/preparation/requirements.txt -r source/executor/requirements.txt pytest
      - name: Run unified application and G3 handoff tests
        timeout-minutes: 3
        working-directory: AutoDraw_Stage20/source/preparation
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\\AutoDraw_Stage20;$env:GITHUB_WORKSPACE\\AutoDraw_Stage20\\source\\preparation;$env:GITHUB_WORKSPACE\\AutoDraw_Stage20\\source\\executor"
          python -m pytest -q -ra ..\\..\\tests\\test_unified_app.py
      - name: Run root build, import and test-runner regressions
        timeout-minutes: 5
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\\AutoDraw_Stage20;$env:GITHUB_WORKSPACE\\AutoDraw_Stage20\\source\\preparation;$env:GITHUB_WORKSPACE\\AutoDraw_Stage20\\source\\executor"
          python -m pytest -q -ra tests/test_build_helpers.py tests/test_test_runner.py tests/test_brush_experiment_series.py tests/test_import_resolution_diagnostics.py
      - name: Run root geometry validator and metric tests
        timeout-minutes: 5
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\\AutoDraw_Stage20;$env:GITHUB_WORKSPACE\\AutoDraw_Stage20\\source\\preparation;$env:GITHUB_WORKSPACE\\AutoDraw_Stage20\\source\\executor"
          python -m pytest -q -ra tests/test_fallback_sweep_metrics.py tests/test_stage7_validator_rules.py

  executor-tests:
    name: Executor regression tests
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: AutoDraw_Stage20/source/executor
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            AutoDraw_Stage20/source/executor/requirements.txt
            AutoDraw_Stage20/source/preparation/requirements.txt
      - name: Install executor test dependencies
        run: python -m pip install -r requirements.txt -r ..\preparation\requirements.txt pytest
      - name: Run executor regression tests
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\AutoDraw_Stage20;$env:GITHUB_WORKSPACE\AutoDraw_Stage20\source\preparation;$env:GITHUB_WORKSPACE\AutoDraw_Stage20\source\executor;$env:GITHUB_WORKSPACE\AutoDraw_Stage20\source\executor\tests"
          python -m unittest discover -s tests -v

  windows-build-smoke:
    name: Windows portable build and startup smoke-test
    needs:
      - game-monitor-tests
      - preparation-tests
      - integration-tests
      - executor-tests
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: AutoDraw_Stage20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            AutoDraw_Stage20/requirements-build.txt
            AutoDraw_Stage20/requirements-runtime.txt
      - name: Build portable application after all regression suites pass
        shell: cmd
        env:
          AUTODRAW_NO_PAUSE: "1"
          AUTODRAW_SKIP_TESTS: "1"
        run: build_windows.bat
      - name: Upload portable application for local G3 preflight
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: autodraw-g3-preflight-build
          path: AutoDraw_Stage20/release/AutoDrawPortable/
          if-no-files-found: error
          retention-days: 7
      - name: Run Egret CanvasRenderer reference harness in headless Edge
        shell: pwsh
        run: |
          $outputDir = Join-Path $env:RUNNER_TEMP "egret-renderer-reference"
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          $server = Start-Process -FilePath "python" -ArgumentList @("-m", "http.server", "8765", "--bind", "127.0.0.1") -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                Invoke-WebRequest -Uri "http://127.0.0.1:8765/AutoDraw_Stage20/tests/game_renderer_reference.html" -TimeoutSec 2 | Out-Null
                $ready = $true
                break
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $ready) { throw "Local HTTP server did not become ready." }

            $bundleResponse = Invoke-WebRequest -Uri "http://127.0.0.1:8765/AutoDraw_Stage20/gameEngine/mergeEngine_df2e5bc5.js" -TimeoutSec 10
            if ($bundleResponse.StatusCode -ne 200 -or $bundleResponse.Content.Length -lt 100000) {
              throw "Egret bundle HTTP check failed: status=$($bundleResponse.StatusCode), chars=$($bundleResponse.Content.Length)."
            }
            Write-Host "Egret bundle HTTP check: status=$($bundleResponse.StatusCode), chars=$($bundleResponse.Content.Length)."

            $edgeCandidates = @(
              (Join-Path ${env:ProgramFiles(x86)} "Microsoft\Edge\Application\msedge.exe"),
              (Join-Path $env:ProgramFiles "Microsoft\Edge\Application\msedge.exe")
            )
            $edgePath = $edgeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $edgePath) { throw "Microsoft Edge executable was not found on the Windows runner." }

            $domPath = Join-Path $env:RUNNER_TEMP "egret-renderer-reference-dom.html"
            $stderrPath = Join-Path $env:RUNNER_TEMP "egret-renderer-reference-edge-stderr.log"
            $browserArgs = @(
              "--headless",
              "--disable-gpu",
              "--no-sandbox",
              "--disable-dev-shm-usage",
              "--dump-dom",
              "--user-data-dir=$(Join-Path $env:RUNNER_TEMP 'egret-edge-profile')",
              "http://127.0.0.1:8765/AutoDraw_Stage20/tests/game_renderer_reference.html"
            )
            $browser = Start-Process -FilePath $edgePath -ArgumentList $browserArgs -RedirectStandardOutput $domPath -RedirectStandardError $stderrPath -PassThru -Wait
            if ($browser.ExitCode -ne 0) {
              if (Test-Path $stderrPath) { Get-Content $stderrPath }
              throw "Headless Edge exited with code $($browser.ExitCode)."
            }

            $dom = Get-Content -Raw $domPath
            if ($dom -notmatch 'data-reference-status="complete"' -or $dom -notmatch 'data-fixture-count="18"') {
              $diagnosticDomPath = Join-Path $outputDir "page-dom-diagnostic.html"
              Set-Content -Path $diagnosticDomPath -Value $dom -Encoding utf8
              if (Test-Path $stderrPath) {
                Copy-Item $stderrPath (Join-Path $outputDir "edge-stderr.log") -Force
                Write-Host "Headless Edge stderr:"
                Get-Content $stderrPath
              }
              $statusMatch = [regex]::Match($dom, '<p id="renderer-status"[^>]*>(.*?)</p>', [System.Text.RegularExpressions.RegexOptions]::Singleline)
              if ($statusMatch.Success) {
                Write-Host "Renderer status from DOM: $([System.Net.WebUtility]::HtmlDecode($statusMatch.Groups[1].Value))"
              } else {
                Write-Host "Renderer status element was not present in dumped DOM."
              }
              Write-Host "Headless Edge DOM diagnostic (first 16000 characters):"
              Write-Host $dom.Substring(0, [Math]::Min(16000, $dom.Length))
              throw "Egret reference page did not report 18 completed fixtures; diagnostic DOM saved to artifact."
            }

            $manifestMatch = [regex]::Match($dom, '<pre id="renderer-manifest-json"[^>]*>(.*?)</pre>', [System.Text.RegularExpressions.RegexOptions]::Singleline)
            if (-not $manifestMatch.Success) { throw "Renderer fixture manifest was not serialized into the page DOM." }
            $manifestJson = [System.Net.WebUtility]::HtmlDecode($manifestMatch.Groups[1].Value)
            $manifest = $manifestJson | ConvertFrom-Json
            if ($manifest.fixtures.Count -ne 18) { throw "Expected 18 fixture entries in the manifest." }
            Set-Content -Path (Join-Path $outputDir "manifest.json") -Value $manifestJson -Encoding utf8

            $pngPattern = '<a(?=[^>]*href="data:image/png;base64,([^"]+)")(?=[^>]*download="([^"]+)")[^>]*>'
            $pngMatches = [regex]::Matches($dom, $pngPattern)
            if ($pngMatches.Count -ne 36) { throw "Expected 36 PNG download links, found $($pngMatches.Count)." }
            foreach ($match in $pngMatches) {
              $pngBytes = [Convert]::FromBase64String($match.Groups[1].Value)
              $pngName = [System.IO.Path]::GetFileName($match.Groups[2].Value)
              [System.IO.File]::WriteAllBytes((Join-Path $outputDir $pngName), $pngBytes)
            }
            Write-Host "Egret CanvasRenderer generated $($manifest.fixtures.Count) fixtures and $($pngMatches.Count) PNG files."
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
      - name: Upload Egret renderer reference PNG fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autodraw-egret-renderer-reference
          path: ${{ runner.temp }}/egret-renderer-reference/
          if-no-files-found: warn
          retention-days: 14

  algorithm-benchmarks:
    name: Optional algorithm benchmarks
    if: github.event_name == 'workflow_dispatch' && inputs.run_algorithm_benchmarks == true
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: AutoDraw_Stage20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            AutoDraw_Stage20/source/preparation/requirements.txt
            AutoDraw_Stage20/source/executor/requirements.txt
      - name: Install benchmark dependencies
        run: python -m pip install -r source/preparation/requirements.txt -r source/executor/requirements.txt
      - name: Fetch master benchmark reference
        shell: pwsh
        run: git fetch origin master --depth=1
      - name: Diagnose reference image and report game point calibration
        shell: pwsh
        run: |
          python tests\diagnose_reference_image.py --git-ref origin/master --git-path AutoDraw_Stage20/testImages/images.png --target-width 646 --target-height 323 --fit-mode contain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests\report_game_point_calibration.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Benchmark drawing algorithms (Stage 5)
        shell: pwsh
        run: |
          python tests\benchmark_drawing_algorithms.py --git-ref origin/master --git-path AutoDraw_Stage20/testImages/images.png --target-width 646 --target-height 323 --palette-json data/palettes/profiles/Browser_palette.autodraw-palette.json --background-mode edge-connected --target-usage-percent 75 --output benchmark-results/stage5-report.json --preview-dir benchmark-results/previews
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Benchmark interior fill (Stage 7)
        shell: pwsh
        run: |
          python tests\benchmark_stage7_interior_fill.py --git-ref HEAD --git-path AutoDraw_Stage20/testImages/images.png --target-width 646 --target-height 323 --palette-json data/palettes/profiles/Browser_palette.autodraw-palette.json --background-mode edge-connected --output benchmark-results/stage7-report.json --preview-dir benchmark-results/stage7-previews
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate and benchmark deterministic Stage 7 synthetic cases
        shell: pwsh
        run: |
          $fixtureDir = Join-Path $env:GITHUB_WORKSPACE "AutoDraw_Stage20/benchmark-results/stage7-synthetic-inputs"
          python tests\generate_stage7_synthetic_cases.py --output-dir $fixtureDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem $fixtureDir -Filter *.png | ForEach-Object {
            $name = [System.IO.Path]::GetFileNameWithoutExtension($_.Name)
            python tests\benchmark_stage7_interior_fill.py --image-file $_.FullName --target-width 646 --target-height 323 --palette-json data/palettes/profiles/Browser_palette.autodraw-palette.json --background-mode edge-connected --output "benchmark-results/stage7-synthetic/$name-report.json" --preview-dir "benchmark-results/stage7-synthetic/$name-previews"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $reportDir = Join-Path $env:GITHUB_WORKSPACE "AutoDraw_Stage20/benchmark-results/stage7-synthetic"
          python tests\validate_stage7_synthetic_reports.py --report-dir $reportDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sweep fallback merge tolerances (Stage 7)
        shell: pwsh
        run: |
          $reportDir = Join-Path $env:GITHUB_WORKSPACE "AutoDraw_Stage20/benchmark-results/stage7-synthetic"
          python tests\benchmark_stage7_fallback_merge_sweep.py --output (Join-Path $reportDir "fallback-merge-gap-sweep.json")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Benchmark Stage 8 geometry budget and preview quality
        shell: pwsh
        run: |
          python tests\benchmark_stage8_geometry_budget.py --git-ref origin/master --git-path AutoDraw_Stage20/testImages/images.png --target-width 646 --target-height 323 --palette-json data/palettes/profiles/Browser_palette.autodraw-palette.json --board-item-type BoardItem2 --target-usage-percent 75 --output benchmark-results/stage8/report.json --artifact-dir benchmark-results/stage8/cases
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests\validate_stage8_geometry_budget_report.py --report benchmark-results/stage8/report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compare outline-first and interior-fill strategies
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\AutoDraw_Stage20;$env:GITHUB_WORKSPACE\AutoDraw_Stage20\source\preparation"
          python tests\benchmark_outline_first_fill.py --output benchmark-results/outline-first-comparison.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload algorithm benchmark reports and previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autodraw-algorithm-benchmarks
          path: benchmark-results/
          if-no-files-found: ignore
          retention-days: 7
