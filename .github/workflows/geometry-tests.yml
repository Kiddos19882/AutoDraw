name: Geometry planner tests

on:
  push:
    branches:
      - feature/image-geometry-optimization
  pull_request:
    paths:
      - "AutoDraw_Stage20/source/preparation/geometry_color_plan.py"
      - "AutoDraw_Stage20/source/preparation/tests/test_geometry_color_plan.py"
      - ".github/workflows/geometry-tests.yml"

permissions:
  contents: read

jobs:
  geometry-tests:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: AutoDraw_Stage20/source/preparation
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy pillow opencv-python pytest
      - name: Run geometry planner tests
        run: python -m pytest -q tests
