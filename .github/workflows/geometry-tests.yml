name: Geometry planner tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - feature/hybrid-palette-optimization
    paths:
      - "AutoDraw_Stage20/source/preparation/**"
      - ".github/workflows/geometry-tests.yml"
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  geometry-tests:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: AutoDraw_Stage20/source/preparation
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy pillow opencv-python pytest
      - name: Run geometry planner tests
        run: python -m pytest -q tests/test_geometry_color_plan.py
